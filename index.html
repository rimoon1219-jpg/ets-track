    navigator.clipboard.writeText(header)
      .then(() => showToast('テンプレート行をコピーしました。Excelに貼り付けてください'))
      .catch(() => showToast('コピーできませんでした。手動で選択してコピーしてください'));
  }

  async function deleteRecord(id) {
    const prefix = tab === 'sched' ? 'sched' : 'mgmt';
    const source = tab === 'sched' ? schedRecords : mgmtRecords;
    const record = source.find((r) => r.id === id);
    if (!window.confirm(`「${record ? record.name : 'この現場'}」を削除しますか？（あとでゴミ箱から復元できます）`)) return;
    // 以前は「ゴミ箱へ保存」→「本体を削除」を順番に待ってから画面を更新していたため、
    // 通信のたびに待ち時間が積み重なって「削除しました」と出るまで遅く感じられた。
    // 先に画面から消してしまい（ゴミ箱からいつでも復元できるので安全）、
    // ゴミ箱への保存と本体削除の2つの通信は同時並行で進める。
    lastLocalWriteRef.current = Date.now();
    if (prefix === 'sched') setSchedRecords((prev) => prev.filter((r) => r.id !== id));
    else setMgmtRecords((prev) => prev.filter((r) => r.id !== id));
    try {
      const trashPromise = record
        ? storage.set(`trash:${id}`, JSON.stringify({ ...record, _type: prefix, deletedAt: new Date().toISOString() }), true)
        : Promise.resolve({ queued: false });
      const deletePromise = storage.delete(`${prefix}:${id}`, true);
      const [, deleteResult] = await Promise.all([trashPromise, deletePromise]);
      showToast(deleteResult.queued ? '削除を保留しました。電波が戻り次第、自動的に反映されます' : '削除しました（ゴミ箱に30日間残ります）');
    } catch (e) {
      showToast('削除に失敗しました。もう一度お試しください');
      load(); // 失敗した場合は一覧をサーバーの状態に戻す
    }
  }

  // 重複登録モーダルの「これを削除」用。重複チェックは常に予定表(sched)のデータが対象のため、

  // 「これを残して他を削除」で、削除する方にしか入っていなかった情報（監督名・電話など）を
  // 残す方へ引き継ぐ。残す方がすでに入力済みの項目は上書きしない（空欄だった項目だけ埋める）。
  function mergeFilledFields(keep, others) {
    const MERGE_FIELDS = ['supervisorName', 'supervisorPhone', 'houseNumber', 'note', 'address', 'area', 'time', 'expectedVisits'];
    const merged = { ...keep };
    let changed = false;
    MERGE_FIELDS.forEach((field) => {
      if (!(merged[field] || '').toString().trim()) {
        const source = others.find((o) => (o[field] || '').toString().trim());
        if (source) { merged[field] = source[field]; changed = true; }
      }
    });
    // ガラ必須・軽トラ指定はどちらかにチェックがあれば、見落とし防止のため残す方にも引き継ぐ
    ['garaRequired', 'keiTruckRequired'].forEach((field) => {
      if (!merged[field] && others.some((o) => o[field])) { merged[field] = true; changed = true; }
    });
    // 写真は消さずに両方まとめて残す（同じ画像は重複させない）
    const existingUrls = new Set((merged.photos || []).map((p) => p.img));
    const extraPhotos = others.flatMap((o) => o.photos || []).filter((p) => !existingUrls.has(p.img));
    if (extraPhotos.length > 0) { merged.photos = [...(merged.photos || []), ...extraPhotos]; changed = true; }
    return { merged, changed };
  }

  // 重複登録モーダルの「これを残して他を削除」用。個別に確認ダイアログを出さず、
  // グループ内の選んだ1件以外をまとめてゴミ箱送りにする（30日間は復元可能）。
  // その際、削除する方にしか入っていなかった情報は残す方へ自動で引き継ぐ。
  async function keepOnlyInDuplicateGroup(group, keepId) {
    const sameIdAsKeep = group.filter((r) => r.id === keepId);
    const others = group.filter((r) => r.id !== keepId);
    // まれに、保存時の通信トラブルなどでバックエンド側に「同じキーの行」が2つできてしまうことがある。
    // その場合、グループ内の全レコードが同じidを持つため、id基準の比較では「残す方／消す方」を
    // 区別できず、通常の削除ロジック（idで絞り込む）が静かに何もしないまま終わってしまう。
    // このケースでは、同じidの行を一旦削除してから、新しいidを振り直して1件だけ保存し直すことで、
    // バックエンド側の二重行を確実に1件へ統合する。
    if (others.length === 0 && sameIdAsKeep.length > 1) {
      const keep = sameIdAsKeep[0];
      lastLocalWriteRef.current = Date.now();
      const newId = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      const resaved = { ...keep, id: newId };
      setSchedRecords((prev) => {
        let kept = false;
        return prev
          .filter((r) => {
            if (r.id !== keepId) return true;
            if (kept) return false; // 同じidの2件目以降は画面から消す
            kept = true;
            return false; // 元の1件目もいったん外し、下でnewIdの1件に差し替える
          })
          .concat([resaved]);
      });
      try {
        await storage.set(`trash:${keepId}`, JSON.stringify({ ...keep, _type: 'sched', deletedAt: new Date().toISOString() }), true);
        await storage.delete(`sched:${keepId}`, true);
        await storage.set(`sched:${newId}`, JSON.stringify(resaved), true);
        showToast('重複していたデータを1件にまとめました（元のデータはゴミ箱に30日間残ります）');
      } catch (e) {
        showToast('統合に失敗しました。もう一度お試しください');
        load();
      }
      return;
    }
    const keep = sameIdAsKeep[0];
    if (!keep || others.length === 0) return;
    // 確認はアプリ内の専用モーダル（dupConfirm）側で先に済ませているので、ここでは実行するだけ。
    lastLocalWriteRef.current = Date.now();
    const { merged, changed } = mergeFilledFields(keep, others);
    const ids = others.map((r) => r.id);
    setSchedRecords((prev) => prev.map((r) => (r.id === keepId ? merged : r)).filter((r) => !ids.includes(r.id)));
    try {
      const tasks = others.map((r) => Promise.all([
        storage.set(`trash:${r.id}`, JSON.stringify({ ...r, _type: 'sched', deletedAt: new Date().toISOString() }), true),
        storage.delete(`sched:${r.id}`, true),
      ]));
      if (changed) tasks.push(storage.set(`sched:${keepId}`, JSON.stringify(merged), true));
      await Promise.all(tasks);
      showToast(changed ? `${others.length}件を削除し、監督名・電話などの情報を残す方に引き継ぎました` : `${others.length}件を削除しました（ゴミ箱に30日間残ります）`);
    } catch (e) {
      showToast('削除に失敗しました。もう一度お試しください');
      load();
    }
  }

  async function loadTrash() {
    const list = await storage.list('trash:', true);
    const items = (await Promise.all(
      ((list && list.keys) || []).map(async (k) => {
        try {
          const r = await storage.get(k, true);
          return r && r.value ? JSON.parse(r.value) : null;
        } catch (e) { return null; }
      })
    )).filter(Boolean);
    items.sort((a, b) => (b.deletedAt || '').localeCompare(a.deletedAt || ''));
    // 30日を過ぎたゴミ箱の中身は自動で完全削除する
    const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
    const fresh = [];
    for (const item of items) {
      const t = item.deletedAt ? new Date(item.deletedAt).getTime() : 0;
      if (t && t < cutoff) {
        try { await storage.delete(`trash:${item.id}`, true); } catch (e) { /* ignore */ }
      } else {
        fresh.push(item);
      }
    }
    setTrashItems(fresh);
  }

  async function restoreFromTrash(item) {
    const { _type, deletedAt, ...rest } = item;
    await storage.set(`${_type}:${item.id}`, JSON.stringify(rest), true);
    await storage.delete(`trash:${item.id}`, true);
    showToast(`「${item.name}」を復元しました`);
    setTrashItems((prev) => prev.filter((t) => t.id !== item.id));
    load();
  }

  async function addPhotoToMgmt(id, staffName, files, recordTab) {
    const activeTab = recordTab || tab;
    const source = activeTab === 'sched' ? schedRecords : mgmtRecords;
    const prefix = activeTab === 'sched' ? 'sched' : 'mgmt';
    const record = source.find((r) => r.id === id);
    if (!record) return;
    const fileArray = files instanceof File ? [files] : Array.from(files);
    showToast(`アップロード中…（${fileArray.length}枚）`);
    // 連棟などで枚数が多い時にまとめて待たされないよう、少しずつ並行してアップロードする
    const uploadResults = new Array(fileArray.length).fill(null);
    let queuedCount = 0;
    await runWithLimit(fileArray, 3, async (file, idx) => {
      try {
        const dataUrl = await compressImage(file);
        const url = await storage.uploadPhoto(dataUrl, `${id}_${Date.now()}_${idx}.jpg`, id, staffName, prefix);
        if (url) {
          uploadResults[idx] = { staff: staffName || '担当者', img: url, at: Date.now() };
        } else {
          queuedCount++;
        }
      } catch (e) {
        showToast(e.message || '写真の保存に失敗しました');
      }
    });
    if (queuedCount > 0) showToast(`一部の写真（${queuedCount}枚）は保留中です。あとで自動的に追加されます`);
    const newPhotos = uploadResults.filter(Boolean);
    // 他のスタッフが直前・同時に同じ現場へ写真を追加しているかもしれないので、手元の（古いかもしれない）
    // データにそのまま追加するのではなく、上書き直前にサーバーの最新状態を取り直してから合体する
    // （同時に追加した相手の写真が消えてしまう事故を防ぐため）
    let latest = record;
    try {
      const fresh = await storage.get(`${prefix}:${id}`, true);
      if (fresh && fresh.value) latest = JSON.parse(fresh.value);
    } catch (e) { /* 取得に失敗しても手元のデータで続行 */ }
    const photos = [...(latest.photos || []), ...newPhotos];
    const updated = { ...latest, photos };
    await storage.set(`${prefix}:${id}`, JSON.stringify(updated), true);
    applyLocalRecordUpdate(prefix, updated);
    showToast(`写真を${newPhotos.length}枚追加しました`);
  }

  function buildExportText() {
    const groups = {};
    const order = [];
    filtered.forEach((r) => {
      if (!groups[r.kumiten]) { groups[r.kumiten] = []; order.push(r.kumiten); }
      groups[r.kumiten].push(r);
    });
    const sections = order.map((kumiten) => {
      const lines = groups[kumiten].map((r) => {
        const sched = schedRecords.find((s) => s.name.trim() === r.name.trim());
        const supervisor = (sched && sched.supervisorName) ? sched.supervisorName : '（未登録）';
        const houseNo = (sched && sched.houseNumber) ? sched.houseNumber : '（未登録）';
        return `【${r.name}】\n日付：${r.date}\n監督：${supervisor}／ハウスNo・事業場コード：${houseNo}\n内訳：${r.items || '(未入力)'}`;
      });
      return `■${kumiten}\n\n` + lines.join('\n\n');
    });
    return sections.join('\n\n----------\n\n');
  }

  // 監督名簿・現場データの両方から、名前に一致する電話番号を探す
  function findSupervisorPhone(kumiten, name) {
    const trimmed = (name || '').trim();
    if (!kumiten || !trimmed) return '';
    const inDirectory = (supervisorDirectory[kumiten] || []).find((s) => s.name === trimmed);
    if (inDirectory && inDirectory.phone) return inDirectory.phone;
    const candidates = schedRecords
      .filter((r) => r.kumiten === kumiten && (r.supervisorName || '').trim() === trimmed && r.supervisorPhone)
      .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    return candidates[0] ? candidates[0].supervisorPhone : '';

  // 「名前 電話番号」を1行ずつ貼り付けたテキストから監督名簿に一括登録する
  async function importSupervisorBulkText() {
    const kumiten = supervisorEditorKumiten;
    const lines = supervisorBulkText.split('\n').map((l) => l.trim()).filter(Boolean);
    if (lines.length === 0) { showToast('貼り付ける内容がありません'); return; }
    const parsed = [];
    const skipped = [];
    lines.forEach((line) => {
      // 「名前」と「電話番号（数字だけ）」を、間の空白・全角スペースで区切る想定
      const m = line.match(/^([^\s　]+)[\s　]+([0-9\s　-]+)$/);
      if (!m) { skipped.push(line); return; }
      const name = m[1].trim();
      const phone = m[2].replace(/[\s　-]/g, '');
      if (!name || !phone) { skipped.push(line); return; }
      parsed.push({ name, phone });
    });
    if (parsed.length === 0) { showToast('名前と電話番号として読み取れる行がありませんでした'); return; }
    const existing = supervisorDirectory[kumiten] || [];
    const map = new Map(existing.map((s) => [s.name, s.phone]));
    // 同じ電話番号が既に別の名前に登録されている場合は、上書きせず警告だけ出す（間違って混ざらないように）
    const duplicatePhoneWarnings = [];
    parsed.forEach((s) => {
      const dupe = Array.from(map.entries()).find(([n, p]) => p === s.phone && n !== s.name);
      if (dupe) duplicatePhoneWarnings.push(`${s.name}と${dupe[0]}が同じ電話番号（${s.phone}）`);
      map.set(s.name, s.phone);
    });
    const next = { ...supervisorDirectory, [kumiten]: Array.from(map.entries()).map(([name, phone]) => ({ name, phone })) };
    await saveSupervisorDirectory(next);
    setSupervisorBulkText('');
    let msg = `${kumiten}に${parsed.length}件登録しました`;
    if (skipped.length > 0) msg += `（読み取れなかった行：${skipped.length}件）`;
    showToast(msg);
    if (duplicatePhoneWarnings.length > 0) {
      window.alert(`電話番号の重複があります。念のため確認してください：\n${duplicatePhoneWarnings.join('\n')}`);
    }
  }

  // 参考ファイルの行をそのまま貼り付けて登録できるようにするパーサー。
  // 対応形式：「現場名：X／ハウスNo：Y／現場監督：Z／確認日：W」「AAA → 監督名」など
  async function importIdentifiedSitesBulkText() {
    const kumiten = identifiedSitesKumiten;
    const lines = identifiedSitesBulkText.split('\n').map((l) => l.trim()).filter(Boolean);
    if (lines.length === 0) { showToast('貼り付ける内容がありません'); return; }
    const parsed = [];
    const skipped = [];
    lines.forEach((line) => {
      const entry = { kumiten, siteName: '', houseNumber: '', supervisorName: '', supervisorPhone: '', confirmedDate: '' };
      if (line.includes('→')) {
        const [left, right] = line.split('→').map((s) => s.trim());
        entry.siteName = left;
        entry.supervisorName = right || '';
      } else if (line.includes('／') || /[：:]/.test(line)) {
        line.split('／').forEach((part) => {
          const m = part.split(/[：:]/);
          if (m.length < 2) return;
          const key = m[0].trim();
          const val = m.slice(1).join(':').trim();
          if (key === '現場名') entry.siteName = val;
          else if (key === '住所' && !entry.siteName) entry.siteName = val;
          else if ((key === 'ハウスNo' || key === '事業場コード') && !entry.houseNumber) entry.houseNumber = val;
          else if (key === '現場監督' || key === '監督名' || key === '担当者') {
            const phoneMatch = val.match(/[（(]([\d\-]+)[）)]/);
            entry.supervisorName = val.replace(/[（(][\d\-]+[）)]/, '').trim();
            if (phoneMatch) entry.supervisorPhone = phoneMatch[1].replace(/-/g, '');
          } else if (key === '確認日') entry.confirmedDate = val;
        });
      } else {
        skipped.push(line);
        return;
      }
      if (!entry.siteName) { skipped.push(line); return; }
      parsed.push(entry);
    });
    if (parsed.length === 0) { showToast('現場名として読み取れる行がありませんでした'); return; }
    const map = new Map(identifiedSites.map((s) => [`${s.kumiten}__${s.siteName}`, s]));
    parsed.forEach((e) => { map.set(`${e.kumiten}__${e.siteName}`, e); });
    await saveIdentifiedSites(Array.from(map.values()));
    setIdentifiedSitesBulkText('');
    let msg = `${parsed.length}件登録・更新しました`;
    if (skipped.length > 0) msg += `（読み取れなかった行：${skipped.length}件）`;
    showToast(msg);
  }
  // 現場名が完全一致するものだけを候補にする（あいまい一致はしない：過去に間違った候補を出した反省から）。
  // 「未登録を埋める」だけでなく、「すでに入っている監督名・ハウスNoと、特定済みデータの内容が違う」
  // （担当替えなど）ケースも見つけて提案する。ただしこちらは上書きになるので、
  // デフォルトではチェックを入れず、必ず確認してから反映してもらう。
  function findReconcileMatches() {
    const matches = [];
    schedRecords.forEach((r) => {
      if (!HOUSE_NUMBER_KUMITEN.includes(r.kumiten)) return;
      const site = identifiedSites.find((s) => s.kumiten === r.kumiten && s.siteName.trim() === r.name.trim());
      if (!site) return;
      const currentSupervisor = (r.supervisorName || '').trim();
      const currentHouseNumber = (r.houseNumber || '').trim();
      const siteSupervisor = (site.supervisorName || '').trim();
      const siteHouseNumber = (site.houseNumber || '').trim();

      const fillSupervisor = !currentSupervisor && siteSupervisor ? siteSupervisor : '';
      const fillHouseNumber = !currentHouseNumber && siteHouseNumber ? siteHouseNumber : '';
      const changeSupervisor = currentSupervisor && siteSupervisor && currentSupervisor !== siteSupervisor ? siteSupervisor : '';
      const changeHouseNumber = currentHouseNumber && siteHouseNumber && currentHouseNumber !== siteHouseNumber ? siteHouseNumber : '';
      const newPhone = !(r.supervisorPhone || '').trim() && (site.supervisorPhone || '').trim() ? site.supervisorPhone.trim() : '';

      const newSupervisor = fillSupervisor || changeSupervisor;
      const newHouseNumber = fillHouseNumber || changeHouseNumber;
      if (!newSupervisor && !newHouseNumber) return;
      const isChange = !!changeSupervisor || !!changeHouseNumber;
      matches.push({
        recordId: r.id,
        siteName: r.name,
        kumiten: r.kumiten,
        date: r.date,
        currentSupervisor,
        currentHouseNumber,
        newSupervisor,
        newHouseNumber,
        newPhone,
        confirmedDate: site.confirmedDate || '',
        isChange,
      });
    });
    return matches;
  }
  // 現場名が完全一致はしないが、全角/半角やスペースの違いだけで「実質同じ表記」に見えるものを
  // 候補として拾う。ここは自動で反映せず、必ず見比べて自分で判断してもらう（ボタンを押した時だけ反映）
  function findNearMatches(exactMatches) {
    const matchedIds = new Set((exactMatches || []).map((m) => m.recordId));
    const near = [];
    schedRecords.forEach((r) => {
      if (!HOUSE_NUMBER_KUMITEN.includes(r.kumiten)) return;
      if (matchedIds.has(r.id)) return;
      const needSupervisor = !(r.supervisorName || '').trim();
      const needHouseNumber = !(r.houseNumber || '').trim();
      if (!needSupervisor && !needHouseNumber) return;
      const normRecord = normalizeForCompare(r.name);
      if (!normRecord) return;
      identifiedSites.forEach((s) => {
        if (s.kumiten !== r.kumiten) return;
        if (s.siteName.trim() === r.name.trim()) return; // 完全一致は上のfindReconcileMatchesの方で扱う
        if (normalizeForCompare(s.siteName) !== normRecord) return;
        near.push({
          recordId: r.id,
          etsName: r.name,
          dataName: s.siteName,
          kumiten: r.kumiten,
          date: r.date,
          site: s,
        });
      });
    });
    return near;
  }
  async function applyNearMatch(nm) {
    const rec = schedRecords.find((r) => r.id === nm.recordId);
    if (!rec) return;
    const site = nm.site;
    const updatedRec = {
      ...rec,
      supervisorName: (rec.supervisorName || '').trim() || site.supervisorName || rec.supervisorName,
      houseNumber: (rec.houseNumber || '').trim() || site.houseNumber || rec.houseNumber,
      supervisorPhone: (rec.supervisorPhone || '').trim() || site.supervisorPhone || rec.supervisorPhone,
    };
    await storage.set(`sched:${rec.id}`, JSON.stringify(updatedRec));
    applyLocalRecordUpdate('sched', updatedRec);
    setNearMatches((prev) => prev.filter((x) => !(x.recordId === nm.recordId && x.dataName === nm.dataName)));
    showToast(`「${rec.name}」に反映しました`);
  }
  function openReconcileModal() {
    const matches = findReconcileMatches();
    const near = findNearMatches(matches);
    if (matches.length === 0 && near.length === 0) {
      showToast('照合できる候補が見つかりませんでした（現場名が完全一致する未登録データがありません）');
      return;
    }
    setReconcileMatches(matches);
    // 未登録を埋めるだけのものは最初からチェック済みにするが、
    // 既存の値を上書きする（担当替えなど）ものは、必ず自分の目で確認してもらうため未チェックにしておく
    const checked = {};
    matches.forEach((m) => { checked[m.recordId] = !m.isChange; });
    setReconcileChecked(checked);
    setNearMatches(near);
    setShowReconcileModal(true);
  }
  async function applyReconcile() {
    const toApply = reconcileMatches.filter((m) => reconcileChecked[m.recordId]);
    if (toApply.length === 0) { showToast('チェックが入っている項目がありません'); return; }
    setReconcileBusy(true);
    let count = 0;
    let queuedCount = 0;
    for (const m of toApply) {
      const rec = schedRecords.find((r) => r.id === m.recordId);
      if (!rec) continue;
      const updatedRec = {
        ...rec,
        supervisorName: m.newSupervisor || rec.supervisorName,
        houseNumber: m.newHouseNumber || rec.houseNumber,
        supervisorPhone: rec.supervisorPhone || m.newPhone,
      };
      try {
        const result = await storage.set(`sched:${rec.id}`, JSON.stringify(updatedRec));
        // 保存直後は一覧を読み直さず、その場で反映する（読み直すと、送信がまだサーバーに
        // 届いていない場合に古いデータで上書きしてしまい、「反映した」と表示だけ出て
        // 実際には入っていないように見える不具合の原因になっていたため）
        applyLocalRecordUpdate('sched', updatedRec);
        if (result && result.queued) queuedCount++;
        count++;
      } catch (e) { console.error(e); }
    }
    setReconcileBusy(false);
    if (queuedCount > 0) {
      showToast(`${count}件反映しました（うち${queuedCount}件は電波の状況により保留中。電波が戻り次第、自動的に送信されます）`);
    } else {
      showToast(`${count}件、監督名・ハウスNoを反映しました`);
    }
    setShowReconcileModal(false);
    setReconcileMatches([]);
    setReconcileChecked({});
  }

  async function moveKumiten(index, dir) {
    const next = [...kumitenList];
    const target = index + dir;
    if (target < 0 || target >= next.length) return;
    [next[index], next[target]] = [next[target], next[index]];
    await saveKumitenList(next);
  }

  async function removeKumiten(index) {
    const name = kumitenList[index];
    if (!window.confirm(`「${name}」をリストから削除しますか？（過去のデータは残ります）`)) return;
    const next = kumitenList.filter((_, i) => i !== index);
    await saveKumitenList(next);
  }

  // 工務店名を正式名称などに変更。過去にその工務店名で登録された現場も一括で新しい名前に更新する
  async function renameKumiten(index) {
    const oldName = kumitenList[index];
    const input = window.prompt(`「${oldName}」の新しい名前を入力してください（正式名称など）`, oldName);
    if (!input || !input.trim() || input.trim() === oldName) return;
    const newName = input.trim();
    if (kumitenList.includes(newName)) { showToast('すでに同じ名前があります'); return; }
    const affectedSched = schedRecords.filter((r) => r.kumiten === oldName);
    const affectedMgmt = mgmtRecords.filter((r) => r.kumiten === oldName);
    const affected = [...affectedSched, ...affectedMgmt];
    if (affected.length > 0 && !window.confirm(`「${oldName}」で登録済みの現場が${affected.length}件あります。すべて「${newName}」に変更しますか？`)) return;
    setLoading(true);
    try {
      for (const r of affectedSched) {
        await storage.set(`sched:${r.id}`, JSON.stringify({ ...r, kumiten: newName }));
      }
      for (const r of affectedMgmt) {
        await storage.set(`mgmt:${r.id}`, JSON.stringify({ ...r, kumiten: newName }));
      }
      const next = kumitenList.map((k, i) => (i === index ? newName : k));
      await saveKumitenList(next);
      // あとで元に戻せるよう、変更履歴を残しておく
      const logId = `${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
      await storage.set(`kumitenRenameLog:${logId}`, JSON.stringify({
        id: logId, oldName, newName,
        schedIds: affectedSched.map((r) => r.id),
        mgmtIds: affectedMgmt.map((r) => r.id),
        at: new Date().toISOString(),
      }), true);
      showToast(`「${oldName}」を「${newName}」に変更しました（${affected.length}件更新）`);
    } catch (e) {
      console.error(e);
      showToast('変更に失敗しました');
    }
    await load();
  }

  async function loadRenameHistory() {
    const list = await storage.list('kumitenRenameLog:', true);
    const items = (await Promise.all(
      ((list && list.keys) || []).map(async (k) => {
        try {
          const r = await storage.get(k, true);
          return r && r.value ? JSON.parse(r.value) : null;
        } catch (e) { return null; }
      })
    )).filter(Boolean);
    items.sort((a, b) => (b.at || '').localeCompare(a.at || ''));
    setRenameHistory(items.slice(0, 10));
  }

  async function undoRename(entry) {
    if (!window.confirm(`「${entry.newName}」を「${entry.oldName}」に戻します。よろしいですか？`)) return;
    setLoading(true);
    try {
      if (kumitenList.includes(entry.newName)) {
        const next = kumitenList.map((k) => (k === entry.newName ? entry.oldName : k));
        await saveKumitenList(next);
      }
      for (const id of entry.schedIds || []) {
        const r = await storage.get(`sched:${id}`, true);
        if (r && r.value) {
          const rec = JSON.parse(r.value);
          if (rec.kumiten === entry.newName) await storage.set(`sched:${id}`, JSON.stringify({ ...rec, kumiten: entry.oldName }), true);
        }
      }
      for (const id of entry.mgmtIds || []) {
        const r = await storage.get(`mgmt:${id}`, true);
        if (r && r.value) {
          const rec = JSON.parse(r.value);
          if (rec.kumiten === entry.newName) await storage.set(`mgmt:${id}`, JSON.stringify({ ...rec, kumiten: entry.oldName }), true);
        }
      }
      await storage.delete(`kumitenRenameLog:${entry.id}`, true);
      showToast(`「${entry.oldName}」に戻しました`);
      setRenameHistory((prev) => prev.filter((h) => h.id !== entry.id));
    } catch (e) {
      console.error(e);
      showToast('元に戻すのに失敗しました');
    }
    await load();
  }

  const activeList = tab === 'sched' ? schedRecords : mgmtRecords;
  const statusList = SCHED_STATUSES;
  const collectedNames = new Set(mgmtRecords.map((r) => r.name));

  let filtered = activeList.filter((r) => {
    if (kumitenFilter !== '全て' && r.kumiten !== kumitenFilter) return false;
    if (dateFrom && r.date < dateFrom) return false;
    if (dateTo && r.date > dateTo) return false;
    if (search && !r.name.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });
  if (tab === 'sched' && showUncollectedOnly) filtered = filtered.filter((r) => !collectedNames.has(r.name));

  // ---- dispatch derived data ----
  const daySitesBase = schedRecords.filter((r) => r.date === dispatchDate);
  const extraSites = schedRecords.filter((r) => extraSiteIds.includes(r.id) && r.date !== dispatchDate);
  const daySites = [...daySitesBase, ...extraSites];
  const byArea = {};
  daySites.forEach((s) => {
    const area = s.area || extractArea(s.address) || '未分類';
    if (!byArea[area]) byArea[area] = [];
    byArea[area].push(s);
  });
  const unassignedCount = daySites.filter((s) => !assignments[s.id]).length;
  const truckOptions = buildTruckOptions(regularTruckCount, includeKei, dumpOnlyCount);

  // ---- invoice derived data ----
  // 「追加」「単発」で入力されたのに、まだ金額（項目）が入力されていない記録＝請求の確認待ち一覧
  // 工務店・月をまたいで全部まとめて出すことで、いちいち工務店・月を選び直して探しに行かなくても気づけるようにする
  function needsInvoicePrice(r) {
    return (r.status === '追加' || r.status === '単発') && !r.invoiceDismissed && !(r.lineItems && r.lineItems.length > 0);
  }
  const invoicePendingItems = mgmtRecords.filter(needsInvoicePrice).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const invoiceDismissedItems = mgmtRecords.filter((r) => (r.status === '追加' || r.status === '単発') && r.invoiceDismissed)
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  // 締め日が近い工務店のリマインド（請求書タブの中だけに出す。TODO/伝達には出さない＝新規入力スタッフには関係ないため）
  // 「もうやった」で消した分（今回の締め日と一致するもの）は表示しない。次の月の締め日になれば自動的にまた出る
  const closingReminders = Object.entries(KUMITEN_CLOSING_DAY)
    .map(([kumiten, dayRule]) => ({ kumiten, ...nextClosingDate(dayRule, todayStr()) }))
    .filter((x) => x.diffDays <= CLOSING_REMINDER_LEAD_DAYS)
    .filter((x) => !dismissedClosings.includes(`${x.kumiten}__${x.dateStr}`))
    .sort((a, b) => a.diffDays - b.diffDays);

  async function dismissClosingReminder(kumiten, dateStr) {
    const key = `${kumiten}__${dateStr}`;
    const next = [...dismissedClosings, key];
    setDismissedClosings(next);
    try { await storage.set('meta:dismissedClosings', JSON.stringify(next), true); } catch (e) { /* 保存に失敗しても表示上は消えたままにしておく */ }
  }

  async function dismissInvoiceItem(record) {
    const updated = { ...record, invoiceDismissed: true };
    try {
      await storage.set(`mgmt:${record.id}`, JSON.stringify(updated));
      applyLocalRecordUpdate('mgmt', updated);
      showToast('請求の確認待ちから外しました');

  async function restoreInvoiceItem(record) {

    try {
      await storage.set(`mgmt:${record.id}`, JSON.stringify(updated));
      applyLocalRecordUpdate('mgmt', updated);

  }

  function jumpToInvoiceItem(record) {
    setInvoiceKumiten(record.kumiten);
    setInvoiceMonth((record.date || todayStr()).slice(0, 7));
    setHighlightedInvoiceId(record.id);
    showToast(`${record.kumiten}・${(record.date || '').slice(0, 7)} を表示中。下にスクロールして金額を入力してください`);
    setTimeout(() => {
      if (invoicePriceSectionRef.current) invoicePriceSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 80);
    setTimeout(() => setHighlightedInvoiceId((cur) => (cur === record.id ? null : cur)), 4000);
  }

  async function addAdhocInvoiceSite() {
    const name = invoiceAddName.trim();
    if (!name) { showToast('現場名を入力してください'); return; }
    const date = invoiceAddDate || todayStr();
    const id = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    const record = {
      id, name, kumiten: invoiceKumiten, date, status: invoiceAddStatus,
      staff: deviceStaff || '', items: '', lineItems: [], photos: [], supervisorName: '',
    };
    try {
      await storage.set(`mgmt:${id}`, JSON.stringify(record));
      applyLocalRecordUpdate('mgmt', record);
      showToast('請求の項目を追加しました');
      setInvoiceMonth(date.slice(0, 7));
      setShowInvoiceAddSite(false);
      setInvoiceAddName('');
      setInvoiceAddDate('');
      setInvoiceAddStatus('追加');
    } catch (e) { showToast('保存に失敗しました'); }
  }

  const invoiceRecords = mgmtRecords.filter((r) => r.kumiten === invoiceKumiten && r.date && r.date.startsWith(invoiceMonth) && (r.status === '追加' || r.status === '単発'));
  const invoiceBySite = {};
  invoiceRecords.forEach((r) => {
    if (!invoiceBySite[r.name]) invoiceBySite[r.name] = { name: r.name, items: [] };
    (r.lineItems || []).forEach((it) => {
      const q = parseFloat(it.qty); const p = parseFloat(it.unitPrice);
      const amount = (isNaN(q) || isNaN(p)) ? 0 : q * p;
      invoiceBySite[r.name].items.push({ ...it, amount, date: r.date });
    });
  });
  const invoiceRows = Object.values(invoiceBySite)
    .filter((s) => s.items.length > 0)
    .sort((a, b) => a.name.localeCompare(b.name, 'ja'));
  const invoiceGrandTotal = invoiceRows.reduce((sum, site) => sum + site.items.reduce((s, it) => s + it.amount, 0), 0);

  // ---- 工務店・現場・日付ごとの集計（期間自由指定） ----
  const summaryRecords = mgmtRecords.filter((r) => {
    if (kumitenFilter !== '全て' && r.kumiten !== kumitenFilter) return false;
    if (summaryFrom && r.date < summaryFrom) return false;
    if (summaryTo && r.date > summaryTo) return false;
    return true;
  });

  function recordAmount(r) {
    return (r.lineItems || []).reduce((s, it) => {
      const q = parseFloat(it.qty); const p = parseFloat(it.unitPrice);
      return s + (isNaN(q) || isNaN(p) ? 0 : q * p);
    }, 0);
  }

  const summaryTree = {}; // { kumiten: { siteName: [{date, amount, status}] } }
  summaryRecords.forEach((r) => {
    if (!summaryTree[r.kumiten]) summaryTree[r.kumiten] = {};
    if (!summaryTree[r.kumiten][r.name]) summaryTree[r.kumiten][r.name] = [];
    summaryTree[r.kumiten][r.name].push({ date: r.date, amount: recordAmount(r), status: r.status });
  });

  function buildSummaryTSV() {
    const header = '工務店\t現場名\t日付\tタグ\t金額';
    const rows = [];
    Object.keys(summaryTree).sort().forEach((kumiten) => {
      Object.keys(summaryTree[kumiten]).sort((a, b) => a.localeCompare(b, 'ja')).forEach((site) => {
        summaryTree[kumiten][site].forEach((v) => {
          rows.push(`${kumiten}\t${site}\t${v.date}\t${v.status}\t${Math.round(v.amount)}`);
        });
      });
    });
    const grandTotal = summaryRecords.reduce((s, r) => s + recordAmount(r), 0);
    rows.push(`合計\t\t\t${summaryRecords.length}件\t${Math.round(grandTotal)}`);
    return [header, ...rows].join('\n');
  }

  function buildInvoiceTSV() {
    const header = '現場名\t名称\t数量\t単位\t単価\t金額\t備考（日付）';
    const blocks = invoiceRows.map((site) => {
      const rows = site.items.map((it) => `${site.name}\t${it.name}\t${it.qty}\t${it.unit}\t${it.unitPrice}\t${Math.round(it.amount)}\t${it.date}`);
      const subtotal = site.items.reduce((s, it) => s + it.amount, 0);
      rows.push(`${site.name}\t小計\t\t\t\t${Math.round(subtotal)}\t`);
      return rows.join('\n');
    });
    return [header, ...blocks, `合計\t\t\t\t\t${Math.round(invoiceGrandTotal)}\t`].join('\n');
  }

  function openInvoiceExport() {
    setInvoiceExportText(buildInvoiceTSV());
    setShowInvoiceExport(true);
  }

          <div style={{ fontSize: 15, fontWeight: 800, marginTop: 18, marginBottom: 6 }}>このアカウントは現在ご利用いただけません</div>

          </div>
        </div>
      </div>
    );
  }

  // 担当者名が未設定の端末は、他の画面を一切表示せずここで止める。
  // 「誰が入力したか分からない」を根本からなくすため、使い始める前に一度だけ必ず通す関門にする
  if (!deviceStaff) {
    return (
      <div style={styles.nameGateOverlay}>
        <div style={styles.nameGateCard}>
          <div style={styles.brand}>ETS TRACK</div>
          <div style={styles.brandTag}>Ecolotex Shonan Co., Ltd.</div>
          <div style={{ fontSize: 15, fontWeight: 800, marginTop: 18, marginBottom: 6 }}>はじめに、あなたのお名前を入力してください</div>

            onChange={(e) => setNameGateInput(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter') saveNameGate(); }}
            placeholder="例：本城"
            autoFocus
          />
          <button style={{ ...styles.addBtn, width: '100%', marginTop: 12, justifyContent: 'center' }} onClick={saveNameGate}>
            はじめる
          </button>
        </div>
      </div>
    );
  }

  return (
    <div style={styles.page}>
      <style>{`
        * { box-sizing: border-box; }
        input, select, button, textarea { font-family: inherit; }
        input::placeholder, textarea::placeholder { color: #9A9A94; }
        @keyframes todoBadgePulse {
          0% { box-shadow: 0 0 0 0 rgba(230, 57, 70, 0.55); }
          70% { box-shadow: 0 0 0 6px rgba(230, 57, 70, 0); }
          100% { box-shadow: 0 0 0 0 rgba(230, 57, 70, 0); }
        }
      `}</style>

      <button
        onClick={resetZoomAndScroll}
        title="画面の拡大や位置がおかしくなった時に押してください"
        style={styles.zoomResetBtn}
      >
        ⤢ 表示を元に戻す
      </button>

      <div style={styles.header}>
        <div>
          <div style={styles.brand}>ETS TRACK</div>
          <div style={styles.brandTag}>Ecolotex Shonan Co., Ltd.</div>
          <div style={styles.brandSub}>
            {tab === 'dispatch' ? `${dispatchDate} の配車` : tab === 'gantt' ? '現場の工期を一覧表示' : tab === 'todo' ? 'TODO・伝達（新規入力スタッフ用）' : tab === 'invoice' ? '請求書（社長・洋子さん専用）' : loading ? '読み込み中…' : `${filtered.length}件表示中`}
            {!loading && syncingFromCache && (tab === 'sched' || tab === 'mgmt') && (

        </div>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 6 }}>
          {(tab === 'sched' || tab === 'mgmt') && <button style={styles.addBtn} onClick={openNew}>＋ 追加</button>}
          <button style={styles.staffChip} onClick={changeDeviceStaff}>
            {deviceStaff ? `担当：${deviceStaff}（変更）` : '担当者名を設定'}
          </button>
          {showPendingBadge && (
            <span style={styles.pendingBadge}>⏳ 未送信 {pendingCount}件</span>
          )}
          {tab !== 'todo' && TODO_VIEWERS.includes(deviceStaff) && (() => {

              .filter((t) => memoTargetsMe(t, me))

            if (unseen === 0) return null;
            return (

                        <div style={{ fontSize: 11.5, color: '#8A8A83' }}>監督：{r.supervisorName || '未入力'}／住所：{r.address || '未入力'}</div>
                        <div style={{ fontSize: 11.5, color: '#8A8A83' }}>登録：{r.createdAt ? formatDateTime(r.createdAt) : '不明'}</div>
                      </div>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 4, alignItems: 'flex-end' }}>
                        <button style={styles.pickTempBtn} onClick={() => { setShowDuplicateModal(false); openEdit(r); }}>開く</button>
                        <button style={styles.pickTempBtn} onClick={() => setDupConfirm({ group, keepId: r.id })}>これを残して他を削除</button>
                      </div>
                    </div>
                  ))}
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {showAddressDupModal && (
        <div style={styles.overlay} onClick={() => setShowAddressDupModal(false)}>
          <div style={styles.sheet} onClick={(e) => e.stopPropagation()}>
            <div style={styles.sheetHeader}>
              <div style={styles.sheetTitle}>同じ住所で日付違いの登録</div>
              <button style={styles.closeBtn} onClick={() => setShowAddressDupModal(false)}>✕</button>
            </div>
            <div style={{ fontSize: 12, color: '#8A8A83', marginBottom: 8 }}>
              日程変更などで古い日付の分が消えずに残っている可能性があります。同じ予定であれば片方を削除してください（別の棟・別の予定であれば、そのままで問題ありません）。
            </div>
            <div style={{ marginTop: 4, maxHeight: 420, overflowY: 'auto' }}>
              {findAddressDuplicateGroups().length === 0 && (
                <div style={{ padding: '20px 4px', color: '#8A8A83', fontSize: 13 }}>今は住所違いの重複はなさそうです</div>
              )}
              {findAddressDuplicateGroups().map((group, gi) => (
                <div key={gi} style={{ marginBottom: 16, paddingBottom: 12, borderBottom: '1px solid #EFEDE6' }}>
                  <div style={{ fontWeight: 700, fontSize: 13.5, marginBottom: 6 }}>{group[0].address}（{group.length}件）</div>
                  {group.map((r) => (
                    <div key={r.id} style={styles.extraPickRow}>
                      <div>
                        <div style={{ fontSize: 12.5 }}>{r.date}／{r.name}</div>
                        <div style={{ fontSize: 11.5, color: '#8A8A83' }}>{r.kumiten || '工務店未設定'}／担当：{r.staff || '不明'}／監督：{r.supervisorName || '未入力'}</div>
                        <div style={{ fontSize: 11.5, color: '#8A8A83' }}>登録：{r.createdAt ? formatDateTime(r.createdAt) : '不明'}</div>
                      </div>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 4, alignItems: 'flex-end' }}>
                        <button style={styles.pickTempBtn} onClick={() => { setShowAddressDupModal(false); openEdit(r); }}>開く</button>
                        <button style={styles.pickTempBtn} onClick={() => setDupConfirm({ group, keepId: r.id })}>これを残して他を削除</button>
                      </div>
                    </div>
                  ))}
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {dupConfirm && (
        <div style={{ ...styles.overlay, zIndex: 4000 }} onClick={() => setDupConfirm(null)}>
          <div style={styles.sheet} onClick={(e) => e.stopPropagation()}>
            <div style={styles.sheetHeader}>
              <div style={styles.sheetTitle}>確認</div>
              <button style={styles.closeBtn} onClick={() => setDupConfirm(null)}>✕</button>
            </div>
            <div style={{ fontSize: 13, lineHeight: 1.7, margin: '6px 0 18px' }}>
              「{dupConfirm.group[0].name}」（{dupConfirm.group[0].date}）の重複{dupConfirm.group.length - 1}件を削除して、選んだ1件だけ残します。他の項目にしか入っていない監督名・電話などは自動で引き継ぎます。よろしいですか？（削除した分はゴミ箱から30日間復元できます）
            </div>
            <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
              <button style={styles.pickTempBtn} onClick={() => setDupConfirm(null)}>キャンセル</button>
              <button
                style={{ ...styles.pickTempBtn, background: '#B33A3A', color: '#fff', borderColor: '#B33A3A' }}
                onClick={() => {
                  const { group, keepId } = dupConfirm;
                  setDupConfirm(null);
                  keepOnlyInDuplicateGroup(group, keepId);
                }}
              >
                削除する
              </button>
            </div>
          </div>
        </div>
      )}

      {showAddExtraSite && (
        <div style={styles.overlay} onClick={() => setShowAddExtraSite(false)}>
          <div style={styles.sheet} onClick={(e) => e.stopPropagation()}>
            <div style={styles.sheetHeader}>
              <div style={styles.sheetTitle}>他の日の現場を今日の配車に追加</div>
              <button style={styles.closeBtn} onClick={() => setShowAddExtraSite(false)}>✕</button>
            </div>
            <input
              style={styles.input}
              placeholder="現場名で検索"
              value={extraSiteSearch}
              onChange={(e) => setExtraSiteSearch(e.target.value)}
            />
            <div style={{ marginTop: 10, maxHeight: 320, overflowY: 'auto' }}>
              {schedRecords
                .filter((r) => r.date !== dispatchDate && !extraSiteIds.includes(r.id))
                .filter((r) => !extraSiteSearch || r.name.toLowerCase().includes(extraSiteSearch.toLowerCase()))
                .slice(0, 30)
                .map((r) => (
                  <div key={r.id} style={styles.extraPickRow}>
                    <div>
                      <div style={{ fontWeight: 700, fontSize: 13.5 }}>{r.name}</div>
                      <div style={{ fontSize: 11.5, color: '#8A8A83' }}>{r.date}／{r.kumiten}</div>
                    </div>
                    <div style={{ display: 'flex', gap: 6 }}>
                      <button style={styles.pickMoveBtn} onClick={() => { moveSiteToDate(r); setShowAddExtraSite(false); }}>📅 日付を移動</button>
                      <button style={styles.pickTempBtn} onClick={() => { addExtraSite(r.id); showToast(`${r.name} を一時追加しました`); }}>＋一時追加</button>
                    </div>
                  </div>
                ))}
            </div>
          </div>
        </div>
      )}

      {showBulkUpdate && (
        <div style={styles.overlay} onClick={() => !bulkImportBusy && setShowBulkUpdate(false)}>
          <div style={styles.sheet} onClick={(e) => e.stopPropagation()}>
            <div style={styles.sheetHeader}>
              <div style={styles.sheetTitle}>監督名・ハウスNoを一括更新</div>
              <button style={styles.closeBtn} onClick={() => setShowBulkUpdate(false)}>✕</button>
            </div>
            <div style={styles.exportHint}>
              現場名は既に登録済みのものと完全に一致する必要があります（同じ現場名の予定が複数日あれば、まとめて全部更新されます）。列は「現場名・監督名・監督電話・ハウスNo」の順、タブ区切りで貼り付けてください。
            </div>
            <button style={{ ...styles.linkBtn, marginBottom: 8 }} onClick={copyUpdateTemplate}>見出し行をコピーする</button>
            <textarea
              style={{ ...styles.input, minHeight: 200, fontSize: 12 }}
              value={bulkUpdateText}
              onChange={(e) => setBulkUpdateText(e.target.value)}
              placeholder="ここにExcelからコピーした内容を貼り付け"
            />
            <div style={styles.sheetActions}>
              <button style={styles.saveBtn} onClick={runBulkUpdate} disabled={bulkImportBusy}>
                {bulkImportBusy ? '更新中…' : '更新する'}
              </button>
            </div>
          </div>
        </div>
      )}

      {showBulkImport && (
        <div style={styles.overlay} onClick={() => !bulkImportBusy && setShowBulkImport(false)}>
          <div style={styles.sheet} onClick={(e) => e.stopPropagation()}>
            <div style={styles.sheetHeader}>
              <div style={styles.sheetTitle}>TimeTreeから一括インポート</div>
              <button style={styles.closeBtn} onClick={() => setShowBulkImport(false)}>✕</button>
            </div>
            <div style={styles.exportHint}>
              Excel/スプレッドシートで列を「現場名・工務店・住所・日付・時間・ステータス・監督名・監督電話・ガラ必須・軽トラ指定・想定回数・担当者・注意事項」の順に用意し、その範囲をコピーしてここに貼り付けてください（タブ区切り）。1行1件です。同じ現場名・同じ日付の予定がすでにある場合は自動でスキップされ、重複登録されません。
            </div>
            <button style={{ ...styles.linkBtn, marginBottom: 8 }} onClick={copyImportTemplate}>見出し行をコピーする（Excelの1行目に貼り付け用）</button>
            <textarea
              style={{ ...styles.input, minHeight: 200, fontSize: 12 }}
              value={bulkImportText}
              onChange={(e) => setBulkImportText(e.target.value)}
              placeholder="ここにExcelからコピーした内容を貼り付け"
            />
            <div style={styles.sheetActions}>
              <button style={styles.saveBtn} onClick={runBulkImport} disabled={bulkImportBusy}>
                {bulkImportBusy ? '取り込み中…' : '取り込む'}
              </button>
            </div>
          </div>
        </div>
      )}

      {showMgmtBulkImport && (
        <div style={styles.overlay} onClick={() => !mgmtBulkImportBusy && setShowMgmtBulkImport(false)}>
          <div style={styles.sheet} onClick={(e) => e.stopPropagation()}>
            <div style={styles.sheetHeader}>
              <div style={styles.sheetTitle}>TimeTreeから一括インポート（管理表）</div>
              <button style={styles.closeBtn} onClick={() => setShowMgmtBulkImport(false)}>✕</button>
            </div>
            <div style={styles.exportHint}>
              Googleカレンダーの「予定を検索」の結果画面をそのまま（日付の見出しごと）コピーして、下に貼り付けてください。工務店名は自動で判定し、「不明」は監督名不明の注記として現場名から取り除きます。「終日、」より後ろの内訳はそのまま管理表のメモ欄に入ります。
            </div>
            <label style={styles.label}>この内容にまとめて付けるゴミの種類タグ（貼り付ける内容が全部同じ種類の場合はこのまま。違う場合は登録後に一覧から個別に直してください）</label>
            <div style={styles.statusGrid}>
              {SCHED_STATUSES.map((s) => (
                <button
                  key={s.key}
                  type="button"
                  onClick={() => setMgmtBulkImportStatus(s.key)}
                  style={{ ...styles.statusOption, borderColor: mgmtBulkImportStatus === s.key ? s.color : '#E5E3DC', background: mgmtBulkImportStatus === s.key ? `${s.color}1A` : '#fff' }}
                >
                  <span style={{ ...styles.dot, background: s.color }} />{s.key}
                </button>
              ))}
            </div>
            <textarea
              style={{ ...styles.input, minHeight: 200, fontSize: 12 }}
              value={mgmtBulkImportText}
              onChange={(e) => { setMgmtBulkImportText(e.target.value); setMgmtBulkImportPreview(null); }}
              placeholder={'例：\n2026年9月1日(火)\nメルディア藤沢市羽鳥202 4棟 不明\n終日、木1.2 断熱材0.7 プラ0.4 段ボール0.3 混廃0.2'}
            />
            {!mgmtBulkImportPreview && (
              <div style={styles.sheetActions}>
                <button style={styles.saveBtn} onClick={previewMgmtBulkImport}>内容を確認する</button>
              </div>
            )}
            {mgmtBulkImportPreview && (
              <div style={{ marginTop: 10 }}>
                <div style={{ fontWeight: 700, marginBottom: 4 }}>この内容で{mgmtBulkImportPreview.entries.length}件登録します（種類タグ：{mgmtBulkImportStatus}）</div>
                <div style={{ maxHeight: 260, overflowY: 'auto' }}>
                  {mgmtBulkImportPreview.entries.map((e, i) => (
                    <div key={i} style={{ fontSize: 12.5, padding: '6px 0', borderBottom: '1px solid #F0EFE9' }}>
                      <div style={{ fontWeight: 700 }}>{e.date}／{e.kumiten}／{e.name}{e.supervisorName ? `／監督：${e.supervisorName}` : ''}</div>
                      <div style={{ color: '#8A8A83' }}>{e.items || '（内訳なし）'}</div>
                    </div>
                  ))}
                </div>
                {mgmtBulkImportPreview.unmatchedKumiten.length > 0 && (
                  <div style={{ color: '#B8860B', fontSize: 12.5, marginTop: 8 }}>
                    ⚠️工務店名が判定できず「その他」で登録される項目があります：
                    {mgmtBulkImportPreview.unmatchedKumiten.map((t, i) => (<div key={i}>・{t}</div>))}
                    （あとで一覧から工務店を直してください）
                  </div>
                )}
                <div style={styles.sheetActions}>
                  <button style={{ ...styles.linkBtn }} onClick={() => setMgmtBulkImportPreview(null)}>戻って直す</button>
                  <button style={styles.saveBtn} onClick={runMgmtBulkImport} disabled={mgmtBulkImportBusy}>
                    {mgmtBulkImportBusy ? '登録中…' : `✓ この内容で登録する（${mgmtBulkImportPreview.entries.length}件）`}
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {showBulkDelete && (
        <div style={styles.overlay} onClick={() => setShowBulkDelete(false)}>
          <div style={styles.sheet} onClick={(e) => e.stopPropagation()}>
            <div style={styles.sheetHeader}>
              <div style={styles.sheetTitle}>期間を指定して一括削除（{tab === 'sched' ? '現場予定表' : '現場管理表'}）</div>
              <button style={styles.closeBtn} onClick={() => setShowBulkDelete(false)}>✕</button>
            </div>
            <label style={styles.label}>開始日</label>
            <input type="date" style={styles.input} value={bulkFrom} onChange={(e) => setBulkFrom(e.target.value)} />
            <label style={styles.label}>終了日</label>
            <input type="date" style={styles.input} value={bulkTo} onChange={(e) => setBulkTo(e.target.value)} />
            <div style={styles.sheetActions}><button style={styles.deleteBtn} onClick={bulkDelete}>この期間を削除</button></div>
          </div>
        </div>
      )}

      {showExport && (
        <div style={styles.overlay} onClick={() => setShowExport(false)}>
          <div style={styles.sheet} onClick={(e) => e.stopPropagation()}>
            <div style={styles.sheetHeader}>
              <div style={styles.sheetTitle}>マニフェスト用テキスト</div>
              <button style={styles.closeBtn} onClick={() => setShowExport(false)}>✕</button>
            </div>
            <div style={styles.exportHint}>上の検索・日付・工務店の絞り込みが反映されています。コピーしてマニフェストのプロジェクトチャットに貼り付けてください。</div>
            <textarea style={{ ...styles.input, minHeight: 220, fontSize: 13 }} value={exportText} readOnly />
            <div style={styles.sheetActions}><button style={styles.saveBtn} onClick={copyExport}>コピーする</button></div>
          </div>
        </div>
      )}

      {toast && <div style={styles.toast}>{toast}</div>}
      <div style={styles.footerNote}>※このデータはチームで共有されています</div>
    </div>
  );
}
