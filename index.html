// ---- 保存エラー対策：端末への一時保存＋自動再送信の仕組み ----
const PENDING_QUEUE_KEY = 'etsTrackPendingQueue';

function getQueue() {
  try { return JSON.parse(localStorage.getItem(PENDING_QUEUE_KEY) || '[]'); } catch (e) { return []; }
}
function saveQueueToDisk(q) {
  try { localStorage.setItem(PENDING_QUEUE_KEY, JSON.stringify(q)); } catch (e) {}
}
function queueCount() { return getQueue().length; } // 呼び出し順の都合で photoQueueCount は下で定義

let pendingListeners = [];
function notifyPendingChange() {
  const count = getQueue().length + getPhotoQueue().length;
  pendingListeners.forEach((fn) => fn(count));
}

async function sendToServer(body) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
  });
  return res.json();
}

async function reliableSend(body) {
  const id = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
  const item = { id, body, createdAt: Date.now() };
  const q = getQueue();
  q.push(item);
  saveQueueToDisk(q);
  notifyPendingChange();
  try {
    const result = await sendToServer(body);
    removeFromQueue(id);
    return { ok: true, result };
  } catch (e) {
    // 送信に失敗しても端末には残っているので、あとで自動的に再送信されます
    scheduleRetry();
    return { ok: false, queued: true };
  }
}

function removeFromQueue(id) {
  const q = getQueue().filter((i) => i.id !== id);
  saveQueueToDisk(q);
  notifyPendingChange();
}

let retryTimer = null;
function scheduleRetry() {
  if (retryTimer) return;
  retryTimer = setTimeout(async () => {
    retryTimer = null;
    await retryQueue();
  }, 8000);
}

async function retryQueue() {
  const q = getQueue();
  for (const item of q) {
    try {
      await sendToServer(item.body);
      removeFromQueue(item.id);
    } catch (e) {
      scheduleRetry();
    }
  }
}

async function uploadPhotoDirect(dataUrl, filename) {

    method: 'POST',

}

// アップロードに失敗した写真を、あとで自動的にその現場の記録へ追加する
async function attachPhotoToRecord(recordId, staff, url) {
  const r = await fetch(`${API_URL}?action=get&key=${encodeURIComponent('mgmt:' + recordId)}`);
  const data = await r.json();
  if (!data.found) return false;
  const record = JSON.parse(data.value);
  const photos = [...(record.photos || []), { staff: staff || '担当者', img: url, at: Date.now() }];
  const updated = { ...record, photos };
  await sendToServer({ action: 'set', key: `mgmt:${recordId}`, value: JSON.stringify(updated) });
  return true;
}

async function retryPhotoQueue() {
  const q = getPhotoQueue();
  for (const item of q) {
    try {
      const url = await uploadPhotoDirect(item.dataUrl, item.filename);
      await attachPhotoToRecord(item.recordId, item.staff, url);
      removeFromPhotoQueue(item.id);
    } catch (e) {
      // 引き続き端末に残しておき、また後で試す
    }
  }
}
setInterval(retryPhotoQueue, 30000);

const storage = {
  async get(key) {
    const res = await fetch(`${API_URL}?action=get&key=${encodeURIComponent(key)}`);
    const data = await res.json();
    if (!data.found) throw new Error('not found: ' + key);
    return { key: data.key, value: data.value };
  },
  async set(key, value) {
    const r = await reliableSend({ action: 'set', key, value });
    return { key, value, queued: !r.ok };
  },
  async delete(key) {
    const r = await reliableSend({ action: 'delete', key });
    return { key, deleted: true, queued: !r.ok };
  },
  async list(prefix) {
    const res = await fetch(`${API_URL}?action=list&prefix=${encodeURIComponent(prefix || '')}`);
    const data = await res.json();
    return { keys: data.keys || [] };
  },
  async uploadPhoto(dataUrl, filename, recordId, staff) {
    try {
      return await uploadPhotoDirect(dataUrl, filename);
    } catch (e) {
      const q = getPhotoQueue();
      if (q.length >= MAX_PENDING_PHOTOS) {
        throw new Error('保留中の写真が上限（3枚）に達しています。電波の良い場所でもう一度お試しください');
      }
      const id = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      q.push({ id, dataUrl, filename, recordId, staff, createdAt: Date.now() });
      savePhotoQueueToDisk(q);
      notifyPendingChange();
      scheduleRetry();
      return null; // 呼び出し側は「保留中」として扱う
    }
  },
};

function circledNumber(n) {

function normalizeDateStr(input) {
  if (!input) return todayStr();
  const s = input.trim();
  // すでに YYYY-MM-DD 形式ならそのまま
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  // 2026/10/3 や 2026/10/03 のようなスラッシュ区切りに対応
  const m = s.match(/^(\d{4})[\/年](\d{1,2})[\/月](\d{1,2})/);
  if (m) {
    const y = m[1];
    const mo = m[2].padStart(2, '0');
    const d = m[3].padStart(2, '0');
    return `${y}-${mo}-${d}`;
  }
  return s; // それでも分からなければそのまま返す
}

function addDays(dateStr, days) {
  const d = dateStr ? new Date(dateStr) : new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function compressImage(file, maxSize = 640, quality = 0.55) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxSize) {
          height = Math.round((height * maxSize) / width);
          width = maxSize;
        } else if (height > maxSize) {
          width = Math.round((width * maxSize) / height);
          height = maxSize;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// 住所文字列から「市」「区」レベルの地域名を自動抽出する（配車のグループ分け用）
function extractArea(address) {
  if (!address) return '未分類';
  let s = address.trim();
  // 都道府県を取り除く
  s = s.replace(/^.*?(都|道|府|県)/, '');
  // 郵便番号などを取り除く
  s = s.replace(/^〒?\d{3}-?\d{4}\s*/, '');
  // 市 + 区 のパターン（例：横浜市神奈川区）
  let m = s.match(/^([^\s0-9０-９]+?市)([^\s0-9０-９]+?区)/);
  if (m) return m[1] + m[2];
  // 市のみ（例：大和市）
  m = s.match(/^([^\s0-9０-９]+?市)/);
  if (m) return m[1];
  // 郡 + 町村
  m = s.match(/^([^\s0-9０-９]+?郡[^\s0-9０-９]+?[町村])/);
  if (m) return m[1];
  // 区のみ（東京23区想定）
  m = s.match(/^([^\s0-9０-９]+?区)/);
  if (m) return m[1];
  return '未分類';
}

function loadGoogleMapsScript() {
  return new Promise((resolve, reject) => {
    if (window.google && window.google.maps) { resolve(); return; }
    if (!GOOGLE_MAPS_API_KEY || GOOGLE_MAPS_API_KEY.indexOf('PASTE_') === 0) { reject(new Error('no_key')); return; }
    const existing = document.getElementById('gmaps-script');
    if (existing) { existing.addEventListener('load', () => resolve()); return; }
    const script = document.createElement('script');
    script.id = 'gmaps-script';
    script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}`;
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('load_failed'));
    document.head.appendChild(script);
  });
}

async function geocodeAddress(address) {
  if (!address) return null;
  try {
    const cached = await storage.get(`geocode:${address}`);
    if (cached && cached.value) return JSON.parse(cached.value);
  } catch (e) { /* キャッシュなし、続けて取得 */ }
  return new Promise((resolve) => {
    const geocoder = new window.google.maps.Geocoder();
    geocoder.geocode({ address }, async (results, status) => {
      if (status === 'OK' && results[0]) {
        const loc = results[0].geometry.location;
        const latLng = { lat: loc.lat(), lng: loc.lng() };
        try { await storage.set(`geocode:${address}`, JSON.stringify(latLng)); } catch (e) {}
        resolve(latLng);
      } else {
        resolve(null);
      }
    });
  });
}

function daysInMonth(year, month) { return new Date(year, month + 1, 0).getDate(); }
function firstWeekday(year, month) { return new Date(year, month, 1).getDay(); }
function isSaturday(dateStr) { return new Date(dateStr + 'T00:00:00').getDay() === 6; }

// ---------- Month calendar (like TimeTree month view) ----------
function MonthCalendar({ records, monthCursor, setMonthCursor, onPickDate, selectedDate }) {
  const [year, month] = monthCursor.split('-').map(Number);
  const total = daysInMonth(year, month - 1);
  const startWeekday = firstWeekday(year, month - 1);

  // 日付ごとに、その日に含まれるステータスの種類と件数を集計
  const infoByDate = {};
  records.forEach((r) => {
    if (!infoByDate[r.date]) infoByDate[r.date] = { count: 0, statuses: [] };
    infoByDate[r.date].count++;
    if (!infoByDate[r.date].statuses.includes(r.status)) infoByDate[r.date].statuses.push(r.status);
  });

  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= total; d++) {
    const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    cells.push(dateStr);
  }

  function shiftMonth(delta) {
    let m = month + delta, y = year;
    if (m > 12) { m = 1; y += 1; }
    if (m < 1) { m = 12; y -= 1; }
    setMonthCursor(`${y}-${String(m).padStart(2, '0')}`);
  }

  const MAX_DOTS = 4;

  return (
    <div style={styles.calBox}>
      <div style={styles.calHeader}>
        <button style={styles.calNavBtn} onClick={() => shiftMonth(-1)}>‹</button>
        <div style={styles.calTitle}>{year}年{month}月</div>
        <button style={styles.calNavBtn} onClick={() => shiftMonth(1)}>›</button>
      </div>
      <div style={styles.calWeekRow}>
        {['日', '月', '火', '水', '木', '金', '土'].map((w) => (
          <div key={w} style={styles.calWeekLabel}>{w}</div>
        ))}
      </div>
      <div style={styles.calGrid}>
        {cells.map((dateStr, i) => {
          if (!dateStr) return <div key={i} style={styles.calCellEmpty} />;
          const info = infoByDate[dateStr];
          const day = Number(dateStr.slice(-2));
          const sat = isSaturday(dateStr);
          const dots = info ? info.statuses.slice(0, MAX_DOTS) : [];
          const extra = info ? Math.max(0, info.statuses.length - MAX_DOTS) : 0;
          return (
            <button
              key={i}
              onClick={() => onPickDate(dateStr)}
              style={{
                ...styles.calCell,
                ...(dateStr === selectedDate ? styles.calCellActive : {}),
                ...(sat ? { color: '#457B9D' } : {}),
              }}
            >
              <span style={styles.calDayNum}>{day}</span>
              {info && (
                <>
                  <div style={styles.calDotRow}>
                    {dots.map((s) => (
                      <span key={s} style={{ ...styles.calDot, background: statusColor(SCHED_STATUSES, s) }} />
                    ))}
                    {extra > 0 && <span style={styles.calDotMore}>+{extra}</span>}
                  </div>
                  <span style={styles.calCount}>{info.count}件</span>
                </>
              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ---------- Gantt-style progress chart (新規〜最終) ----------
function dateToDay(dateStr) {
  return Math.floor(new Date(dateStr + 'T00:00:00').getTime() / 86400000);
}
function dayToDate(day) {
  return new Date(day * 86400000).toISOString().slice(0, 10);
}

function GanttChart({ schedRecords, kumitenFilter, windowStart, windowEnd, onShift, onPickKumiten, kumitenList }) {
  const todayDay = dateToDay(todayStr());
  const startDay = dateToDay(windowStart);
  const endDay = dateToDay(windowEnd);
  const totalDays = Math.max(1, endDay - startDay);

  const bySite = {};
  schedRecords.forEach((r) => {
    if (kumitenFilter !== '全て' && r.kumiten !== kumitenFilter) return;
    if (!bySite[r.name]) bySite[r.name] = { name: r.name, kumiten: r.kumiten, dates: [], hasFinal: false, finalDay: null, hasSingle: false };
    const d = dateToDay(r.date);
    bySite[r.name].dates.push(d);
    if (r.status === '最終') {
      bySite[r.name].hasFinal = true;
      bySite[r.name].finalDay = bySite[r.name].finalDay === null ? d : Math.max(bySite[r.name].finalDay, d);
    }
    if (r.status === '単発') {
      bySite[r.name].hasSingle = true;
    }
  });

  const rows = Object.values(bySite).map((s) => {
    const minDay = Math.min(...s.dates);
    const maxDay = Math.max(...s.dates);
    const isDone = s.hasFinal || s.hasSingle; // 最終が付いた、または単発の仕事は「完了扱い」にする
    const barEndDay = s.hasFinal ? s.finalDay : (s.hasSingle ? maxDay : Math.max(maxDay, todayDay));
    return { ...s, startDay: minDay, endDay: barEndDay, ongoing: !isDone, isDone };
  })
    .filter((s) => !(s.isDone && todayDay - s.endDay > 14)) // 完了（最終／単発）から2週間経過したら工程表から非表示（データ自体は消えません）
    .filter((s) => s.endDay >= startDay && s.startDay <= endDay)
    .sort((a, b) => a.startDay - b.startDay);

  // 月の目盛り
  const monthTicks = [];
  let cursor = new Date(windowStart + 'T00:00:00');
  cursor.setDate(1);
  while (dateToDay(cursor.toISOString().slice(0, 10)) <= endDay) {
    const d = dateToDay(cursor.toISOString().slice(0, 10));
    if (d >= startDay) monthTicks.push({ day: d, label: `${cursor.getMonth() + 1}月` });
    cursor.setMonth(cursor.getMonth() + 1);
  }

  const overlappingToday = rows.filter((r) => r.startDay <= todayDay && r.endDay >= todayDay).length;

  return (
    <div>
      <div style={styles.searchBox}>
        <div style={styles.chipRow}>
          {['全て', ...kumitenList].map((k) => (
            <button key={k} onClick={() => onPickKumiten(k)} style={{ ...styles.chip, ...(kumitenFilter === k ? styles.chipActive : {}) }}>{k}</button>
          ))}
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 10 }}>
          <button style={styles.calNavBtn} onClick={() => onShift(-1)}>‹ 前月</button>
          <span style={{ fontSize: 12.5, color: '#5A5A54' }}>{windowStart} 〜 {windowEnd}</span>
          <button style={styles.calNavBtn} onClick={() => onShift(1)}>次月 ›</button>
        </div>
      </div>

      <div style={styles.dispatchSummary}>
        <span>表示中 {rows.length}件</span>
        <span style={{ fontWeight: 700, color: '#E63946' }}>本日時点で重なり {overlappingToday}件</span>
      </div>

      <div style={styles.ganttBox}>
        <div style={styles.ganttAxis}>
          {monthTicks.map((t, i) => (
            <div key={i} style={{ ...styles.ganttTick, left: `${((t.day - startDay) / totalDays) * 100}%` }}>{t.label}</div>
          ))}
          <div style={{ ...styles.ganttTodayLine, left: `${((todayDay - startDay) / totalDays) * 100}%` }} />
        </div>

        {rows.length === 0 && <div style={styles.empty}>この期間・工務店に該当する現場がありません。</div>}

        {rows.map((r) => {
          const left = Math.max(0, ((r.startDay - startDay) / totalDays) * 100);
          const right = Math.min(100, ((r.endDay - startDay) / totalDays) * 100);
          const width = Math.max(1.5, right - left);
          return (
            <div key={r.name} style={styles.ganttRow}>
              <div style={styles.ganttLabel}>{r.name}</div>
              <div style={styles.ganttTrack}>
                <div
                  style={{
                    ...styles.ganttBar,
                    left: `${left}%`,
                    width: `${width}%`,
                    background: r.ongoing ? '#2A9D8F' : (r.hasSingle && !r.hasFinal ? '#FFB703' : '#9A9A94'),
                  }}
                  title={`${dayToDate(r.startDay)} 〜 ${dayToDate(r.endDay)}${r.ongoing ? '（進行中）' : (r.hasSingle && !r.hasFinal ? '（単発）' : '（最終済み）')}`}
                />
              </div>
            </div>
          );
        })}
      </div>

      <div style={styles.mapLegend}>
        <span style={styles.mapLegendItem}><span style={{ ...styles.truckDot, background: '#2A9D8F' }} />進行中（最終未登録）</span>
        <span style={styles.mapLegendItem}><span style={{ ...styles.truckDot, background: '#9A9A94' }} />最終済み</span>
        <span style={styles.mapLegendItem}><span style={{ ...styles.truckDot, background: '#FFB703' }} />単発</span>
        <span style={styles.mapLegendItem}><span style={{ ...styles.truckDot, background: '#E63946' }} />本日のライン</span>
      </div>
    </div>
  );
}

  const mapInstanceRef = useRef(null);

  const [invoiceKumiten, setInvoiceKumiten] = useState('OHA');
  const [invoiceMonth, setInvoiceMonth] = useState(todayStr().slice(0, 7));
  const [showInvoiceExport, setShowInvoiceExport] = useState(false);
  const [invoiceExportText, setInvoiceExportText] = useState('');
  const [invoiceEdits, setInvoiceEdits] = useState({}); // recordId -> lineItems編集中バッファ
  const [showSummaryView, setShowSummaryView] = useState(false);
  const [summaryFrom, setSummaryFrom] = useState('');
  const [summaryTo, setSummaryTo] = useState('');
  const [summaryKumitenFilter, setSummaryKumitenFilter] = useState('全て');
  const [ganttKumitenFilter, setGanttKumitenFilter] = useState('全て');
  const [ganttMonthOffset, setGanttMonthOffset] = useState(-1); // 表示開始位置（今月からのズレ）
  const [kumitenList, setKumitenList] = useState(DEFAULT_KUMITEN);
  const [showKumitenEditor, setShowKumitenEditor] = useState(false);
  const [showBulkImport, setShowBulkImport] = useState(false);
  const [bulkImportText, setBulkImportText] = useState('');
  const [bulkImportBusy, setBulkImportBusy] = useState(false);
  const [showBulkUpdate, setShowBulkUpdate] = useState(false);
  const [bulkUpdateText, setBulkUpdateText] = useState('');

  const [pendingCount, setPendingCount] = useState(0);

  useEffect(() => {
    const listener = (count) => setPendingCount(count);
    pendingListeners.push(listener);
    setPendingCount(getQueue().length + getPhotoQueue().length);
    return () => { pendingListeners = pendingListeners.filter((l) => l !== listener); };

  function changeDeviceStaff() {
    const name = window.prompt('この端末を使う担当者名を入力してください（次回から自動で入力されます）', deviceStaff);
    if (name === null) return;
    setDeviceStaff(name.trim());
    setDeviceStaffState(name.trim());
    showToast('担当者名を覚えました');
  }

  const emptySched = () => ({
    name: '', kumiten: 'OHA', address: '', area: '', status: '新規', staff: deviceStaff, note: '', date: todayStr(),
    time: '', supervisorName: '', supervisorPhone: '', houseNumber: '', garaRequired: false, expectedVisits: '12',
  });
  const emptyMgmt = () => ({
    name: '', kumiten: 'OHA', date: todayStr(), status: 'クロス', staff: deviceStaff, items: '', lineItems: [], photos: [],
  });
  const [form, setForm] = useState(emptySched());
  const [pendingPhotos, setPendingPhotos] = useState([]);

  useEffect(() => { load(); }, []);
  useEffect(() => { if (tab === 'dispatch') loadDispatch(dispatchDate); }, [tab, dispatchDate]);

  useEffect(() => {
    if (!showDispatchMap) return;
    let cancelled = false;
    async function build() {
      setMapStatus('loading');
      try {
        await loadGoogleMapsScript();
      } catch (e) {
        if (!cancelled) setMapStatus('error');
        return;
      }
      if (cancelled || !mapDivRef.current) return;
      const map = new window.google.maps.Map(mapDivRef.current, {
        center: { lat: 35.4, lng: 139.4 },
        zoom: 11,
      });
      mapInstanceRef.current = map;
      mapMarkersRef.current.forEach((m) => m.setMap(null));
      mapMarkersRef.current = [];

      const bounds = new window.google.maps.LatLngBounds();
      const opts = buildTruckOptions(regularTruckCount, includeKei, dumpOnlyCount);
      let placed = 0;
      for (const s of daySites) {
        if (!s.address) continue;
        const loc = await geocodeAddress(s.address);
        if (cancelled) return;
        if (!loc) continue;
        const truckId = assignments[s.id];
        const idx = opts.findIndex((o) => o.id === truckId);
        const color = idx >= 0 ? TRUCK_COLORS[idx % TRUCK_COLORS.length] : '#9A9A94';
        const marker = new window.google.maps.Marker({
          position: loc,
          map,
          icon: markerIcon(color),
          title: `${s.name}${truckId ? '（' + (opts.find((o) => o.id === truckId) || {}).label + '）' : '（未割当）'}`,
        });
        mapMarkersRef.current.push(marker);
        bounds.extend(loc);
        placed++;
      }
      if (placed > 0) map.fitBounds(bounds);
      if (!cancelled) setMapStatus('ready');
    }
    build();
    return () => { cancelled = true; };
  }, [showDispatchMap, dispatchDate, assignments, regularTruckCount, includeKei, dumpOnlyCount]);

  async function load() {
    setLoading(true);
    try {
      try {
        const km = await storage.get('meta:kumiten', true);
        let list = DEFAULT_KUMITEN;
        if (km && km.value) {
          list = JSON.parse(km.value);
          const missing = DEFAULT_KUMITEN.filter((n) => n !== 'その他' && !list.includes(n));
          if (missing.length > 0) {
            const others = list.filter((k) => k !== 'その他');
            list = list.includes('その他') ? [...others, ...missing, 'その他'] : [...list, ...missing];
          }
        }
        await storage.set('meta:kumiten', JSON.stringify(list), true);
        setKumitenList(list);
      } catch (e) { setKumitenList(DEFAULT_KUMITEN); }

      const sList = await storage.list('sched:', true);
      const sItems = [];
      for (const k of (sList && sList.keys) || []) {
        const r = await storage.get(k, true);
        if (r && r.value) sItems.push(JSON.parse(r.value));
      }
      sItems.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      setSchedRecords(sItems);

      const mList = await storage.list('mgmt:', true);
      const mItems = [];
      for (const k of (mList && mList.keys) || []) {
        const r = await storage.get(k, true);
        if (r && r.value) mItems.push(JSON.parse(r.value));
      }
      mItems.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      setMgmtRecords(mItems);
    } catch (e) { console.error(e); }
    setLoading(false);
  }

  async function loadDispatch(date) {
    setDispatchLoaded(false);
    const satDefault = isSaturday(date) ? 3 : 6;
    try {
      const r = await storage.get(`dispatch:${date}`, true);
      if (r && r.value) {
        const parsed = JSON.parse(r.value);
        setRegularTruckCount(parsed.regularTruckCount ?? satDefault);
        setIncludeKei(parsed.includeKei ?? true);
        setDumpOnlyCount(parsed.dumpOnlyCount ?? 0);
        setAssignments(parsed.assignments || {});
        setExtraSiteIds(parsed.extraSiteIds || []);
        setCollectNote(parsed.collectNote || '');
        setDumpNote(parsed.dumpNote || '');
      } else {
        setRegularTruckCount(satDefault);
        setIncludeKei(true);
        setDumpOnlyCount(0);
        setAssignments({});
        setExtraSiteIds([]);
        setCollectNote('');
        setDumpNote('');
      }
    } catch (e) {
      setRegularTruckCount(satDefault);
      setIncludeKei(true);
      setDumpOnlyCount(0);
      setAssignments({});
      setExtraSiteIds([]);
      setCollectNote('');
      setDumpNote('');
    }
    setDispatchLoaded(true);
  }

  async function saveDispatch(nextAssignments, nextRegular, nextKei, nextDump, nextExtra, nextCollectNote, nextDumpNote) {
    const payload = {
      regularTruckCount: nextRegular,
      includeKei: nextKei,
      dumpOnlyCount: nextDump,
      assignments: nextAssignments,
      extraSiteIds: nextExtra !== undefined ? nextExtra : extraSiteIds,
      collectNote: nextCollectNote !== undefined ? nextCollectNote : collectNote,
      dumpNote: nextDumpNote !== undefined ? nextDumpNote : dumpNote,
    };
    await storage.set(`dispatch:${dispatchDate}`, JSON.stringify(payload), true);
  }

  function setAssignment(siteId, truckId) {
    const next = { ...assignments, [siteId]: truckId };
    setAssignments(next);
    saveDispatch(next, regularTruckCount, includeKei, dumpOnlyCount);
  }

  async function moveSiteToDate(record) {
    try {
      await storage.set(`sched:${record.id}`, JSON.stringify({ ...record, date: dispatchDate }));
      showToast(`${record.name} の予定日を${dispatchDate}に変更しました`);
      load();
    } catch (e) { showToast('変更に失敗しました'); }
  }

  function addExtraSite(siteId) {
    if (extraSiteIds.includes(siteId)) return;
    const next = [...extraSiteIds, siteId];
    setExtraSiteIds(next);
    saveDispatch(assignments, regularTruckCount, includeKei, dumpOnlyCount, next);
  }

  function removeExtraSite(siteId) {
    const next = extraSiteIds.filter((id) => id !== siteId);
    setExtraSiteIds(next);
    const nextAssign = { ...assignments };
    delete nextAssign[siteId];
    setAssignments(nextAssign);
    saveDispatch(nextAssign, regularTruckCount, includeKei, dumpOnlyCount, next);
  }

  function autoAssignTrucks() {
    const opts = buildTruckOptions(regularTruckCount, includeKei, dumpOnlyCount);
    if (opts.length === 0) { showToast('トラックがありません'); return; }
    const counts = {};
    opts.forEach((o) => { counts[o.id] = 0; });
    Object.values(assignments).forEach((id) => { if (counts[id] !== undefined) counts[id]++; });

    // 地域ごとにまとめる（並び順は現場が出てきた順＝なるべく近い地域が固まっている前提）
    const areaOrder = [];
    const areas = {};
    daySites.forEach((s) => {
      if (assignments[s.id]) return; // すでに割り振り済みはそのまま
      const area = s.area || extractArea(s.address) || '未分類';
      if (!areas[area]) { areas[area] = []; areaOrder.push(area); }
      areas[area].push(s);
    });

    const unassignedTotal = areaOrder.reduce((sum, a) => sum + areas[a].length, 0);
    const target = Math.max(1, Math.ceil(unassignedTotal / opts.length)); // 1台あたりの目安件数

    const next = { ...assignments };
    let truckIdx = 0;
    areaOrder.forEach((area) => {
      const sites = areas[area];
      // 今のトラックがすでに目安件数に達していて、次のトラックがまだ残っていれば進める
      // （地域を分割はしない＝同じ地域は必ず同じトラックにまとめる）
      while (truckIdx < opts.length - 1 && counts[opts[truckIdx].id] >= target) {
        truckIdx++;
      }
      const truckId = opts[truckIdx].id;
      sites.forEach((s) => { next[s.id] = truckId; counts[truckId]++; });
    });

    setAssignments(next);
    saveDispatch(next, regularTruckCount, includeKei, dumpOnlyCount);
    showToast('地域のまとまりを優先して割り振りました（手動でも調整できます）');
  }

  function saveCollectNote(value) {
    setCollectNote(value);
    saveDispatch(assignments, regularTruckCount, includeKei, dumpOnlyCount, extraSiteIds, value, dumpNote);
  }

  function saveDumpNoteValue(value) {
    setDumpNote(value);
    saveDispatch(assignments, regularTruckCount, includeKei, dumpOnlyCount, extraSiteIds, collectNote, value);
  }

  function changeRegularTruckCount(n) {
    const v = Math.max(0, n);
    setRegularTruckCount(v);
    saveDispatch(assignments, v, includeKei, dumpOnlyCount);
  }

  function toggleKei() {
    const v = !includeKei;
    setIncludeKei(v);
    saveDispatch(assignments, regularTruckCount, v, dumpOnlyCount);
  }

  function changeDumpOnlyCount(n) {
    const v = Math.max(0, n);
    setDumpOnlyCount(v);
    saveDispatch(assignments, regularTruckCount, includeKei, v);
  }

  function buildTruckOptions(regular, kei, dump) {
    const opts = [];
    for (let i = 1; i <= regular; i++) opts.push({ id: `R${i}`, label: `トラック${i}` });
    if (kei) opts.push({ id: 'KEI', label: '軽自動車' });
    for (let i = 1; i <= dump; i++) opts.push({ id: `D${i}`, label: `捨て専用${i}` });
    return opts;
  }

  function showToast(msg) { setToast(msg); setTimeout(() => setToast(''), 2500); }

  function fillFromExistingSite(name) {
    if (editingId) return; // 既存の編集中は上書きしない
    const trimmed = (name || '').trim();
    if (!trimmed) return;
    const match = schedRecords.find((r) => r.name.trim() === trimmed);
    if (!match) return;
    setForm((f) => ({
      ...f,
      supervisorName: f.supervisorName || match.supervisorName || '',
      supervisorPhone: f.supervisorPhone || match.supervisorPhone || '',
      houseNumber: f.houseNumber || match.houseNumber || '',
      garaRequired: f.garaRequired || match.garaRequired || false,
      expectedVisits: match.expectedVisits || f.expectedVisits || '12',
      area: f.area || match.area || '',
      address: f.address || match.address || '',
    }));
  }

  function openNew() {
    setForm(tab === 'sched' ? emptySched() : emptyMgmt());
    setEditingId(null);
    setPendingPhotos([]);
    setShowForm(true);
  }

  function openEdit(r) {
    setForm(r);
    setEditingId(r.id);
    setPendingPhotos([]);
    setShowForm(true);
  }

  function handoffToMgmt(schedRecord) {
    setForm({ ...emptyMgmt(), name: schedRecord.name, kumiten: schedRecord.kumiten, staff: schedRecord.staff || '', date: todayStr() });
    setEditingId(null);
    setPendingPhotos([]);
    setTab('mgmt');
    setShowForm(true);
  }

  function duplicateRecord(r, dayOffset = 7) {
    const { id, createdAt, photos, ...rest } = r;
    setForm({ ...rest, date: addDays(r.date, dayOffset), photos: [] });
    setEditingId(null);
    setPendingPhotos([]);
    setShowForm(true);
  }

  async function saveRecord() {
    if (!form.name.trim()) { showToast('現場名を入力してください'); return; }
    const prefix = tab === 'sched' ? 'sched' : 'mgmt';
    const id = editingId || `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    let record = { ...form, id, createdAt: form.createdAt || Date.now() };
    if (tab === 'sched' && record.address && !record.area) {
      record = { ...record, area: extractArea(record.address) };
    }
    let extraPhotos = [];
    if (tab === 'mgmt' && pendingPhotos.length > 0) {
      showToast(`写真をアップロード中…（${pendingPhotos.length}枚）`);
      for (const file of pendingPhotos) {
        try {
          const dataUrl = await compressImage(file);
          const staffName = deviceStaff || form.staff || '担当者';
          const url = await storage.uploadPhoto(dataUrl, `${id}_${Date.now()}.jpg`, id, staffName);
          if (url) {
            extraPhotos.push({ staff: staffName, img: url, at: Date.now() });
          } else {
            showToast('一部の写真は保留中です。あとで自動的に追加されます');
          }
        } catch (e) { showToast(e.message || '写真の保存に失敗しました'); }
      }
    }
    if (extraPhotos.length > 0) {
      record = { ...record, photos: [...(record.photos || []), ...extraPhotos] };
    }
    try {
      const result = await storage.set(`${prefix}:${id}`, JSON.stringify(record), true);
      showToast(result.queued ? '保存を保留しました。電波が戻り次第、自動的に送信されます' : '保存しました');
      setShowForm(false);
      setEditingId(null);
      setPendingPhotos([]);
      load();
    } catch (e) { showToast('保存に失敗しました'); }
  }

  async function runBulkImport() {
    const lines = bulkImportText.split('\n').map((l) => l.trim()).filter((l) => l.length > 0);
    if (lines.length === 0) { showToast('貼り付けるデータがありません'); return; }
    setBulkImportBusy(true);
    let count = 0;
    for (const line of lines) {
      const cols = line.split('\t');
      const [name, kumiten, address, date, time, status, supervisorName, supervisorPhone, gara, expectedVisits, staff, note] = cols;
      if (!name || name === '現場名') continue; // ヘッダー行はスキップ
      const id = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      const record = {
        id, createdAt: Date.now(),
        name: name.trim(),
        kumiten: (kumiten || 'その他').trim(),
        address: (address || '').trim(),
        area: (address ? extractArea(address) : '') ,
        date: normalizeDateStr(date),
        time: (time || '').trim(),
        status: (status || '新規').trim(),
        supervisorName: (supervisorName || '').trim(),
        supervisorPhone: (supervisorPhone || '').trim(),
        garaRequired: (gara || '').trim() === '○' || (gara || '').trim().toLowerCase() === 'true',
        expectedVisits: (expectedVisits || '').trim(),
        staff: (staff || deviceStaff || '').trim(),
        note: (note || '').trim(),
      };
      try {
        await storage.set(`sched:${record.id}`, JSON.stringify(record));
        count++;
      } catch (e) { console.error(e); }
    }
    setBulkImportBusy(false);
    showToast(`${count}件取り込みました`);
    setShowBulkImport(false);
    setBulkImportText('');
    load();
  }

  function copyUpdateTemplate() {
    const header = '現場名\t監督名\t監督電話\tハウスNo・事業場コード';
    navigator.clipboard.writeText(header).then(() => showToast('テンプレート行をコピーしました。Excelに貼り付けてください'));
  }

  async function runBulkUpdate() {
    const lines = bulkUpdateText.split('\n').map((l) => l.trim()).filter((l) => l.length > 0);
    if (lines.length === 0) { showToast('貼り付けるデータがありません'); return; }
    setBulkImportBusy(true);
    let updated = 0;
    for (const line of lines) {
      const cols = line.split('\t');
      const [name, supervisorName, supervisorPhone, houseNumber] = cols;
      if (!name || name === '現場名') continue;
      const matches = schedRecords.filter((r) => r.name.trim() === name.trim());
      for (const rec of matches) {
        const updatedRec = {
          ...rec,
          supervisorName: (supervisorName || '').trim() || rec.supervisorName,
          supervisorPhone: (supervisorPhone || '').trim() || rec.supervisorPhone,
          houseNumber: (houseNumber || '').trim() || rec.houseNumber,
        };
        try {
          await storage.set(`sched:${rec.id}`, JSON.stringify(updated));
          updated++;
        } catch (e) { console.error(e); }
      }
    }
    setBulkImportBusy(false);
    showToast(`${updated}件更新しました`);
    setShowBulkUpdate(false);
    setBulkUpdateText('');
    load();
  }

  function copyImportTemplate() {
    const header = '現場名\t工務店\t住所\t日付(YYYY-MM-DD)\t時間(HH:MM 任意)\tステータス\t監督名\t監督電話\tガラ必須(○か空欄)\t想定回数\t担当者\t注意事項';
    navigator.clipboard.writeText(header).then(() => showToast('テンプレート行をコピーしました。Excelに貼り付けてください'));
  }

  async function deleteRecord(id) {
    const prefix = tab === 'sched' ? 'sched' : 'mgmt';
    try {
      const result = await storage.delete(`${prefix}:${id}`, true);
      showToast(result.queued ? '削除を保留しました。電波が戻り次第、自動的に反映されます' : '削除しました');
      load();
    } catch (e) { showToast('削除に失敗しました'); }
  }

  async function bulkDelete() {
    if (!bulkFrom || !bulkTo) { showToast('期間を指定してください'); return; }
    const prefix = tab === 'sched' ? 'sched' : 'mgmt';
    const source = tab === 'sched' ? schedRecords : mgmtRecords;
    const targets = source.filter((r) => r.date >= bulkFrom && r.date <= bulkTo);
    if (targets.length === 0) { showToast('対象がありません'); return; }
    if (!window.confirm(`${targets.length}件を削除します。よろしいですか？`)) return;
    for (const r of targets) await storage.delete(`${prefix}:${r.id}`, true);
    showToast(`${targets.length}件削除しました`);
    setShowBulkDelete(false);
    setBulkFrom(''); setBulkTo('');
    load();
  }

  async function addPhotoToMgmt(id, staffName, files) {
    const record = mgmtRecords.find((r) => r.id === id);
    if (!record) return;
    const fileArray = Array.from(files);
    showToast(`アップロード中…（${fileArray.length}枚）`);
    const newPhotos = [];
    for (const file of fileArray) {
      try {
        const dataUrl = await compressImage(file);
        const url = await storage.uploadPhoto(dataUrl, `${id}_${Date.now()}.jpg`, id, staffName);
        if (url) {
          newPhotos.push({ staff: staffName || '担当者', img: url, at: Date.now() });
        } else {
          showToast('一部の写真は保留中です。あとで自動的に追加されます');
        }
      } catch (e) {
        showToast(e.message || '写真の保存に失敗しました');
      }
    }
    const photos = [...(record.photos || []), ...newPhotos];
    const updated = { ...record, photos };
    await storage.set(`mgmt:${id}`, JSON.stringify(updated), true);
    showToast(`写真を${newPhotos.length}枚追加しました`);
    load();
  }

  function buildExportText() {
    const groups = {};
    const order = [];
    filtered.forEach((r) => {
      if (!groups[r.kumiten]) { groups[r.kumiten] = []; order.push(r.kumiten); }
      groups[r.kumiten].push(r);
    });
    const sections = order.map((kumiten) => {
      const lines = groups[kumiten].map((r) => {
        const sched = schedRecords.find((s) => s.name.trim() === r.name.trim());
        const supervisor = (sched && sched.supervisorName) ? sched.supervisorName : '（未登録）';
        const houseNo = (sched && sched.houseNumber) ? sched.houseNumber : '（未登録）';
        return `【${r.name}】\n日付：${r.date}\n監督：${supervisor}／ハウスNo・事業場コード：${houseNo}\n内訳：${r.items || '(未入力)'}`;
      });
      return `■${kumiten}\n\n` + lines.join('\n\n');
    });
    return sections.join('\n\n----------\n\n');
  }

  function openExport() { setExportText(buildExportText()); setShowExport(true); }

  async function copyExport() {
    try {
      await navigator.clipboard.writeText(exportText);
      showToast('コピーしました。マニフェスト用チャットに貼り付けてください');
    } catch (e) { showToast('コピーできませんでした。手動で選択してコピーしてください'); }
  }

  function tryUnlockRyubei() {
    const input = window.prompt('立米数を編集するには合言葉を入力してください');
    if (input === null) return;
    if (input === RYUBEI_PASSWORD) { setRyubeiUnlocked(true); showToast('ロック解除しました'); }
    else showToast('合言葉が違います');
  }

  function getEditItems(record) {
    return invoiceEdits[record.id] !== undefined ? invoiceEdits[record.id] : (record.lineItems || []);
  }

  function addInvoiceLineItem(record) {
    const items = [...getEditItems(record), { name: '', qty: '', unit: 'm3', unitPrice: '' }];
    setInvoiceEdits((prev) => ({ ...prev, [record.id]: items }));
  }

  function updateInvoiceLineItem(record, idx, field, value) {
    const items = [...getEditItems(record)];
    items[idx] = { ...items[idx], [field]: value };
    setInvoiceEdits((prev) => ({ ...prev, [record.id]: items }));
  }

  function removeInvoiceLineItem(record, idx) {
    const items = getEditItems(record).filter((_, i) => i !== idx);
    setInvoiceEdits((prev) => ({ ...prev, [record.id]: items }));
  }

  async function saveInvoiceLineItems(record) {
    const items = getEditItems(record);
    const updated = { ...record, lineItems: items };
    try {
      await storage.set(`mgmt:${record.id}`, JSON.stringify(updated));
      showToast('保存しました');
      setInvoiceEdits((prev) => { const next = { ...prev }; delete next[record.id]; return next; });
      load();
    } catch (e) { showToast('保存に失敗しました'); }
  }

  function lineItemAmount(item) {
    const q = parseFloat(item.qty);
    const p = parseFloat(item.unitPrice);
    if (isNaN(q) || isNaN(p)) return 0;
    return q * p;
  }

  function tryUnlockInvoiceTab() {
    if (ryubeiUnlocked) { setTab('invoice'); return; }
    const input = window.prompt('請求書タブを開くには合言葉を入力してください');
    if (input === null) return;
    if (input === RYUBEI_PASSWORD) {
      setRyubeiUnlocked(true);
      setTab('invoice');
      showToast('ロック解除しました');
    } else {
      showToast('合言葉が違います');
    }
  }

  async function saveKumitenList(next) {
    setKumitenList(next);
    await storage.set('meta:kumiten', JSON.stringify(next), true);
  }

  async function addKumitenName() {
    const name = window.prompt('新しい工務店名／区分を入力してください（例：〇〇ホーム）');
    if (!name || !name.trim()) return;
    const trimmed = name.trim();
    if (kumitenList.includes(trimmed)) { showToast('すでにあります'); return; }
    const others = kumitenList.filter((k) => k !== 'その他');
    const next = kumitenList.includes('その他') ? [...others, trimmed, 'その他'] : [...kumitenList, trimmed];
    await saveKumitenList(next);
    showToast(`「${trimmed}」を追加しました`);
  }

  async function moveKumiten(index, dir) {
    const next = [...kumitenList];
    const target = index + dir;
    if (target < 0 || target >= next.length) return;
    [next[index], next[target]] = [next[target], next[index]];
    await saveKumitenList(next);
  }

  async function removeKumiten(index) {
    const name = kumitenList[index];
    if (!window.confirm(`「${name}」をリストから削除しますか？（過去のデータは残ります）`)) return;
    const next = kumitenList.filter((_, i) => i !== index);
    await saveKumitenList(next);
  }

  const activeList = tab === 'sched' ? schedRecords : mgmtRecords;
  const statusList = SCHED_STATUSES;
  const collectedNames = new Set(mgmtRecords.map((r) => r.name));

  let filtered = activeList.filter((r) => {
    if (kumitenFilter !== '全て' && r.kumiten !== kumitenFilter) return false;
    if (dateFrom && r.date < dateFrom) return false;
    if (dateTo && r.date > dateTo) return false;
    if (search && !r.name.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });
  if (tab === 'sched' && showUncollectedOnly) filtered = filtered.filter((r) => !collectedNames.has(r.name));

  // ---- dispatch derived data ----
  const daySitesBase = schedRecords.filter((r) => r.date === dispatchDate);
  const extraSites = schedRecords.filter((r) => extraSiteIds.includes(r.id) && r.date !== dispatchDate);
  const daySites = [...daySitesBase, ...extraSites];
  const byArea = {};
  daySites.forEach((s) => {
    const area = s.area || extractArea(s.address) || '未分類';
    if (!byArea[area]) byArea[area] = [];
    byArea[area].push(s);
  });
  const unassignedCount = daySites.filter((s) => !assignments[s.id]).length;
  const truckOptions = buildTruckOptions(regularTruckCount, includeKei, dumpOnlyCount);

  // ---- invoice derived data ----
  const invoiceRecords = mgmtRecords.filter((r) => r.kumiten === invoiceKumiten && r.date && r.date.startsWith(invoiceMonth) && (r.status === '追加' || r.status === '単発'));
  const invoiceBySite = {};
  invoiceRecords.forEach((r) => {
    if (!invoiceBySite[r.name]) invoiceBySite[r.name] = { name: r.name, items: [] };
    (r.lineItems || []).forEach((it) => {
      const q = parseFloat(it.qty); const p = parseFloat(it.unitPrice);
      const amount = (isNaN(q) || isNaN(p)) ? 0 : q * p;
      invoiceBySite[r.name].items.push({ ...it, amount, date: r.date });
    });
  });
  const invoiceRows = Object.values(invoiceBySite)
    .filter((s) => s.items.length > 0)
    .sort((a, b) => a.name.localeCompare(b.name, 'ja'));
  const invoiceGrandTotal = invoiceRows.reduce((sum, site) => sum + site.items.reduce((s, it) => s + it.amount, 0), 0);

  // ---- 工務店・現場・日付ごとの集計（期間自由指定） ----
  const summaryRecords = mgmtRecords.filter((r) => {
    if (summaryKumitenFilter !== '全て' && r.kumiten !== summaryKumitenFilter) return false;
    if (summaryFrom && r.date < summaryFrom) return false;
    if (summaryTo && r.date > summaryTo) return false;
    return true;
  });

  function recordAmount(r) {
    return (r.lineItems || []).reduce((s, it) => {
      const q = parseFloat(it.qty); const p = parseFloat(it.unitPrice);
      return s + (isNaN(q) || isNaN(p) ? 0 : q * p);
    }, 0);
  }

  const summaryTree = {}; // { kumiten: { siteName: [{date, amount, status}] } }
  summaryRecords.forEach((r) => {
    if (!summaryTree[r.kumiten]) summaryTree[r.kumiten] = {};
    if (!summaryTree[r.kumiten][r.name]) summaryTree[r.kumiten][r.name] = [];
    summaryTree[r.kumiten][r.name].push({ date: r.date, amount: recordAmount(r), status: r.status });
  });

  function buildSummaryTSV() {
    const header = '工務店\t現場名\t日付\tタグ\t金額';
    const rows = [];
    Object.keys(summaryTree).sort().forEach((kumiten) => {
      Object.keys(summaryTree[kumiten]).sort((a, b) => a.localeCompare(b, 'ja')).forEach((site) => {
        summaryTree[kumiten][site].forEach((v) => {
          rows.push(`${kumiten}\t${site}\t${v.date}\t${v.status}\t${Math.round(v.amount)}`);
        });
      });
    });
    const grandTotal = summaryRecords.reduce((s, r) => s + recordAmount(r), 0);
    rows.push(`合計\t\t\t${summaryRecords.length}件\t${Math.round(grandTotal)}`);
    return [header, ...rows].join('\n');
  }

  function buildInvoiceTSV() {
    const header = '現場名\t名称\t数量\t単位\t単価\t金額\t備考（日付）';
    const blocks = invoiceRows.map((site) => {
      const rows = site.items.map((it) => `${site.name}\t${it.name}\t${it.qty}\t${it.unit}\t${it.unitPrice}\t${Math.round(it.amount)}\t${it.date}`);
      const subtotal = site.items.reduce((s, it) => s + it.amount, 0);
      rows.push(`${site.name}\t小計\t\t\t\t${Math.round(subtotal)}\t`);
      return rows.join('\n');
    });
    return [header, ...blocks, `合計\t\t\t\t\t${Math.round(invoiceGrandTotal)}\t`].join('\n');
  }

    setInvoiceExportText(buildInvoiceTSV());
    setShowInvoiceExport(true);
  }

          </div>

          <button style={styles.staffChip} onClick={changeDeviceStaff}>
            {deviceStaff ? `担当：${deviceStaff}（変更）` : '担当者名を設定'}
          </button>
          {pendingCount > 0 && (
            <span style={styles.pendingBadge}>⏳ 未送信 {pendingCount}件</span>
          )}
        </div>
      </div>

      <div style={styles.tabRow}>
        <button onClick={() => setTab('sched')} style={{ ...styles.tabBtn, ...(tab === 'sched' ? styles.tabBtnActive : {}) }}>予定表</button>
        <button onClick={() => setTab('mgmt')} style={{ ...styles.tabBtn, ...(tab === 'mgmt' ? styles.tabBtnActive : {}) }}>管理表</button>
        <button onClick={() => setTab('dispatch')} style={{ ...styles.tabBtn, ...(tab === 'dispatch' ? styles.tabBtnActive : {}) }}>配車</button>
        <button onClick={() => setTab('gantt')} style={{ ...styles.tabBtn, ...(tab === 'gantt' ? styles.tabBtnActive : {}) }}>工程表</button>
        {ryubeiUnlocked && (
          <button onClick={() => setTab('invoice')} style={{ ...styles.tabBtn, ...(tab === 'invoice' ? styles.tabBtnActive : {}) }}>請求書</button>
        )}
        <button onClick={tryUnlockInvoiceTab} style={styles.lockIconBtn} title="請求書タブ">🔒</button>
      </div>

      {tab !== 'dispatch' && (
        <>
          <div style={styles.searchBox}>
            <input style={styles.searchInput} placeholder="現場名で検索" value={search} onChange={(e) => setSearch(e.target.value)} />
            <div style={styles.searchRow2}>
              <input type="date" style={styles.dateInput} value={dateFrom} onChange={(e) => setDateFrom(e.target.value)} />
              <span style={{ color: '#B0B0A6', fontSize: 12 }}>〜</span>
              <input type="date" style={styles.dateInput} value={dateTo} onChange={(e) => setDateTo(e.target.value)} />
            </div>
            <div style={styles.chipRow}>
              {['全て', ...kumitenList].map((k) => (
                <button key={k} onClick={() => setKumitenFilter(k)} style={{ ...styles.chip, ...(kumitenFilter === k ? styles.chipActive : {}) }}>{k}</button>
              ))}
              <button onClick={() => setShowKumitenEditor(true)} style={styles.addKumitenChip}>⚙ 工務店を編集・並び替え</button>
              {tab === 'sched' && (

              )}
              {tab === 'sched' && (

        {tab === 'sched' && ryubeiUnlocked && <button style={{ ...styles.linkBtn, marginLeft: 16 }} onClick={() => setShowBulkUpdate(true)}>監督名・ハウスNoを一括更新</button>}

          </div>

          <div style={styles.list}>

                <div style={styles.cardBody} onClick={() => openEdit(r)}>

                  {tab === 'sched' && r.note && <div style={styles.noteText}>{r.note}</div>}
                  {tab === 'mgmt' && r.items && <div style={styles.noteText}>{r.items}</div>}


                  {r.staff && <div style={styles.cardMeta}>担当: {r.staff}</div>}
                  <div style={styles.actionRow} onClick={(e) => e.stopPropagation()}>
                    {tab === 'sched' && <button style={styles.handoffBtn} onClick={() => handoffToMgmt(r)}>→ 今日の管理表を作成</button>}

                {tab === 'mgmt' && (

                    ))}
                    <label style={styles.addPhotoBtn}>
                      ＋写真
                      <input type="file" accept="image/*" style={{ display: 'none' }} onChange={(e) => {
                        const file = e.target.files[0];
                        if (file) { const staffName = window.prompt('担当者名を入力してください', deviceStaff || r.staff || ''); if (staffName !== null) addPhotoToMgmt(r.id, staffName, file); }

              </div>
            ))}
          </div>
        </>
      )}

      {tab === 'dispatch' && (
        <div>
          <div style={styles.searchBox}>

              <button style={styles.stepperBtn} onClick={() => changeDumpOnlyCount(dumpOnlyCount + 1)}>＋</button>

            <button style={{ ...styles.linkBtn, marginBottom: 8 }} onClick={copyImportTemplate}>見出し行をコピーする（Excelの1行目に貼り付け用）</button>
            <textarea
              style={{ ...styles.input, minHeight: 200, fontSize: 12 }}
              value={bulkImportText}
              onChange={(e) => setBulkImportText(e.target.value)}
              placeholder="ここにExcelからコピーした内容を貼り付け"
            />
            <div style={styles.sheetActions}>
              <button style={styles.saveBtn} onClick={runBulkImport} disabled={bulkImportBusy}>
                {bulkImportBusy ? '取り込み中…' : '取り込む'}
              </button>
            </div>
          </div>
        </div>
      )}

      {showBulkDelete && (
        <div style={styles.overlay} onClick={() => setShowBulkDelete(false)}>
          <div style={styles.sheet} onClick={(e) => e.stopPropagation()}>
            <div style={styles.sheetHeader}>
              <div style={styles.sheetTitle}>期間を指定して一括削除（{tab === 'sched' ? '現場予定表' : '現場管理表'}）</div>
              <button style={styles.closeBtn} onClick={() => setShowBulkDelete(false)}>✕</button>
            </div>
            <label style={styles.label}>開始日</label>
            <input type="date" style={styles.input} value={bulkFrom} onChange={(e) => setBulkFrom(e.target.value)} />
            <label style={styles.label}>終了日</label>
            <input type="date" style={styles.input} value={bulkTo} onChange={(e) => setBulkTo(e.target.value)} />
            <div style={styles.sheetActions}><button style={styles.deleteBtn} onClick={bulkDelete}>この期間を削除</button></div>
          </div>
        </div>
      )}

      {showExport && (
        <div style={styles.overlay} onClick={() => setShowExport(false)}>
          <div style={styles.sheet} onClick={(e) => e.stopPropagation()}>
            <div style={styles.sheetHeader}>
              <div style={styles.sheetTitle}>マニフェスト用テキスト</div>
              <button style={styles.closeBtn} onClick={() => setShowExport(false)}>✕</button>
            </div>
            <div style={styles.exportHint}>上の検索・日付・工務店の絞り込みが反映されています。コピーしてマニフェストのプロジェクトチャットに貼り付けてください。</div>
            <textarea style={{ ...styles.input, minHeight: 220, fontSize: 13 }} value={exportText} readOnly />
            <div style={styles.sheetActions}><button style={styles.saveBtn} onClick={copyExport}>コピーする</button></div>
          </div>
        </div>
      )}

      {toast && <div style={styles.toast}>{toast}</div>}
      <div style={styles.footerNote}>※このデータはチームで共有されています</div>
    </div>
  );
}
