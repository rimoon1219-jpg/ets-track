function SiteNameAutocomplete({ value, onChange, onSelect, onBlurExtra, options, placeholder, style }) {
  const [open, setOpen] = useState(false);
  const norm = (s) => (s || '').replace(/[〇○]/g, '○').toLowerCase();
  const query = norm(value);
  const matches = query
    ? (options || []).filter((o) => norm(o).includes(query)).slice(0, 30)
    : [];
  return (
    <div style={{ position: 'relative' }}>
      <input
        style={style}
        value={value}
        placeholder={placeholder}
        onChange={(e) => { onChange(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)}
        onBlur={(e) => {
          const evt = e;
          setTimeout(() => setOpen(false), 150);
          if (onBlurExtra) onBlurExtra(evt);
        }}
      />
      {open && matches.length > 0 && (
        <div style={styles.siteSuggestBox}>
          {matches.map((m) => (
            <div
              key={m}
              style={styles.siteSuggestItem}
              onMouseDown={() => { onChange(m); if (onSelect) onSelect(m); setOpen(false); }}
            >
              {m}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function normalizeSiteName(s) {
  if (!s) return '';
  let str = String(s);
  // 全角英数字 → 半角
  str = str.replace(/[Ａ-Ｚａ-ｚ０-９]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
  // 丸数字 → 数字
  const circled = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
  str = str.replace(/[①-⑳]/g, (ch) => String(circled.indexOf(ch) + 1));
  // 全角スペース・半角スペースを除去
  str = str.replace(/[\s　]/g, '');
  // ○（丸記号）の表記ゆれを統一（〇=漢数字のゼロ と ○=図形の丸、どちらで入力されても同じ扱いに）
  str = str.replace(/[〇○]/g, '○');

}

const PENDING_QUEUE_KEY = 'etsTrackPendingQueue';

async function sendToServer(body) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
  });
  return res.json();
}

async function reliableSend(body) {
  const id = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
  const item = { id, body, createdAt: Date.now() };
  const q = getQueue();
  q.push(item);
  saveQueueToDisk(q);
  notifyPendingChange();
  try {
    const result = await sendToServer(body);
    removeFromQueue(id);
    return { ok: true, result };
  } catch (e) {
    // 送信に失敗しても端末には残っているので、あとで自動的に再送信されます
    scheduleRetry();
    return { ok: false, queued: true };
  }
}

function removeFromQueue(id) {
  const q = getQueue().filter((i) => i.id !== id);
  saveQueueToDisk(q);
  notifyPendingChange();
}

let retryTimer = null;
function scheduleRetry() {
  if (retryTimer) return;
  retryTimer = setTimeout(async () => {
    retryTimer = null;
    await retryQueue();
  }, 8000);
}

async function retryQueue() {
  const q = getQueue();
  for (const item of q) {
    try {
      await sendToServer(item.body);
      removeFromQueue(item.id);
    } catch (e) {
      scheduleRetry();
    }
  }
}

}

// 同時アクセスしすぎてサーバー側が詰まらないよう、少しずつ順番に処理する（取得にも後片付けにも使う汎用版）
async function runWithLimit(items, limit, fn) {
  let i = 0;
  async function worker() {
    while (i < items.length) {
      const idx = i++;
      try { await fn(items[idx], idx); } catch (e) { /* ここでのエラーは無視して次へ */ }
    }
  }
  const workers = [];
  for (let w = 0; w < Math.min(limit, items.length); w++) workers.push(worker());
  await Promise.all(workers);
}

async function fetchWithLimit(keys, limit) {
  const results = [];
  await runWithLimit(keys, limit, async (k, idx) => {
    const r = await storage.get(k, true);
    results[idx] = r && r.value ? JSON.parse(r.value) : null;
  });
  return results.filter(Boolean);
}

const storage = {
  async get(key) {
    const res = await fetch(`${API_URL}?action=get&key=${encodeURIComponent(key)}`);
    const data = await res.json();
    if (!data.found) throw new Error('not found: ' + key);
    return { key: data.key, value: data.value };
  },
  async set(key, value) {
    const r = await reliableSend({ action: 'set', key, value });
    return { key, value, queued: !r.ok };
  },
  async delete(key) {
    const r = await reliableSend({ action: 'delete', key });
    return { key, deleted: true, queued: !r.ok };
  },
  async list(prefix) {
    const res = await fetch(`${API_URL}?action=list&prefix=${encodeURIComponent(prefix || '')}`);
    const data = await res.json();
    return { keys: data.keys || [] };
  },
  async uploadPhoto(dataUrl, filename, recordId, staff, recordPrefix) {
    try {
      return await uploadPhotoDirect(dataUrl, filename);
    } catch (e) {
      const q = getPhotoQueue();
      if (q.length >= MAX_PENDING_PHOTOS) {
        throw new Error('保留中の写真が上限（3枚）に達しています。電波の良い場所でもう一度お試しください');

      const id = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;

      notifyPendingChange();
      scheduleRetry();
      return null; // 呼び出し側は「保留中」として扱う

  },
};

function circledNumber(n) {

function normalizeDateStr(input) {
  if (!input) return todayStr();
  const s = input.trim();
  // すでに YYYY-MM-DD 形式ならそのまま
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  // 2026/10/3 や 2026/10/03 のようなスラッシュ区切りに対応
  const m = s.match(/^(\d{4})[\/年](\d{1,2})[\/月](\d{1,2})/);
  if (m) {
    const y = m[1];
    const mo = m[2].padStart(2, '0');
    const d = m[3].padStart(2, '0');
    return `${y}-${mo}-${d}`;
  }
  return s; // それでも分からなければそのまま返す
}

function addDays(dateStr, days) {

}

function compressImage(file, maxSize = 640, quality = 0.55) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxSize) {
          height = Math.round((height * maxSize) / width);
          width = maxSize;
        } else if (height > maxSize) {
          width = Math.round((width * maxSize) / height);
          height = maxSize;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function extractArea(address) {
  if (!address) return '未分類';
  let s = address.trim();
  // 都道府県を取り除く
  s = s.replace(/^.*?(都|道|府|県)/, '');
  // 郵便番号などを取り除く
  s = s.replace(/^〒?\d{3}-?\d{4}\s*/, '');
  // 市 + 区 のパターン（例：横浜市神奈川区）
  let m = s.match(/^([^\s0-9０-９]+?市)([^\s0-9０-９]+?区)/);
  if (m) return m[1] + m[2];
  // 市のみ（例：大和市）
  m = s.match(/^([^\s0-9０-９]+?市)/);
  if (m) return m[1];
  // 郡 + 町村
  m = s.match(/^([^\s0-9０-９]+?郡[^\s0-9０-９]+?[町村])/);
  if (m) return m[1];
  // 区のみ（東京23区想定）
  m = s.match(/^([^\s0-9０-９]+?区)/);
  if (m) return m[1];
  return '未分類';
}

function loadGoogleMapsScript() {
  return new Promise((resolve, reject) => {
    if (window.google && window.google.maps) { resolve(); return; }
    if (!GOOGLE_MAPS_API_KEY || GOOGLE_MAPS_API_KEY.indexOf('PASTE_') === 0) { reject(new Error('no_key')); return; }
    const existing = document.getElementById('gmaps-script');
    if (existing) { existing.addEventListener('load', () => resolve()); return; }
    const script = document.createElement('script');
    script.id = 'gmaps-script';
    script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}`;
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('load_failed'));
    document.head.appendChild(script);
  });
}

async function geocodeAddress(address) {
  if (!address) return null;
  try {
    const cached = await storage.get(`geocode:${address}`);
    if (cached && cached.value) return JSON.parse(cached.value);
  } catch (e) { /* キャッシュなし、続けて取得 */ }
  return new Promise((resolve) => {
    const geocoder = new window.google.maps.Geocoder();
    geocoder.geocode({ address }, async (results, status) => {
      if (status === 'OK' && results[0]) {
        const loc = results[0].geometry.location;
        const latLng = { lat: loc.lat(), lng: loc.lng() };
        try { await storage.set(`geocode:${address}`, JSON.stringify(latLng)); } catch (e) {}
        resolve(latLng);
      } else {
        resolve(null);
      }
    });
  });
}

function daysInMonth(year, month) { return new Date(year, month + 1, 0).getDate(); }
function firstWeekday(year, month) { return new Date(year, month, 1).getDay(); }
function isSaturday(dateStr) { return new Date(dateStr + 'T00:00:00').getDay() === 6; }

// ---------- Month calendar (like TimeTree month view) ----------
function MonthCalendar({ records, monthCursor, setMonthCursor, onPickDate, selectedDate }) {
  const [year, month] = monthCursor.split('-').map(Number);
  const total = daysInMonth(year, month - 1);
  const startWeekday = firstWeekday(year, month - 1);

  // 日付ごとに、その日に含まれるステータスの種類と件数を集計
  const infoByDate = {};
  records.forEach((r) => {
    if (!infoByDate[r.date]) infoByDate[r.date] = { count: 0, statuses: [] };
    infoByDate[r.date].count++;
    if (!infoByDate[r.date].statuses.includes(r.status)) infoByDate[r.date].statuses.push(r.status);
  });

  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= total; d++) {
    const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    cells.push(dateStr);
  }

  function shiftMonth(delta) {
    let m = month + delta, y = year;
    if (m > 12) { m = 1; y += 1; }
    if (m < 1) { m = 12; y -= 1; }
    setMonthCursor(`${y}-${String(m).padStart(2, '0')}`);
  }

  const MAX_DOTS = 4;

  return (
    <div style={styles.calBox}>
      <div style={styles.calHeader}>
        <button style={styles.calNavBtn} onClick={() => shiftMonth(-1)}>‹</button>
        <div style={styles.calTitle}>{year}年{month}月</div>
        <button style={styles.calNavBtn} onClick={() => shiftMonth(1)}>›</button>
      </div>
      <div style={styles.calWeekRow}>
        {['日', '月', '火', '水', '木', '金', '土'].map((w) => (
          <div key={w} style={styles.calWeekLabel}>{w}</div>
        ))}
      </div>
      <div style={styles.calGrid}>
        {cells.map((dateStr, i) => {
          if (!dateStr) return <div key={i} style={styles.calCellEmpty} />;
          const info = infoByDate[dateStr];
          const day = Number(dateStr.slice(-2));
          const sat = isSaturday(dateStr);
          const dots = info ? info.statuses.slice(0, MAX_DOTS) : [];
          const extra = info ? Math.max(0, info.statuses.length - MAX_DOTS) : 0;
          const isSelected = dateStr === selectedDate;
          return (
            <div
              key={i}
              onClick={() => onPickDate(dateStr)}
              style={{
                ...styles.calCell,
                ...(sat ? { color: '#457B9D' } : {}),
              }}
            >
              {isSelected && <div style={styles.calSelectedBar} />}
              <span style={styles.calDayNum}>{day}</span>
              {info && (
                <>
                  <div style={styles.calDotRow}>
                    {dots.map((s) => (
                      <span key={s} style={{ ...styles.calDot, background: statusColor(SCHED_STATUSES, s) }} />
                    ))}
                    {extra > 0 && <span style={styles.calDotMore}>+{extra}</span>}
                  </div>
                  <span style={styles.calCount}>{info.count}件</span>
                </>
              )}

          );
        })}

    </div>
  );
}

// ---------- Gantt-style progress chart (新規〜最終) ----------
function dateToDay(dateStr) {
  return Math.floor(new Date(dateStr + 'T00:00:00').getTime() / 86400000);
}
function dayToDate(day) {
  return new Date(day * 86400000).toISOString().slice(0, 10);
}

function GanttChart({ schedRecords, kumitenFilter, windowStart, windowEnd, onShift, onPickKumiten, kumitenList }) {
  const todayDay = dateToDay(todayStr());
  const startDay = dateToDay(windowStart);
  const endDay = dateToDay(windowEnd);
  const totalDays = Math.max(1, endDay - startDay);

  const bySite = {};
  schedRecords.forEach((r) => {
    if (kumitenFilter !== '全て' && r.kumiten !== kumitenFilter) return;
    if (!bySite[r.name]) bySite[r.name] = { name: r.name, kumiten: r.kumiten, dates: [], hasFinal: false, finalDay: null, hasSingle: false };
    const d = dateToDay(r.date);
    bySite[r.name].dates.push(d);
    if (r.status === '最終') {
      bySite[r.name].hasFinal = true;
      bySite[r.name].finalDay = bySite[r.name].finalDay === null ? d : Math.max(bySite[r.name].finalDay, d);
    }
    if (r.status === '単発') {
      bySite[r.name].hasSingle = true;
    }
  });

  const rows = Object.values(bySite).map((s) => {
    const minDay = Math.min(...s.dates);
    const maxDay = Math.max(...s.dates);
    const isDone = s.hasFinal || s.hasSingle; // 最終が付いた、または単発の仕事は「完了扱い」にする
    const barEndDay = s.hasFinal ? s.finalDay : (s.hasSingle ? maxDay : Math.max(maxDay, todayDay));
    return { ...s, startDay: minDay, endDay: barEndDay, ongoing: !isDone, isDone };
  })
    .filter((s) => !(s.isDone && todayDay - s.endDay > 14)) // 完了（最終／単発）から2週間経過したら工程表から非表示（データ自体は消えません）
    .filter((s) => s.endDay >= startDay && s.startDay <= endDay)
    .sort((a, b) => a.startDay - b.startDay);

  // 月の目盛り
  const monthTicks = [];
  let cursor = new Date(windowStart + 'T00:00:00');
  cursor.setDate(1);
  while (dateToDay(cursor.toISOString().slice(0, 10)) <= endDay) {
    const d = dateToDay(cursor.toISOString().slice(0, 10));
    if (d >= startDay) monthTicks.push({ day: d, label: `${cursor.getMonth() + 1}月` });
    cursor.setMonth(cursor.getMonth() + 1);
  }

  const overlappingToday = rows.filter((r) => r.startDay <= todayDay && r.endDay >= todayDay).length;

  return (
    <div>
      <div style={styles.searchBox}>
        <div style={styles.chipRow}>
          {['全て', ...kumitenList].map((k) => (
            <button key={k} onClick={() => onPickKumiten(k)} style={{ ...styles.chip, ...(kumitenFilter === k ? styles.chipActive : {}) }}>{k}</button>
          ))}
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 10 }}>
          <button style={styles.calNavBtn} onClick={() => onShift(-1)}>‹ 前月</button>
          <span style={{ fontSize: 12.5, color: '#5A5A54' }}>{windowStart} 〜 {windowEnd}</span>
          <button style={styles.calNavBtn} onClick={() => onShift(1)}>次月 ›</button>
        </div>
      </div>

      <div style={styles.dispatchSummary}>
        <span>表示中 {rows.length}件</span>
        <span style={{ fontWeight: 700, color: '#E63946' }}>本日時点で重なり {overlappingToday}件</span>
      </div>

      <div style={styles.ganttBox}>
        <div style={styles.ganttAxis}>
          {monthTicks.map((t, i) => (
            <div key={i} style={{ ...styles.ganttTick, left: `${((t.day - startDay) / totalDays) * 100}%` }}>{t.label}</div>
          ))}
          <div style={{ ...styles.ganttTodayLine, left: `${((todayDay - startDay) / totalDays) * 100}%` }} />
        </div>

        {rows.length === 0 && <div style={styles.empty}>この期間・工務店に該当する現場がありません。</div>}

        {rows.map((r) => {
          const left = Math.max(0, ((r.startDay - startDay) / totalDays) * 100);
          const right = Math.min(100, ((r.endDay - startDay) / totalDays) * 100);
          const width = Math.max(1.5, right - left);
          return (
            <div key={r.name} style={styles.ganttRow}>
              <div style={styles.ganttLabel}>{r.name}</div>
              <div style={styles.ganttTrack}>
                <div
                  style={{
                    ...styles.ganttBar,
                    left: `${left}%`,
                    width: `${width}%`,
                    background: r.ongoing ? '#2A9D8F' : (r.hasSingle && !r.hasFinal ? '#FFB703' : '#9A9A94'),
                  }}
                  title={`${dayToDate(r.startDay)} 〜 ${dayToDate(r.endDay)}${r.ongoing ? '（進行中）' : (r.hasSingle && !r.hasFinal ? '（単発）' : '（最終済み）')}`}
                />
              </div>
            </div>
          );
        })}
      </div>

      <div style={styles.mapLegend}>
        <span style={styles.mapLegendItem}><span style={{ ...styles.truckDot, background: '#2A9D8F' }} />進行中（最終未登録）</span>
        <span style={styles.mapLegendItem}><span style={{ ...styles.truckDot, background: '#9A9A94' }} />最終済み</span>
        <span style={styles.mapLegendItem}><span style={{ ...styles.truckDot, background: '#FFB703' }} />単発</span>
        <span style={styles.mapLegendItem}><span style={{ ...styles.truckDot, background: '#E63946' }} />本日のライン</span>
      </div>
    </div>
  );
}

  // 他のアプリ・タブに切り替えて、またこの画面に戻ってきた時に自動で最新データを取り直す
  // （フォームを開いて入力中のときは邪魔しないよう対象外。短時間の連続実行は間引く）
  const lastAutoRefreshRef = useRef(Date.now());

    function handleVisible() {

    document.addEventListener('visibilitychange', handleVisible);
    window.addEventListener('focus', handleVisible);

          const [latStr, lngStr] = s.address.split(/[,、]/);
          loc = { lat: parseFloat(latStr), lng: parseFloat(lngStr) };
        } else {
          loc = await geocodeAddress(geocodeQuery(s.address));
        }
        if (cancelled) return;
        if (!loc) continue;
        const truckId = assignments[s.id];
        const idx = opts.findIndex((o) => o.id === truckId);
        const color = idx >= 0 ? TRUCK_COLORS[idx % TRUCK_COLORS.length] : '#9A9A94';

          position: loc,
          map,
          icon: markerIcon(color),

        });
        mapMarkersRef.current.push(marker);
        bounds.extend(loc);
        placed++;
      }
      if (placed > 0) map.fitBounds(bounds);
      if (!cancelled) setMapStatus('ready');
    }
    build();
    return () => { cancelled = true; };
  }, [showDispatchMap, dispatchDate, assignments, regularTruckCount, includeKei, dumpOnlyCount]);

  async function load() {
    setLoading(true);
    let list = kumitenList;
    try {
      try {
        const km = await storage.get('meta:kumiten', true);
        list = DEFAULT_KUMITEN;
        if (km && km.value) {
          list = JSON.parse(km.value);
          const missing = DEFAULT_KUMITEN.filter((n) => n !== 'その他' && !list.includes(n));
          if (missing.length > 0) {
            const others = list.filter((k) => k !== 'その他');
            list = list.includes('その他') ? [...others, ...missing, 'その他'] : [...list, ...missing];
          }
        }
        await storage.set('meta:kumiten', JSON.stringify(list), true);
        setKumitenList(list);
      } catch (e) { setKumitenList(DEFAULT_KUMITEN); }

      async function fetchGroup(prefix) {
        const listRes = await storage.list(`${prefix}:`, true);
        return fetchWithLimit((listRes && listRes.keys) || [], 8);
      }
      const [sItems, mItems, tItems] = await Promise.all([
        fetchGroup('sched'),
        fetchGroup('mgmt'),
        fetchGroup('todo'),
      ]);
      sItems.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      setSchedRecords(sItems);

      mItems.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      setMgmtRecords(mItems);

      tItems.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
      setTodos(tItems);
      syncAutoTodos(sItems, tItems); // 大量の片付けが必要な場合でも画面が固まらないよう、待たずにバックグラウンドで実行

      setCachedRecords(sItems, mItems, list, tItems);
    } catch (e) { console.error(e); }
    setLoading(false);
  }

  const QUICK_TODO_TAGS = ['工程表画像添付', '監督連絡', '社長連絡'];

  async function addTodo(overrides) {
    const text = (overrides && overrides.text) || todoText.trim();
    if (!text) return;
    const record = {
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
      text,
      siteName: (overrides && overrides.siteName) || todoSiteName.trim() || '',
      siteId: (overrides && overrides.siteId) || '',
      date: (overrides && overrides.date) || todoDate || '',
      staff: (overrides && overrides.auto) ? '自動検出' : getDeviceStaff(),
      auto: !!(overrides && overrides.auto),
      checkType: (overrides && overrides.checkType) || '',
      featureKey: (overrides && overrides.featureKey) || '',
      todoType: (overrides && overrides.todoType) || 'task',
      important: !!(overrides && overrides.important),
      seenBy: (overrides && overrides.auto) ? [] : [getDeviceStaff()].filter(Boolean),
      createdAt: new Date().toISOString(),
    };
    await storage.set(`todo:${record.id}`, JSON.stringify(record), true);
    setTodos((prev) => [record, ...prev]);
    if (!overrides) { setTodoText(''); setTodoSiteName(''); setTodoDate(''); }
    return record;
  }

  // 重要マークの切り替え（タスク・伝達どちらでも、そのリストの一番上に固定表示される）
  async function toggleImportant(t) {
    const next = { ...t, important: !t.important };
    setTodos((prev) => prev.map((x) => (x.id === t.id ? next : x)));
    await storage.set(`todo:${t.id}`, JSON.stringify(next), true);
  }

  // 座標だけが入っていて、ちゃんとした住所になっていないものを検出（例：35.331,139.445 など）
  function isCoordOnlyAddress(address) {
    const a = (address || '').trim();
    if (!a) return false;
    return /^-?\d{1,3}\.\d+\s*[,、]\s*-?\d{1,3}\.\d+$/.test(a);
  }

  // 機能の動作確認タスクを追加しつつ、過去にバグで溜まった「現場ごとの不足項目」TODO（自動生成・重複含む）を一括で片付ける。
  // 不足項目チェックは、以後はTODOに保存せず、その場で計算して表示する方式に変更（詳しくはinfoGapSites参照）
  async function syncAutoTodos(sItems, tItems) {
    const legacyGapTodos = tItems.filter((t) => t.auto && t.siteId && t.checkType !== 'feature');
    await runWithLimit(legacyGapTodos, 6, async (t) => { await completeTodo(t.id); });

    // 完了済み（やった済み）の動作確認は、二度と作り直さない
    let dismissedFeatures = [];
    try {
      const r = await storage.get('meta:dismissedFeatures', true);
      if (r && r.value) dismissedFeatures = JSON.parse(r.value);
    } catch (e) { dismissedFeatures = []; }

    // 機能の動作確認タスクは、テキストが一致するものをまとめて「1つだけ残して重複は削除」にする
    // （過去にcheckType/featureKeyが保存されずに何度も複製されてしまった分の後片付けも兼ねる）
    const featureTexts = new Set(FEATURE_CHECKLIST.map((f) => f.text));
    const featureLikeTodos = tItems.filter((t) => featureTexts.has(t.text));
    const seenFeatureText = new Set();
    const featureDupes = [];
    featureLikeTodos
      .slice()
      .sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || '')) // 新しい順
      .forEach((t) => {
        if (seenFeatureText.has(t.text)) featureDupes.push(t);
        else seenFeatureText.add(t.text);
      });
    await runWithLimit(featureDupes, 6, async (t) => { await completeTodo(t.id); });

    // まだ一度も追加されておらず、完了済みでもない機能があれば追加する。既存の生き残りがcheckType未設定の古いデータなら補完する
    for (const f of FEATURE_CHECKLIST) {
      if (dismissedFeatures.includes(f.key)) continue;
      if (!seenFeatureText.has(f.text)) {
        await addTodo({ text: f.text, auto: true, checkType: 'feature', featureKey: f.key });
      } else {
        const survivor = featureLikeTodos.find((t) => t.text === f.text && !featureDupes.includes(t));
        if (survivor && survivor.checkType !== 'feature') {
          const updated = { ...survivor, auto: true, checkType: 'feature', featureKey: f.key };
          await storage.set(`todo:${survivor.id}`, JSON.stringify(updated), true);
          setTodos((prev) => prev.map((t) => (t.id === survivor.id ? updated : t)));
        }
      }
    }
  }

  // マニフェストに必要な項目（工務店・監督名・ハウスNo、今日以降の現場のみ）と、住所の抜け（全期間）をその場で計算する。
  // 電話番号はマニフェストに不要なため対象外。保存はしない（重複しようがない）
  function infoGapSites() {
    const today = todayStr();
    return schedRecords
      .map((r) => {
        const gaps = [];
        // 座標のみの住所は地図には出せるが、マニフェスト等では正式住所が必要なため一覧には残す。
        // ただし地図が使えない「完全に空欄」ほど急ぎではないので、赤字の緊急表示・並び順の最優先からは外す
        if (isCoordOnlyAddress(r.address)) gaps.push('住所(座標のみ)');
        else if (!(r.address || '').trim()) gaps.push('住所');
        if (r.date >= today) {
          if (!(r.kumiten || '').trim()) gaps.push('工務店');
          if (!(r.supervisorName || '').trim()) gaps.push('監督名');
          if (!(r.supervisorPhone || '').trim()) gaps.push('電話番号');
          if (!(r.houseNumber || '').trim()) gaps.push('ハウスNo');
        }
        return { r, gaps };
      })
      .filter((x) => x.gaps.length > 0)
      // 住所が完全に空欄のものを最優先（地図に出せず一番困る）。座標のみは地図は使えるので通常優先度。次に現場の日付が近い順
      .sort((a, b) => {
        const aAddr = a.gaps.includes('住所') ? 0 : 1;
        const bAddr = b.gaps.includes('住所') ? 0 : 1;
        if (aAddr !== bAddr) return aAddr - bAddr;
        return (a.r.date || '').localeCompare(b.r.date || '');
      });
  }

  // 情報不足の現場を工務店ごとにグループ化する（工務店が空の分は「工務店未設定」としてまとめる）
  function infoGapsByKumiten() {
    const groups = {};
    const order = [];
    infoGapSites().forEach((x) => {
      const k = x.r.kumiten || '工務店未設定';
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(x);
    });
    return order.map((k) => ({ kumiten: k, items: groups[k] }));
  }

  // 工程表画像添付を最優先、その次は現場の日付が近い順（日付が無いものは後ろ）
  function sortedTasks() {
    return sortedTodosBase().filter((t) => t.todoType !== 'memo');
  }
  function sortedMemos() {
    return sortedTodosBase().filter((t) => t.todoType === 'memo');
  }
  function sortedTodosBase() {
    return [...todos]
      .filter((t) => t.checkType !== 'feature')
      .sort((a, b) => {
        const aImp = a.important ? 0 : 1;
        const bImp = b.important ? 0 : 1;
        if (aImp !== bImp) return aImp - bImp;
        const aGantt = a.text.includes('工程表画像添付') ? 0 : 1;
        const bGantt = b.text.includes('工程表画像添付') ? 0 : 1;
        if (aGantt !== bGantt) return aGantt - bGantt;
        const aDate = a.date || '9999-99-99';
        const bDate = b.date || '9999-99-99';
        if (aDate !== bDate) return aDate.localeCompare(bDate);
        return (b.createdAt || '').localeCompare(a.createdAt || '');
      });
  }

  // 「見た」ボタンを押した人（端末の担当者名）を記録する
  async function markSeenBy(t) {
    const me = getDeviceStaff();
    if (!me) { showToast('先に右上で担当者名を設定してください'); return; }
    if ((t.seenBy || []).includes(me)) return;
    const updated = { ...t, seenBy: [...(t.seenBy || []), me] };
    setTodos((prev) => prev.map((x) => (x.id === t.id ? updated : x)));
    await storage.set(`todo:${t.id}`, JSON.stringify(updated), true);
  }

  function featureCheckTodos() {
    return todos.filter((t) => t.checkType === 'feature').sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));
  }

  async function completeTodo(id) {
    const target = todos.find((t) => t.id === id);
    setTodos((prev) => prev.filter((t) => t.id !== id));
    try { await storage.delete(`todo:${id}`, true); } catch (e) { console.error(e); }
    // 動作確認タスクは、完了したことを覚えておかないと次の読み込みでまた作られてしまうので、完了済みリストに記録する
    if (target && target.checkType === 'feature' && target.featureKey) {

  const dispatchSaveChainRef = useRef(Promise.resolve());

  async function saveDispatch(nextAssignments, nextRegular, nextKei, nextDump, nextExtra, nextCollectNote, nextDumpNote) {
    const payload = {
      regularTruckCount: nextRegular,
      includeKei: nextKei,
      dumpOnlyCount: nextDump,
      assignments: nextAssignments,
      extraSiteIds: nextExtra !== undefined ? nextExtra : extraSiteIds,
      collectNote: nextCollectNote !== undefined ? nextCollectNote : collectNote,
      dumpNote: nextDumpNote !== undefined ? nextDumpNote : dumpNote,

    const run = dispatchSaveChainRef.current.catch(() => {}).then(() => storage.set(`dispatch:${date}`, JSON.stringify(payload), true));

  // 曜日ごとに「まとめて回りたいエリア」の考え方（洋子さんの配車ルールに準拠）
// 月・木＝川崎～横浜北部～東京方面／火・金＝相模原～県央～西湘方面／水・土＝横浜南部～横須賀～鎌倉～藤沢南方面
// 寒川・茅ヶ崎・藤沢北側・平塚近場などの境界エリアはどこにも固定せず、バランスを見て割り振る
const ZONE_RULES = [
  { days: [1, 4], name: '月木エリア（川崎・横浜北部・東京方面）', keywords: ['川崎', '青葉区', '横浜市緑区', '港北区', '神奈川区', '鶴見区', '旭区', '東京'] },
  { days: [2, 5], name: '火金エリア（相模原・県央・西湘方面）', keywords: ['相模原', '町田', '大和', '座間', '海老名', '厚木', '秦野', '足柄', '小田原', '大磯', '八王子', '平塚'] },
  { days: [3, 6], name: '水土エリア（横浜南部・横須賀・鎌倉・藤沢方面）', keywords: ['磯子区', '横浜市南区', '西区', '中区', '保土ヶ谷区', '横須賀', '葉山', '逗子', '鎌倉', '藤沢'] },
];
function zoneRuleForDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return ZONE_RULES.find((r) => r.days.includes(d.getDay())) || null;
}

function autoAssignTrucks() {
    const opts = buildTruckOptions(regularTruckCount, includeKei, dumpOnlyCount);
    if (opts.length === 0) { showToast('トラックがありません'); return; }
    const counts = {};
    opts.forEach((o) => { counts[o.id] = 0; });
    Object.values(assignments).forEach((id) => { if (counts[id] !== undefined) counts[id]++; });

    // 地域ごとにまとめる（曜日のエリアルールに合うものは、細かい地域名が違っても同じゾーンとしてまとめる）
    // 住所不明で地域が分からない現場（未分類）は、誤った割り振りを避けるため自動割り振りの対象外にする
    const zoneRule = zoneRuleForDate(dispatchDate);
    const areaOrder = [];
    const areas = {};
    let skippedUnknown = 0;
    daySites.forEach((s) => {
      if (assignments[s.id]) return; // すでに割り振り済みはそのまま
      const rawArea = s.area || extractArea(s.address) || '未分類';
      if (rawArea === '未分類') { skippedUnknown++; return; } // 場所が分からないので対象外
      const zoneMatch = zoneRule && zoneRule.keywords.find((kw) => rawArea.includes(kw));
      const groupKey = zoneMatch ? zoneRule.name : rawArea;
      if (!areas[groupKey]) { areas[groupKey] = []; areaOrder.push(groupKey); }
      areas[groupKey].push(s);
    });

    const unassignedTotal = areaOrder.reduce((sum, a) => sum + areas[a].length, 0);
    const target = Math.max(1, Math.ceil(unassignedTotal / opts.length)); // 1台あたりの目安件数

    const next = { ...assignments };
    let truckIdx = 0;
    areaOrder.forEach((area) => {
      const sites = areas[area];
      // 今のトラックがすでに目安件数に達していて、次のトラックがまだ残っていれば進める
      // （地域を分割はしない＝同じ地域は必ず同じトラックにまとめる）
      while (truckIdx < opts.length - 1 && counts[opts[truckIdx].id] >= target) {
        truckIdx++;
      }
      const truckId = opts[truckIdx].id;
      sites.forEach((s) => { next[s.id] = truckId; counts[truckId]++; });
    });

    setAssignments(next);
    saveDispatch(next, regularTruckCount, includeKei, dumpOnlyCount);
    const zoneLabel = zoneRule ? `${zoneRule.name}の考え方に沿って` : '地域のまとまりを優先して';
    showToast(skippedUnknown > 0
      ? `${zoneLabel}割り振りました（住所不明の${skippedUnknown}件は未割当のままです）`
      : `${zoneLabel}割り振りました（手動でも調整できます）`);
  }

  function buildTruckOptions(regular, kei, dump) {
    const opts = [];
    for (let i = 1; i <= regular; i++) opts.push({ id: `R${i}`, label: `トラック${i}` });
    if (kei) opts.push({ id: 'KEI', label: '軽自動車' });
    for (let i = 1; i <= dump; i++) opts.push({ id: `D${i}`, label: `捨て専用${i}` });
    return opts;
  }

  function showToast(msg) { setToast(msg); setTimeout(() => setToast(''), 2500); }

  // 似た現場名（表記ゆれ違い）が既にあれば返す
  function findSimilarSiteName(name) {
    const trimmed = (name || '').trim();
    if (!trimmed) return null;
    const norm = normalizeSiteName(trimmed);
    const allNames = new Set([...schedRecords.map((r) => r.name), ...mgmtRecords.map((r) => r.name)]);
    for (const existing of allNames) {
      if (existing === trimmed) return null; // 完全一致は問題なし
      if (normalizeSiteName(existing) === norm) return existing;
    }
    return null;
  }

  function siteNameOptions() {
    const set = new Set([...schedRecords.map((r) => r.name), ...mgmtRecords.map((r) => r.name)]);
    return Array.from(set).filter(Boolean).sort();
  }

  function fillFromExistingSite(name) {
    if (editingId) return; // 既存の編集中は上書きしない
    const trimmed = (name || '').trim();
    if (!trimmed) return;
    const match = schedRecords.find((r) => r.name.trim() === trimmed);
    if (!match) return;
    setForm((f) => ({
      ...f,
      supervisorName: f.supervisorName || match.supervisorName || '',
      supervisorPhone: f.supervisorPhone || match.supervisorPhone || '',
      houseNumber: f.houseNumber || match.houseNumber || '',
      garaRequired: f.garaRequired || match.garaRequired || false,
      expectedVisits: match.expectedVisits || f.expectedVisits || '12',
      area: f.area || match.area || '',
      address: f.address || match.address || '',
    }));
  }

  // 監督名から電話番号を自動入力（同じ組頭＝工務店内で、過去に登録がある場合のみ。
  // 「高橋さん」等の同姓が他の工務店にいても混同しないよう、組頭名も一致するものだけを対象にする）
  function fillPhoneFromSupervisorName(name) {
    const trimmed = (name || '').trim();
    if (!trimmed || form.supervisorPhone) return; // 電話番号が既に入力済みなら上書きしない
    const candidates = schedRecords
      .filter((r) => r.kumiten === form.kumiten && (r.supervisorName || '').trim() === trimmed && r.supervisorPhone)
      .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const match = candidates[0];
    if (!match) return;
    setForm((f) => (f.supervisorPhone ? f : { ...f, supervisorPhone: match.supervisorPhone }));
    showToast(`${form.kumiten}の${trimmed}さんの電話番号を自動入力しました`);
  }

  function openNew() {
    setForm(tab === 'sched' ? emptySched() : emptyMgmt());
    setEditingId(null);
    setPendingPhotos([]);
    setShowForm(true);
  }

  // 同じ現場名・同じ日付の重複登録がないかチェック（一括入力と手入力が重なった時用）
  function findDuplicateGroups() {
    const map = {};
    schedRecords.forEach((r) => {
      const key = `${r.date}__${normalizeSiteName(r.name)}`;
      if (!map[key]) map[key] = [];
      map[key].push(r);
    });
    return Object.values(map).filter((g) => g.length > 1);
  }

    setForm(r);
    setEditingId(r.id);
    setPendingPhotos([]);
    setShowForm(true);
  }

  function handoffToMgmt(schedRecord) {
    setForm({ ...emptyMgmt(), name: schedRecord.name, kumiten: schedRecord.kumiten, staff: schedRecord.staff || '', date: todayStr() });
    setEditingId(null);
    setPendingPhotos([]);
    setTab('mgmt');
    setShowForm(true);
  }

  function duplicateRecord(r, dayOffset = 7) {
    const { id, createdAt, photos, ...rest } = r;
    setForm({ ...rest, date: addDays(r.date, dayOffset), photos: [] });
    setEditingId(null);
    setPendingPhotos([]);

  async function saveRecord() {
    if (!form.name.trim()) { showToast('現場名を入力してください'); return; }
    setSaving(true);
    const prefix = tab === 'sched' ? 'sched' : 'mgmt';
    const id = editingId || `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    let record = { ...form, id, createdAt: form.createdAt || Date.now() };
    if (tab === 'sched' && record.address && !record.area) {
      record = { ...record, area: extractArea(record.address) };
    }
    let extraPhotos = [];
    if (pendingPhotos.length > 0) {
      showToast(`写真をアップロード中…（${pendingPhotos.length}枚）`);
      for (const file of pendingPhotos) {
        try {
          const dataUrl = await compressImage(file);
          const staffName = deviceStaff || form.staff || '担当者';
          const url = await storage.uploadPhoto(dataUrl, `${id}_${Date.now()}.jpg`, id, staffName, prefix);
          if (url) {
            extraPhotos.push({ staff: staffName, img: url, at: Date.now() });
          } else {
            showToast('一部の写真は保留中です。あとで自動的に追加されます');
          }
        } catch (e) { showToast(e.message || '写真の保存に失敗しました'); }
      }
    }
    if (extraPhotos.length > 0) {
      record = { ...record, photos: [...(record.photos || []), ...extraPhotos] };
    }
    try {
      const result = await storage.set(`${prefix}:${id}`, JSON.stringify(record), true);
      showToast(result.queued ? '保存を保留しました。電波が戻り次第、自動的に送信されます' : '保存しました');
      setShowForm(false);
      setEditingId(null);
      setPendingPhotos([]);
      applyLocalRecordUpdate(prefix, record);
    } catch (e) { showToast('保存に失敗しました'); }
    setSaving(false);
  }

  // 保存直後は全件を読み直さず、その場で一覧・カレンダーに反映する（サーバーへの再取得を待たない分、体感が速くなる）
  function applyLocalRecordUpdate(prefix, record) {
    if (prefix === 'sched') {
      setSchedRecords((prev) => {
        const next = [record, ...prev.filter((r) => r.id !== record.id)];
        next.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        setCachedRecords(next, mgmtRecords, kumitenList, todos);
        syncAutoTodos(next, todos);
        return next;
      });
    } else {
      setMgmtRecords((prev) => {
        const next = [record, ...prev.filter((r) => r.id !== record.id)];
        next.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        setCachedRecords(schedRecords, next, kumitenList, todos);
        return next;
      });
    }
  }

  async function runBulkImport() {
    const lines = bulkImportText.split('\n').map((l) => l.trim()).filter((l) => l.length > 0);
    if (lines.length === 0) { showToast('貼り付けるデータがありません'); return; }
    setBulkImportBusy(true);
    let count = 0;
    for (const line of lines) {
      const cols = line.split('\t');
      const [name, kumiten, address, date, time, status, supervisorName, supervisorPhone, gara, expectedVisits, staff, note] = cols;
      if (!name || name === '現場名') continue; // ヘッダー行はスキップ
      const id = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      const record = {
        id, createdAt: Date.now(),
        name: name.trim(),
        kumiten: (kumiten || 'その他').trim(),
        address: (address || '').trim(),
        area: (address ? extractArea(address) : '') ,

  async function deleteRecord(id) {
    const prefix = tab === 'sched' ? 'sched' : 'mgmt';
    const source = tab === 'sched' ? schedRecords : mgmtRecords;
    const record = source.find((r) => r.id === id);
    if (!window.confirm(`「${record ? record.name : 'この現場'}」を削除しますか？（あとでゴミ箱から復元できます）`)) return;
    try {
      if (record) {
        await storage.set(`trash:${id}`, JSON.stringify({ ...record, _type: prefix, deletedAt: new Date().toISOString() }), true);
      }
      const result = await storage.delete(`${prefix}:${id}`, true);
      showToast(result.queued ? '削除を保留しました。電波が戻り次第、自動的に反映されます' : '削除しました（ゴミ箱に30日間残ります）');
      if (prefix === 'sched') setSchedRecords((prev) => prev.filter((r) => r.id !== id));
      else setMgmtRecords((prev) => prev.filter((r) => r.id !== id));
    } catch (e) { showToast('削除に失敗しました'); }
  }

  async function loadTrash() {
    const list = await storage.list('trash:', true);
    const items = (await Promise.all(
      ((list && list.keys) || []).map(async (k) => {
        try {
          const r = await storage.get(k, true);
          return r && r.value ? JSON.parse(r.value) : null;
        } catch (e) { return null; }
      })
    )).filter(Boolean);
    items.sort((a, b) => (b.deletedAt || '').localeCompare(a.deletedAt || ''));
    // 30日を過ぎたゴミ箱の中身は自動で完全削除する
    const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
    const fresh = [];
    for (const item of items) {
      const t = item.deletedAt ? new Date(item.deletedAt).getTime() : 0;
      if (t && t < cutoff) {
        try { await storage.delete(`trash:${item.id}`, true); } catch (e) { /* ignore */ }
      } else {
        fresh.push(item);
      }
    }
    setTrashItems(fresh);
  }

  async function restoreFromTrash(item) {
    const { _type, deletedAt, ...rest } = item;
    await storage.set(`${_type}:${item.id}`, JSON.stringify(rest), true);

    showToast(`「${item.name}」を復元しました`);

  // 工務店名を正式名称などに変更。過去にその工務店名で登録された現場も一括で新しい名前に更新する
  async function renameKumiten(index) {
    const oldName = kumitenList[index];
    const input = window.prompt(`「${oldName}」の新しい名前を入力してください（正式名称など）`, oldName);
    if (!input || !input.trim() || input.trim() === oldName) return;
    const newName = input.trim();
    if (kumitenList.includes(newName)) { showToast('すでに同じ名前があります'); return; }
    const affectedSched = schedRecords.filter((r) => r.kumiten === oldName);
    const affectedMgmt = mgmtRecords.filter((r) => r.kumiten === oldName);
    const affected = [...affectedSched, ...affectedMgmt];
    if (affected.length > 0 && !window.confirm(`「${oldName}」で登録済みの現場が${affected.length}件あります。すべて「${newName}」に変更しますか？`)) return;
    setLoading(true);
    try {
      for (const r of affectedSched) {
        await storage.set(`sched:${r.id}`, JSON.stringify({ ...r, kumiten: newName }));
      }
      for (const r of affectedMgmt) {
        await storage.set(`mgmt:${r.id}`, JSON.stringify({ ...r, kumiten: newName }));
      }
      const next = kumitenList.map((k, i) => (i === index ? newName : k));
      await saveKumitenList(next);
      // あとで元に戻せるよう、変更履歴を残しておく
      const logId = `${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
      await storage.set(`kumitenRenameLog:${logId}`, JSON.stringify({
        id: logId, oldName, newName,
        schedIds: affectedSched.map((r) => r.id),
        mgmtIds: affectedMgmt.map((r) => r.id),
        at: new Date().toISOString(),
      }), true);
      showToast(`「${oldName}」を「${newName}」に変更しました（${affected.length}件更新）`);
    } catch (e) {
      console.error(e);
      showToast('変更に失敗しました');
    }
    await load();
  }

  async function undoRename(entry) {
    if (!window.confirm(`「${entry.newName}」を「${entry.oldName}」に戻します。よろしいですか？`)) return;
    setLoading(true);
    try {
      if (kumitenList.includes(entry.newName)) {
        const next = kumitenList.map((k) => (k === entry.newName ? entry.oldName : k));
        await saveKumitenList(next);
      }
      for (const id of entry.schedIds || []) {
        const r = await storage.get(`sched:${id}`, true);
        if (r && r.value) {
          const rec = JSON.parse(r.value);
          if (rec.kumiten === entry.newName) await storage.set(`sched:${id}`, JSON.stringify({ ...rec, kumiten: entry.oldName }), true);
        }
      }
      for (const id of entry.mgmtIds || []) {
        const r = await storage.get(`mgmt:${id}`, true);
        if (r && r.value) {
          const rec = JSON.parse(r.value);
          if (rec.kumiten === entry.newName) await storage.set(`mgmt:${id}`, JSON.stringify({ ...rec, kumiten: entry.oldName }), true);
        }
      }
      await storage.delete(`kumitenRenameLog:${entry.id}`, true);
      showToast(`「${entry.oldName}」に戻しました`);
      setRenameHistory((prev) => prev.filter((h) => h.id !== entry.id));
    } catch (e) {
      console.error(e);
      showToast('元に戻すのに失敗しました');
    }
    await load();
  }

  const activeList = tab === 'sched' ? schedRecords : mgmtRecords;
  const statusList = SCHED_STATUSES;
  const collectedNames = new Set(mgmtRecords.map((r) => r.name));

  let filtered = activeList.filter((r) => {
    if (kumitenFilter !== '全て' && r.kumiten !== kumitenFilter) return false;
    if (dateFrom && r.date < dateFrom) return false;
    if (dateTo && r.date > dateTo) return false;
    if (search && !r.name.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });
  if (tab === 'sched' && showUncollectedOnly) filtered = filtered.filter((r) => !collectedNames.has(r.name));

  // ---- dispatch derived data ----
  const daySitesBase = schedRecords.filter((r) => r.date === dispatchDate);
  const extraSites = schedRecords.filter((r) => extraSiteIds.includes(r.id) && r.date !== dispatchDate);
  const daySites = [...daySitesBase, ...extraSites];
  const byArea = {};
  daySites.forEach((s) => {
    const area = s.area || extractArea(s.address) || '未分類';
    if (!byArea[area]) byArea[area] = [];
    byArea[area].push(s);
  });
  const unassignedCount = daySites.filter((s) => !assignments[s.id]).length;
  const truckOptions = buildTruckOptions(regularTruckCount, includeKei, dumpOnlyCount);

  // ---- invoice derived data ----
  const invoiceRecords = mgmtRecords.filter((r) => r.kumiten === invoiceKumiten && r.date && r.date.startsWith(invoiceMonth) && (r.status === '追加' || r.status === '単発'));
  const invoiceBySite = {};
  invoiceRecords.forEach((r) => {
    if (!invoiceBySite[r.name]) invoiceBySite[r.name] = { name: r.name, items: [] };
    (r.lineItems || []).forEach((it) => {
      const q = parseFloat(it.qty); const p = parseFloat(it.unitPrice);
      const amount = (isNaN(q) || isNaN(p)) ? 0 : q * p;
      invoiceBySite[r.name].items.push({ ...it, amount, date: r.date });
    });
  });
  const invoiceRows = Object.values(invoiceBySite)
    .filter((s) => s.items.length > 0)
    .sort((a, b) => a.name.localeCompare(b.name, 'ja'));
  const invoiceGrandTotal = invoiceRows.reduce((sum, site) => sum + site.items.reduce((s, it) => s + it.amount, 0), 0);

  // ---- 工務店・現場・日付ごとの集計（期間自由指定） ----
  const summaryRecords = mgmtRecords.filter((r) => {
    if (summaryKumitenFilter !== '全て' && r.kumiten !== summaryKumitenFilter) return false;
    if (summaryFrom && r.date < summaryFrom) return false;
    if (summaryTo && r.date > summaryTo) return false;
    return true;
  });

  function recordAmount(r) {
    return (r.lineItems || []).reduce((s, it) => {
      const q = parseFloat(it.qty); const p = parseFloat(it.unitPrice);
      return s + (isNaN(q) || isNaN(p) ? 0 : q * p);
    }, 0);
  }

  const summaryTree = {}; // { kumiten: { siteName: [{date, amount, status}] } }
  summaryRecords.forEach((r) => {
    if (!summaryTree[r.kumiten]) summaryTree[r.kumiten] = {};
    if (!summaryTree[r.kumiten][r.name]) summaryTree[r.kumiten][r.name] = [];
    summaryTree[r.kumiten][r.name].push({ date: r.date, amount: recordAmount(r), status: r.status });
  });

  function buildSummaryTSV() {
    const header = '工務店\t現場名\t日付\tタグ\t金額';
    const rows = [];
    Object.keys(summaryTree).sort().forEach((kumiten) => {
      Object.keys(summaryTree[kumiten]).sort((a, b) => a.localeCompare(b, 'ja')).forEach((site) => {
        summaryTree[kumiten][site].forEach((v) => {
          rows.push(`${kumiten}\t${site}\t${v.date}\t${v.status}\t${Math.round(v.amount)}`);
        });
      });
    });
    const grandTotal = summaryRecords.reduce((s, r) => s + recordAmount(r), 0);
    rows.push(`合計\t\t\t${summaryRecords.length}件\t${Math.round(grandTotal)}`);
    return [header, ...rows].join('\n');
  }

  function buildInvoiceTSV() {
    const header = '現場名\t名称\t数量\t単位\t単価\t金額\t備考（日付）';
    const blocks = invoiceRows.map((site) => {
      const rows = site.items.map((it) => `${site.name}\t${it.name}\t${it.qty}\t${it.unit}\t${it.unitPrice}\t${Math.round(it.amount)}\t${it.date}`);
      const subtotal = site.items.reduce((s, it) => s + it.amount, 0);
      rows.push(`${site.name}\t小計\t\t\t\t${Math.round(subtotal)}\t`);
      return rows.join('\n');
    });
    return [header, ...blocks, `合計\t\t\t\t\t${Math.round(invoiceGrandTotal)}\t`].join('\n');
  }

          <div style={styles.mapSheet} onClick={(e) => e.stopPropagation()}>
            <div style={styles.sheetHeader}>
              <div style={styles.sheetTitle}>{dispatchDate} の現場マップ</div>
              <button style={styles.closeBtn} onClick={() => setShowDispatchMap(false)}>✕</button>
            </div>

            {mapStatus === 'error' && (
              <div style={styles.empty}>
                地図を表示できませんでした。GOOGLE_MAPS_API_KEYが設定されているか確認してください。
              </div>
            )}
            {mapStatus === 'loading' && <div style={styles.empty}>地図を読み込み中…（住所が多いと少し時間がかかります）</div>}

            <div ref={mapDivRef} style={{ ...styles.mapCanvas, display: mapStatus === 'ready' || mapStatus === 'loading' ? 'block' : 'none' }} />

            {mapStatus === 'ready' && (
              <div style={styles.mapLegend}>
                {buildTruckOptions(regularTruckCount, includeKei, dumpOnlyCount).map((o, i) => (
                  <span key={o.id} style={styles.mapLegendItem}>
                    <span style={{ ...styles.truckDot, background: TRUCK_COLORS[i % TRUCK_COLORS.length] }} />
                    {o.label}
                  </span>
                ))}
                <span style={styles.mapLegendItem}>
                  <span style={{ ...styles.truckDot, background: '#9A9A94' }} />
                  未割当
                </span>
              </div>
            )}
          </div>
        </div>
      )}

      {showTrash && (
        <div style={styles.overlay} onClick={() => setShowTrash(false)}>
          <div style={styles.sheet} onClick={(e) => e.stopPropagation()}>
            <div style={styles.sheetHeader}>
              <div style={styles.sheetTitle}>ゴミ箱（削除から30日間残ります）</div>
              <button style={styles.closeBtn} onClick={() => setShowTrash(false)}>✕</button>
            </div>
            {trashItems.length > 0 && (
              <div style={{ display: 'flex', gap: 6, alignItems: 'center', margin: '8px 0', flexWrap: 'wrap' }}>
                <button style={styles.linkBtnSmall} onClick={toggleTrashSelectAll}>
                  {trashSelected.length === trashItems.length ? '全解除' : `全選択（${trashItems.length}件）`}
                </button>
                {trashSelected.length > 0 && (
                  <button style={styles.kumitenDeleteBtn} onClick={purgeSelectedTrash}>選択した{trashSelected.length}件を完全削除</button>
                )}
                <button style={{ ...styles.kumitenDeleteBtn, marginLeft: 'auto' }} onClick={purgeAllTrash}>全て完全削除</button>
              </div>
            )}
            <div style={{ marginTop: 4, maxHeight: 420, overflowY: 'auto' }}>
              {trashItems.length === 0 && <div style={{ padding: '20px 4px', color: '#8A8A83', fontSize: 13 }}>ゴミ箱は空です</div>}
              {trashItems.map((item) => (
                <div key={item.id} style={styles.extraPickRow}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <input
                      type="checkbox"
                      checked={trashSelected.includes(item.id)}
                      onChange={() => toggleTrashSelected(item.id)}
                      style={{ width: 18, height: 18 }}
                    />
                    <div>
                      <div style={{ fontSize: 13, fontWeight: 700 }}>{item.name}</div>
                      <div style={{ fontSize: 11.5, color: '#8A8A83' }}>{item.date}／{item._type === 'sched' ? '予定表' : '管理表'}／削除:{(item.deletedAt || '').slice(0, 10)}</div>
                    </div>
                  </div>
                  <div style={{ display: 'flex', gap: 6 }}>
                    <button style={styles.pickTempBtn} onClick={() => restoreFromTrash(item)}>復元</button>
                    <button style={styles.kumitenDeleteBtn} onClick={() => purgeTrash(item)}>完全削除</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {showDuplicateModal && (
        <div style={styles.overlay} onClick={() => setShowDuplicateModal(false)}>
          <div style={styles.sheet} onClick={(e) => e.stopPropagation()}>
            <div style={styles.sheetHeader}>
              <div style={styles.sheetTitle}>重複登録の可能性がある現場</div>
              <button style={styles.closeBtn} onClick={() => setShowDuplicateModal(false)}>✕</button>
            </div>
            <div style={{ marginTop: 4, maxHeight: 420, overflowY: 'auto' }}>
              {findDuplicateGroups().length === 0 && (
                <div style={{ padding: '20px 4px', color: '#8A8A83', fontSize: 13 }}>今は重複はなさそうです</div>
              )}
              {findDuplicateGroups().map((group, gi) => (
                <div key={gi} style={{ marginBottom: 16, paddingBottom: 12, borderBottom: '1px solid #EFEDE6' }}>
                  <div style={{ fontWeight: 700, fontSize: 13.5, marginBottom: 6 }}>{group[0].date}／{group[0].name}（{group.length}件）</div>
                  {group.map((r) => (
                    <div key={r.id} style={styles.extraPickRow}>
                      <div>
                        <div style={{ fontSize: 12.5 }}>{r.kumiten || '工務店未設定'}／担当：{r.staff || '不明'}</div>
                        <div style={{ fontSize: 11.5, color: '#8A8A83' }}>監督：{r.supervisorName || '未入力'}／住所：{r.address || '未入力'}</div>
                      </div>
                      <button style={styles.pickTempBtn} onClick={() => { setShowDuplicateModal(false); openEdit(r); }}>開く</button>
                    </div>
                  ))}
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {showAddExtraSite && (
        <div style={styles.overlay} onClick={() => setShowAddExtraSite(false)}>
          <div style={styles.sheet} onClick={(e) => e.stopPropagation()}>
            <div style={styles.sheetHeader}>
              <div style={styles.sheetTitle}>他の日の現場を今日の配車に追加</div>
              <button style={styles.closeBtn} onClick={() => setShowAddExtraSite(false)}>✕</button>
            </div>
            <input
              style={styles.input}
              placeholder="現場名で検索"
              value={extraSiteSearch}
              onChange={(e) => setExtraSiteSearch(e.target.value)}
            />
            <div style={{ marginTop: 10, maxHeight: 320, overflowY: 'auto' }}>
              {schedRecords
                .filter((r) => r.date !== dispatchDate && !extraSiteIds.includes(r.id))
                .filter((r) => !extraSiteSearch || r.name.toLowerCase().includes(extraSiteSearch.toLowerCase()))
                .slice(0, 30)
                .map((r) => (
                  <div key={r.id} style={styles.extraPickRow}>
                    <div>
                      <div style={{ fontWeight: 700, fontSize: 13.5 }}>{r.name}</div>
                      <div style={{ fontSize: 11.5, color: '#8A8A83' }}>{r.date}／{r.kumiten}</div>
                    </div>
                    <div style={{ display: 'flex', gap: 6 }}>
                      <button style={styles.pickMoveBtn} onClick={() => { moveSiteToDate(r); setShowAddExtraSite(false); }}>📅 日付を移動</button>
                      <button style={styles.pickTempBtn} onClick={() => { addExtraSite(r.id); showToast(`${r.name} を一時追加しました`); }}>＋一時追加</button>
                    </div>
                  </div>
                ))}
            </div>
          </div>
        </div>
      )}

      {showBulkUpdate && (
        <div style={styles.overlay} onClick={() => !bulkImportBusy && setShowBulkUpdate(false)}>
          <div style={styles.sheet} onClick={(e) => e.stopPropagation()}>
            <div style={styles.sheetHeader}>
              <div style={styles.sheetTitle}>監督名・ハウスNoを一括更新</div>
              <button style={styles.closeBtn} onClick={() => setShowBulkUpdate(false)}>✕</button>
            </div>
            <div style={styles.exportHint}>
              現場名は既に登録済みのものと完全に一致する必要があります（同じ現場名の予定が複数日あれば、まとめて全部更新されます）。列は「現場名・監督名・監督電話・ハウスNo」の順、タブ区切りで貼り付けてください。
            </div>
            <button style={{ ...styles.linkBtn, marginBottom: 8 }} onClick={copyUpdateTemplate}>見出し行をコピーする</button>
            <textarea
              style={{ ...styles.input, minHeight: 200, fontSize: 12 }}
              value={bulkUpdateText}
              onChange={(e) => setBulkUpdateText(e.target.value)}
              placeholder="ここにExcelからコピーした内容を貼り付け"
            />
            <div style={styles.sheetActions}>
              <button style={styles.saveBtn} onClick={runBulkUpdate} disabled={bulkImportBusy}>
                {bulkImportBusy ? '更新中…' : '更新する'}
              </button>
            </div>
          </div>
        </div>
      )}

      {showBulkImport && (
        <div style={styles.overlay} onClick={() => !bulkImportBusy && setShowBulkImport(false)}>
          <div style={styles.sheet} onClick={(e) => e.stopPropagation()}>
            <div style={styles.sheetHeader}>
              <div style={styles.sheetTitle}>TimeTreeから一括インポート</div>
              <button style={styles.closeBtn} onClick={() => setShowBulkImport(false)}>✕</button>
            </div>
            <div style={styles.exportHint}>
              Excel/スプレッドシートで列を「現場名・工務店・住所・日付・時間・ステータス・監督名・監督電話・ガラ必須・想定回数・担当者・注意事項」の順に用意し、その範囲をコピーしてここに貼り付けてください（タブ区切り）。1行1件です。
            </div>
            <button style={{ ...styles.linkBtn, marginBottom: 8 }} onClick={copyImportTemplate}>見出し行をコピーする（Excelの1行目に貼り付け用）</button>
            <textarea
              style={{ ...styles.input, minHeight: 200, fontSize: 12 }}
              value={bulkImportText}
              onChange={(e) => setBulkImportText(e.target.value)}
              placeholder="ここにExcelからコピーした内容を貼り付け"
            />
            <div style={styles.sheetActions}>
              <button style={styles.saveBtn} onClick={runBulkImport} disabled={bulkImportBusy}>
                {bulkImportBusy ? '取り込み中…' : '取り込む'}
              </button>
            </div>
          </div>
        </div>
      )}

      {showBulkDelete && (
        <div style={styles.overlay} onClick={() => setShowBulkDelete(false)}>
          <div style={styles.sheet} onClick={(e) => e.stopPropagation()}>
            <div style={styles.sheetHeader}>
              <div style={styles.sheetTitle}>期間を指定して一括削除（{tab === 'sched' ? '現場予定表' : '現場管理表'}）</div>
              <button style={styles.closeBtn} onClick={() => setShowBulkDelete(false)}>✕</button>
            </div>
            <label style={styles.label}>開始日</label>
            <input type="date" style={styles.input} value={bulkFrom} onChange={(e) => setBulkFrom(e.target.value)} />
            <label style={styles.label}>終了日</label>
            <input type="date" style={styles.input} value={bulkTo} onChange={(e) => setBulkTo(e.target.value)} />
            <div style={styles.sheetActions}><button style={styles.deleteBtn} onClick={bulkDelete}>この期間を削除</button></div>
          </div>
        </div>
      )}

      {showExport && (
        <div style={styles.overlay} onClick={() => setShowExport(false)}>
          <div style={styles.sheet} onClick={(e) => e.stopPropagation()}>
            <div style={styles.sheetHeader}>
              <div style={styles.sheetTitle}>マニフェスト用テキスト</div>
              <button style={styles.closeBtn} onClick={() => setShowExport(false)}>✕</button>
            </div>
            <div style={styles.exportHint}>上の検索・日付・工務店の絞り込みが反映されています。コピーしてマニフェストのプロジェクトチャットに貼り付けてください。</div>
            <textarea style={{ ...styles.input, minHeight: 220, fontSize: 13 }} value={exportText} readOnly />
            <div style={styles.sheetActions}><button style={styles.saveBtn} onClick={copyExport}>コピーする</button></div>
          </div>
        </div>
      )}

      {toast && <div style={styles.toast}>{toast}</div>}
      <div style={styles.footerNote}>※このデータはチームで共有されています</div>
    </div>
  );
}
