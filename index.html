            window.location.href = window.location.pathname + '?v=' + Date.now();

function SiteNameAutocomplete({ value, onChange, onSelect, onBlurExtra, options, placeholder, style }) {
  const [open, setOpen] = useState(false);
  const norm = (s) => (s || '').replace(/[〇○]/g, '○').toLowerCase();
  const query = norm(value);
  const matches = query
    ? (options || []).filter((o) => norm(o).includes(query)).slice(0, 30)
    : [];
  return (
    <div style={{ position: 'relative' }}>
      <input
        style={style}
        value={value}
        placeholder={placeholder}
        onChange={(e) => { onChange(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)}
        onBlur={(e) => {
          const evt = e;
          setTimeout(() => setOpen(false), 150);
          if (onBlurExtra) onBlurExtra(evt);
        }}
      />
      {open && matches.length > 0 && (
        <div style={styles.siteSuggestBox}>
          {matches.map((m) => (
            <div
              key={m}
              style={styles.siteSuggestItem}
              onMouseDown={() => { onChange(m); if (onSelect) onSelect(m); setOpen(false); }}
            >
              {m}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

const DEVICE_STAFF_KEY = 'genbaTracker_staffName';
function normalizeSiteName(s) {
  if (!s) return '';
  let str = String(s);
  // 全角英数字 → 半角
  str = str.replace(/[Ａ-Ｚａ-ｚ０-９]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
  // 丸数字 → 数字
  const circled = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
  str = str.replace(/[①-⑳]/g, (ch) => String(circled.indexOf(ch) + 1));
  // 全角スペース・半角スペースを除去
  str = str.replace(/[\s　]/g, '');
  // ○（丸記号）の表記ゆれを統一（〇=漢数字のゼロ と ○=図形の丸、どちらで入力されても同じ扱いに）
  str = str.replace(/[〇○]/g, '○');
  return str;
}

async function sendToServer(body) {
  const res = await fetch(API_URL, {
    method: 'POST',

// 書き込み（set/delete）が起きた直後は、サーバー側（スプレッドシート）への反映に少し時間がかかることがある。
// その間に画面の自動更新（load()）が走ると、まだ古いままのサーバーデータで上書きしてしまい、
// 「保存したはずなのに消えている／戻っている」ように見える。書き込みの入口はここに集約されているので、
// ここで最終書き込み時刻を記録しておき、個別の保存処理（saveRecordなど）で書き忘れても
// 自動更新側で必ずガードできるようにする。
let lastWriteAt = 0;
async function reliableSend(body) {
  lastWriteAt = Date.now();
  const id = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
  const item = { id, body, createdAt: Date.now() };
  const q = getQueue();
  q.push(item);
  saveQueueToDisk(q);
  notifyPendingChange();
  try {
    const result = await sendToServer(body);
    // サーバー側が明示的に失敗（{ok:false}）を返してきた場合（例：他の書き込みと重なって
    // ロックが取れなかった等）も、これまではfetch自体が例外を投げない限り「成功」として
    // 扱ってしまい、削除・保存が実際には反映されていないのに画面上は成功表示になる不具合があった。
    // サーバーの返事の中身も見て、失敗ならキューに残して自動再送信に回す。
    if (result && result.ok === false) {
      scheduleRetry();
      return { ok: false, queued: true };
    }
    removeFromQueue(id);
    return { ok: true, result };
  } catch (e) {
    // 送信に失敗しても端末には残っているので、あとで自動的に再送信されます
    scheduleRetry();
    return { ok: false, queued: true };
  }
}

function removeFromQueue(id) {
  const q = getQueue().filter((i) => i.id !== id);
  saveQueueToDisk(q);
  notifyPendingChange();
}

let retryTimer = null;
function scheduleRetry() {
  if (retryTimer) return;
  retryTimer = setTimeout(async () => {
    retryTimer = null;
    await retryQueue();
  }, 8000);
}

async function retryQueue() {
  const q = getQueue();
  for (const item of q) {
    try {
      const result = await sendToServer(item.body);
      if (result && result.ok === false) { scheduleRetry(); continue; } // サーバーがまだ失敗を返す場合は残して次回に回す
      removeFromQueue(item.id);
    } catch (e) {
      scheduleRetry();
    }
  }
}

async function attachPhotoToRecord(recordId, staff, url, recordPrefix) {
  const prefix = recordPrefix || 'mgmt';
  const r = await fetch(`${API_URL}?action=get&key=${encodeURIComponent(prefix + ':' + recordId)}`);
  const data = await r.json();
  if (!data.found) return false;
  const record = JSON.parse(data.value);
  const photos = [...(record.photos || []), { staff: staff || '担当者', img: url, at: Date.now() }];
  const updated = { ...record, photos };
  await sendToServer({ action: 'set', key: `${prefix}:${recordId}`, value: JSON.stringify(updated) });
  return true;
}

      removeFromPhotoQueue(item.id);
    } catch (e) {

  }
}

// 同時アクセスしすぎてサーバー側が詰まらないよう、少しずつ順番に処理する（取得にも後片付けにも使う汎用版）
async function runWithLimit(items, limit, fn) {
  let i = 0;
  async function worker() {
    while (i < items.length) {
      const idx = i++;
      try { await fn(items[idx], idx); } catch (e) { /* ここでのエラーは無視して次へ */ }
    }
  }
  const workers = [];
  for (let w = 0; w < Math.min(limit, items.length); w++) workers.push(worker());
  await Promise.all(workers);
}

async function fetchWithLimit(keys, limit) {
  const results = [];
  await runWithLimit(keys, limit, async (k, idx) => {
    const r = await storage.get(k, true);
    results[idx] = r && r.value ? JSON.parse(r.value) : null;
  });
  return results.filter(Boolean);
}

const storage = {
  async get(key) {
    const res = await fetch(`${API_URL}?action=get&key=${encodeURIComponent(key)}`);
    const data = await res.json();
    if (!data.found) throw new Error('not found: ' + key);
    return { key: data.key, value: data.value };
  },
  async set(key, value) {
    const r = await reliableSend({ action: 'set', key, value });
    return { key, value, queued: !r.ok };
  },
  async delete(key) {
    const r = await reliableSend({ action: 'delete', key });
    return { key, deleted: true, queued: !r.ok };
  },
  async list(prefix) {
    const res = await fetch(`${API_URL}?action=list&prefix=${encodeURIComponent(prefix || '')}`);
    const data = await res.json();
    return { keys: data.keys || [] };
  },
  // list()＋キーごとにget()を1件ずつ呼ぶと、件数が多い時にものすごく遅くなる
  // （スプレッドシート全体を毎回読み直す処理が、件数分だけ繰り返し走ってしまうため）。
  // サーバー側のlistWithValuesは、対象のprefixに一致する分の値を1回のシート読み込みでまとめて返す。
  // 古いバージョンのバックエンド（listWithValues未対応）でも動くよう、失敗したら従来方式に自動で切り替える。
  async listWithValues(prefix) {
    try {
      const res = await fetch(`${API_URL}?action=listWithValues&prefix=${encodeURIComponent(prefix || '')}`);
      const data = await res.json();
      if (!data.items) throw new Error('listWithValues not supported');
      return data.items
        .map((it) => { try { return JSON.parse(it.value); } catch (e) { return null; } })
        .filter(Boolean);
    } catch (e) {
      const listRes = await this.list(prefix);
      return fetchWithLimit(listRes.keys || [], 8);
    }
  },
  // listWithValuesはキーを捨てて中身だけ返すが、geocodeキャッシュはキー（住所）自体が意味を持つデータなので、
  // キー付きのまま欲しい時はこちらを使う（1回のサーバー読み込みで済ませ、現場ごとに問い合わせずに済ませるため）
  async listWithKeys(prefix) {
    try {
      const res = await fetch(`${API_URL}?action=listWithValues&prefix=${encodeURIComponent(prefix || '')}`);
      const data = await res.json();
      if (!data.items) throw new Error('listWithValues not supported');
      return data.items;
    } catch (e) {
      return [];
    }
  },
  async uploadPhoto(dataUrl, filename, recordId, staff, recordPrefix) {
    try {
      return await uploadPhotoDirect(dataUrl, filename);
    } catch (e) {
      const q = getPhotoQueue();
      if (q.length >= MAX_PENDING_PHOTOS) {
        throw new Error('保留中の写真が上限（3枚）に達しています。電波の良い場所でもう一度お試しください');
      }
      const id = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      q.push({ id, dataUrl, filename, recordId, staff, recordPrefix: recordPrefix || 'mgmt', createdAt: Date.now() });
      savePhotoQueueToDisk(q);
      notifyPendingChange();
      schedulePhotoRetry();
      return null; // 呼び出し側は「保留中」として扱う
    }
  },
};

// dayRule（'eom' or 1〜31）から見て、fromDateStr（YYYY-MM-DD）以降で一番近い締め日を計算する
function nextClosingDate(dayRule, fromDateStr) {
  const from = new Date(`${fromDateStr}T00:00:00`);
  const lastDayOfMonth = (y, m) => new Date(y, m + 1, 0).getDate();
  let y = from.getFullYear();
  let m = from.getMonth();
  let day = dayRule === 'eom' ? lastDayOfMonth(y, m) : dayRule;
  let candidate = new Date(y, m, day);
  if (candidate < from) {
    m += 1;
    if (m > 11) { m = 0; y += 1; }
    day = dayRule === 'eom' ? lastDayOfMonth(y, m) : dayRule;
    candidate = new Date(y, m, day);
  }
  const diffDays = Math.round((candidate - from) / 86400000);
  return { dateStr: `${candidate.getFullYear()}-${String(candidate.getMonth() + 1).padStart(2, '0')}-${String(candidate.getDate()).padStart(2, '0')}`, diffDays };
}

function statusColor(list, key) {
  const found = list.find((s) => s.key === key);
  return found ? found.color : '#999';
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

// 老眼などでピンチズームを使う人のために拡大自体はできるようにしつつ、
// 誤って拡大・変な位置までスクロールしてしまった時に、ワンタップで拡大率と位置を元に戻せるようにする。
// viewport指定を一瞬だけ「拡大禁止」に切り替えると、スマホのブラウザが拡大率を1.0にリセットしてくれる
// （その後すぐ元の「拡大できる」設定に戻すので、次にまた自由に拡大できる）。
function resetZoomAndScroll() {
  try { window.scrollTo(0, 0); } catch (e) {}
  try {
    const meta = document.getElementById('viewportMeta');
    if (meta) {
      const original = meta.getAttribute('content');
      meta.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
      setTimeout(() => { meta.setAttribute('content', original); }, 100);
    }
  } catch (e) {}
}

// TODO/伝達の記入日時・確認日時を「9/17 14:20」のように短く表示する
function formatDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return (iso || '').slice(0, 10);
  const mm = d.getMonth() + 1;
  const dd = d.getDate();
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `${mm}/${dd} ${hh}:${mi}`;
}

// 現場名の「表記ゆれ」（全角/半角、スペースの有無など）を無視して比べるための正規化。
// これはあくまで「候補として見比べる」ためだけに使い、自動で一致とはみなさない
// （あいまい一致で違う現場を混同した過去の反省から、最終判断は必ず人の目で行う）
function normalizeForCompare(str) {
  return (str || '')
    .normalize('NFKC')
    .replace(/[\s　]/g, '')
    .toLowerCase();
}

// 伝達の「見た」記録は新形式 {name, at} だが、古いデータ（名前の文字列のみ）にも両対応させる
function seenName(entry) {
  return typeof entry === 'string' ? entry : ((entry && entry.name) || '');
}
function seenAt(entry) {
  return typeof entry === 'string' ? '' : ((entry && entry.at) || '');
}
function seenIncludes(list, name) {
  return (list || []).some((e) => seenName(e) === name);
}

function circledNumber(n) {

  if (n >= 1 && n <= 20) return circled[n - 1];

}

function normalizeDateStr(input) {
  if (!input) return todayStr();
  const s = input.trim();
  // すでに YYYY-MM-DD 形式ならそのまま
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  // 2026/10/3 や 2026/10/03 のようなスラッシュ区切りに対応
  const m = s.match(/^(\d{4})[\/年](\d{1,2})[\/月](\d{1,2})/);
  if (m) {
    const y = m[1];
    const mo = m[2].padStart(2, '0');
    const d = m[3].padStart(2, '0');
    return `${y}-${mo}-${d}`;
  }
  return s; // それでも分からなければそのまま返す
}

function addDays(dateStr, days) {

// 画像の読み込み・変換に失敗した時に何も起きないまま固まってしまうと、写真が1枚も
// 上がらないのに原因が分からなくなるため、必ずresolveかrejectのどちらかで終わるようにする
// （reader/imgのエラー時にreject、念のためのタイムアウトも用意）。
function compressImage(file, maxSize = 640, quality = 0.55) {
  return new Promise((resolve, reject) => {
    let settled = false;
    const timer = setTimeout(() => {
      if (settled) return;
      settled = true;
      reject(new Error('画像の処理がタイムアウトしました。もう一度お試しください'));
    }, 20000);
    const finish = (fn, val) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      fn(val);
    };
    const reader = new FileReader();
    reader.onerror = () => finish(reject, new Error('画像の読み込みに失敗しました'));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => finish(reject, new Error('画像を開けませんでした（対応していない形式の可能性があります）'));
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxSize) {
          height = Math.round((height * maxSize) / width);
          width = maxSize;
        } else if (height > maxSize) {
          width = Math.round((width * maxSize) / height);
          height = maxSize;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        finish(resolve, canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function extractArea(address) {
  if (!address) return '未分類';
  let s = address.trim();
  // 都道府県を取り除く
  s = s.replace(/^.*?(都|道|府|県)/, '');
  // 郵便番号などを取り除く
  s = s.replace(/^〒?\d{3}-?\d{4}\s*/, '');
  // 市 + 区 のパターン（例：横浜市神奈川区）
  let m = s.match(/^([^\s0-9０-９]+?市)([^\s0-9０-９]+?区)/);
  if (m) return m[1] + m[2];
  // 市のみ（例：大和市）
  m = s.match(/^([^\s0-9０-９]+?市)/);
  if (m) return m[1];
  // 郡 + 町村
  m = s.match(/^([^\s0-9０-９]+?郡[^\s0-9０-９]+?[町村])/);
  if (m) return m[1];
  // 区のみ（東京23区想定）
  m = s.match(/^([^\s0-9０-９]+?区)/);
  if (m) return m[1];
  return '未分類';
}

function loadGoogleMapsScript() {

}

async function geocodeAddress(address) {
  if (!address) return null;
  try {
    const cached = await storage.get(`geocode:${address}`);
    if (cached && cached.value) return JSON.parse(cached.value);
  } catch (e) { /* キャッシュなし、続けて取得 */ }
  return new Promise((resolve) => {
    const geocoder = new window.google.maps.Geocoder();
    geocoder.geocode({ address }, async (results, status) => {
      if (status === 'OK' && results[0]) {
        const loc = results[0].geometry.location;
        const latLng = { lat: loc.lat(), lng: loc.lng() };
        try { await storage.set(`geocode:${address}`, JSON.stringify(latLng)); } catch (e) {}
        resolve(latLng);
      } else {
        resolve(null);
      }
    });
  });
}

// 地図表示用：住所末尾の「2棟」「①」などの表記を取り除き、位置特定の精度を上げる
function geocodeQuery(address) {
  if (!address) return address;
  return address
    .replace(/\s*[0-9０-９]*\s*(号棟|棟|号地|号室)\s*$/g, '')
    .replace(/[①-⑳]\s*$/g, '')
    .trim();
}

// 2地点間の直線距離（km）。配車の自動割り振りで、同じ地域グループの中でも
// 実際に近い現場同士をまとめて並べるために使う。
function haversineKm(a, b) {
  if (!a || !b) return Infinity;
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const lat1 = a.lat * Math.PI / 180;
  const lat2 = b.lat * Math.PI / 180;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}

function coordFromAddressStr(address) {
  const [latStr, lngStr] = (address || '').split(/[,、]/);
  const lat = parseFloat(latStr), lng = parseFloat(lngStr);
  return (isNaN(lat) || isNaN(lng)) ? null : { lat, lng };
}

// グループ内の現場を、実際の距離が近いもの同士がまとまるように並べ替える
// （貪欲法：直前の現場から一番近いものを次々つないでいく。位置が分からない現場は末尾にそのまま残す）
function sortByProximity(sites, geocodeCache, isCoordOnlyAddress, geocodeQuery) {
  const withLoc = sites.map((s) => {
    if (!s.address) return { site: s, loc: null };
    const loc = isCoordOnlyAddress(s.address) ? coordFromAddressStr(s.address) : geocodeCache[geocodeQuery(s.address)];
    return { site: s, loc: loc || null };
  });
  const located = withLoc.filter((x) => x.loc);
  const unlocated = withLoc.filter((x) => !x.loc).map((x) => x.site);
  if (located.length <= 1) return [...located.map((x) => x.site), ...unlocated];
  const remaining = located.slice();
  const ordered = [remaining.shift()];
  while (remaining.length > 0) {
    const last = ordered[ordered.length - 1];
    let bestIdx = 0, bestDist = Infinity;
    remaining.forEach((r, i) => {
      const d = haversineKm(last.loc, r.loc);
      if (d < bestDist) { bestDist = d; bestIdx = i; }
    });
    ordered.push(remaining.splice(bestIdx, 1)[0]);
  }
  return [...ordered.map((x) => x.site), ...unlocated];
}

function markerIcon(color) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"><circle cx="14" cy="14" r="10" fill="${color}" stroke="#fff" stroke-width="3"/></svg>`;
  return { url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg), scaledSize: new window.google.maps.Size(28, 28) };
}

function daysInMonth(year, month) { return new Date(year, month + 1, 0).getDate(); }
function firstWeekday(year, month) { return new Date(year, month, 1).getDay(); }
function isSaturday(dateStr) { return new Date(dateStr + 'T00:00:00').getDay() === 6; }

// ---------- Month calendar (like TimeTree month view) ----------
function MonthCalendar({ records, monthCursor, setMonthCursor, onPickDate, selectedDate }) {
  const [year, month] = monthCursor.split('-').map(Number);
  const total = daysInMonth(year, month - 1);
  const startWeekday = firstWeekday(year, month - 1);

  // 日付ごとに、その日に含まれるステータスの種類と件数を集計
  const infoByDate = {};
  records.forEach((r) => {
    if (!infoByDate[r.date]) infoByDate[r.date] = { count: 0, statuses: [] };
    infoByDate[r.date].count++;
    if (!infoByDate[r.date].statuses.includes(r.status)) infoByDate[r.date].statuses.push(r.status);
  });

  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= total; d++) {
    const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    cells.push(dateStr);
  }

  function shiftMonth(delta) {
    let m = month + delta, y = year;
    if (m > 12) { m = 1; y += 1; }
    if (m < 1) { m = 12; y -= 1; }
    setMonthCursor(`${y}-${String(m).padStart(2, '0')}`);
  }

  const MAX_DOTS = 4;

  return (
    <div style={styles.calBox}>
      <div style={styles.calHeader}>
        <button style={styles.calNavBtn} onClick={() => shiftMonth(-1)}>‹</button>
        <div style={styles.calTitle}>{year}年{month}月</div>
        <button style={styles.calNavBtn} onClick={() => shiftMonth(1)}>›</button>
      </div>
      <div style={styles.calWeekRow}>
        {['日', '月', '火', '水', '木', '金', '土'].map((w) => (
          <div key={w} style={styles.calWeekLabel}>{w}</div>
        ))}
      </div>
      <div style={styles.calGrid}>
        {cells.map((dateStr, i) => {
          if (!dateStr) return <div key={i} style={styles.calCellEmpty} />;
          const info = infoByDate[dateStr];
          const day = Number(dateStr.slice(-2));
          const sat = isSaturday(dateStr);
          const dots = info ? info.statuses.slice(0, MAX_DOTS) : [];
          const extra = info ? Math.max(0, info.statuses.length - MAX_DOTS) : 0;
          const isSelected = dateStr === selectedDate;
          return (
            <div
              key={i}
              onClick={() => onPickDate(dateStr)}
              style={{
                ...styles.calCell,
                ...(sat ? { color: '#457B9D' } : {}),
              }}
            >
              {isSelected && <div style={styles.calSelectedBar} />}
              <span style={styles.calDayNum}>{day}</span>
              {info && (
                <>
                  <div style={styles.calDotRow}>
                    {dots.map((s) => (
                      <span key={s} style={{ ...styles.calDot, background: statusColor(SCHED_STATUSES, s) }} />
                    ))}
                    {extra > 0 && <span style={styles.calDotMore}>+{extra}</span>}
                  </div>
                  <span style={styles.calCount}>{info.count}件</span>
                </>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---------- Gantt-style progress chart (新規〜最終) ----------
function dateToDay(dateStr) {
  return Math.floor(new Date(dateStr + 'T00:00:00').getTime() / 86400000);
}
function dayToDate(day) {
  return new Date(day * 86400000).toISOString().slice(0, 10);
}

function GanttChart({ schedRecords, kumitenFilter, windowStart, windowEnd, onShift, onPickKumiten, kumitenList, onOpenRecord }) {
  const todayDay = dateToDay(todayStr());
  const startDay = dateToDay(windowStart);
  const endDay = dateToDay(windowEnd);
  const totalDays = Math.max(1, endDay - startDay);
  const [expandedSite, setExpandedSite] = useState(null);

  const bySite = {};
  schedRecords.forEach((r) => {
    if (kumitenFilter !== '全て' && r.kumiten !== kumitenFilter) return;
    if (!bySite[r.name]) bySite[r.name] = { name: r.name, kumiten: r.kumiten, dates: [], records: [], hasFinal: false, finalDay: null, hasSingle: false };
    const d = dateToDay(r.date);
    bySite[r.name].dates.push(d);
    bySite[r.name].records.push(r);
    if (r.status === '最終') {
      bySite[r.name].hasFinal = true;
      bySite[r.name].finalDay = bySite[r.name].finalDay === null ? d : Math.max(bySite[r.name].finalDay, d);
    }
    if (r.status === '単発') {
      bySite[r.name].hasSingle = true;
    }
  });

  const rows = Object.values(bySite).map((s) => {
    const minDay = Math.min(...s.dates);
    const maxDay = Math.max(...s.dates);
    const isDone = s.hasFinal || s.hasSingle; // 最終が付いた、または単発の仕事は「完了扱い」にする
    const barEndDay = s.hasFinal ? s.finalDay : (s.hasSingle ? maxDay : Math.max(maxDay, todayDay));
    return { ...s, startDay: minDay, endDay: barEndDay, ongoing: !isDone, isDone };
  })
    .filter((s) => !(s.isDone && todayDay - s.endDay > 14)) // 完了（最終／単発）から2週間経過したら工程表から非表示（データ自体は消えません）
    .filter((s) => s.endDay >= startDay && s.startDay <= endDay)
    .sort((a, b) => a.startDay - b.startDay);

  // 月の目盛り
  const monthTicks = [];
  let cursor = new Date(windowStart + 'T00:00:00');
  cursor.setDate(1);
  while (dateToDay(cursor.toISOString().slice(0, 10)) <= endDay) {
    const d = dateToDay(cursor.toISOString().slice(0, 10));
    if (d >= startDay) monthTicks.push({ day: d, label: `${cursor.getMonth() + 1}月` });
    cursor.setMonth(cursor.getMonth() + 1);
  }

  const overlappingToday = rows.filter((r) => r.startDay <= todayDay && r.endDay >= todayDay).length;

  return (
    <div>
      <div style={styles.searchBox}>
        <div style={styles.chipRow}>
          {['全て', ...kumitenList].map((k) => (
            <button key={k} onClick={() => onPickKumiten(k)} style={{ ...styles.chip, ...(kumitenFilter === k ? styles.chipActive : {}) }}>{k}</button>
          ))}
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 10 }}>
          <button style={styles.calNavBtn} onClick={() => onShift(-1)}>‹ 前月</button>
          <span style={{ fontSize: 12.5, color: '#5A5A54' }}>{windowStart} 〜 {windowEnd}</span>
          <button style={styles.calNavBtn} onClick={() => onShift(1)}>次月 ›</button>
        </div>
      </div>

      <div style={styles.dispatchSummary}>
        <span>表示中 {rows.length}件</span>
        <span style={{ fontWeight: 700, color: '#E63946' }}>本日時点で重なり {overlappingToday}件</span>
      </div>

      <div style={styles.ganttBox}>
        <div style={styles.ganttAxis}>
          {monthTicks.map((t, i) => (
            <div key={i} style={{ ...styles.ganttTick, left: `${((t.day - startDay) / totalDays) * 100}%` }}>{t.label}</div>
          ))}
          <div style={{ ...styles.ganttTodayLine, left: `${((todayDay - startDay) / totalDays) * 100}%` }} />
        </div>

        {rows.length === 0 && <div style={styles.empty}>この期間・工務店に該当する現場がありません。</div>}

        {rows.map((r) => {
          const left = Math.max(0, ((r.startDay - startDay) / totalDays) * 100);
          const right = Math.min(100, ((r.endDay - startDay) / totalDays) * 100);
          const width = Math.max(1.5, right - left);
          const isExpanded = expandedSite === r.name;
          const sortedRecords = [...r.records].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
          const latest = sortedRecords[sortedRecords.length - 1];
          return (
            <React.Fragment key={r.name}>
              <div
                style={{ ...styles.ganttRow, ...styles.ganttRowClickable, ...(isExpanded ? styles.ganttRowActive : {}) }}
                onClick={() => setExpandedSite((cur) => (cur === r.name ? null : r.name))}
              >
                <div style={styles.ganttLabel}>{r.name}</div>
                <div style={styles.ganttTrack}>
                  <div
                    style={{
                      ...styles.ganttBar,
                      left: `${left}%`,
                      width: `${width}%`,
                      background: r.ongoing ? '#2A9D8F' : (r.hasSingle && !r.hasFinal ? '#FFB703' : '#9A9A94'),
                    }}
                    title={`${dayToDate(r.startDay)} 〜 ${dayToDate(r.endDay)}${r.ongoing ? '（進行中）' : (r.hasSingle && !r.hasFinal ? '（単発）' : '（最終済み）')}`}
                  />
                </div>
                <div style={styles.ganttExpandHint}>{isExpanded ? '▲' : '▼'}</div>
              </div>
              {isExpanded && (
                <div style={styles.ganttDetailBox}>
                  <div style={styles.ganttDetailHeader}>
                    <span>{r.kumiten}・{r.name}</span>
                    {(latest.supervisorName || latest.houseNumber) && (
                      <span style={styles.ganttDetailSub}>
                        {latest.supervisorName && `監督：${latest.supervisorName}`}
                        {latest.supervisorName && latest.houseNumber && '／'}
                        {latest.houseNumber && `ハウスNo：${latest.houseNumber}`}
                      </span>
                    )}
                  </div>
                  {sortedRecords.map((rec) => (
                    <div
                      key={rec.id}
                      style={styles.ganttDetailRow}
                      onClick={(e) => { e.stopPropagation(); onOpenRecord && onOpenRecord(rec); }}
                    >
                      <span style={styles.ganttDetailDate}>{rec.date}</span>
                      <span style={{ ...styles.ganttDetailStatus, color: statusColor(SCHED_STATUSES, rec.status) }}>{rec.status || '（未設定）'}</span>
                      <span style={styles.ganttDetailStaff}>{rec.staff || '（担当者未入力）'}</span>
                      {(rec.photos || []).length > 0 && <span style={styles.ganttDetailPhoto}>📷{rec.photos.length}</span>}
                    </div>
                  ))}
                  <button
                    type="button"
                    style={styles.ganttDetailBtn}
                    onClick={(e) => { e.stopPropagation(); onOpenRecord && onOpenRecord(latest); }}
                  >
                    🔍 詳しく見る・編集する
                  </button>
                </div>
              )}
            </React.Fragment>
          );
        })}
      </div>

      <div style={styles.mapLegend}>
        <span style={styles.mapLegendItem}><span style={{ ...styles.truckDot, background: '#2A9D8F' }} />進行中（最終未登録）</span>
        <span style={styles.mapLegendItem}><span style={{ ...styles.truckDot, background: '#9A9A94' }} />最終済み</span>
        <span style={styles.mapLegendItem}><span style={{ ...styles.truckDot, background: '#FFB703' }} />単発</span>
        <span style={styles.mapLegendItem}><span style={{ ...styles.truckDot, background: '#E63946' }} />本日のライン</span>
      </div>
    </div>
  );
}

  const lastAutoRefreshRef = useRef(Date.now());

  const lastLocalWriteRef = useRef(0);

      if (document.visibilityState !== 'visible') return;
      if (showForm) return; // 入力中は割り込まない
      const now = Date.now();
      if (now - lastAutoRefreshRef.current < 15000) return; // 15秒以内の再実行は間引く
      if (now - lastLocalWriteRef.current < SAVE_SETTLE_MS) return; // 保存直後はサーバー反映待ち（この画面での保存）
      if (now - lastWriteAt < SAVE_SETTLE_MS) return; // 保存直後はサーバー反映待ち（書き込み全般の保険）
      lastAutoRefreshRef.current = now;
      load();
      if (tab === 'dispatch') loadDispatch(dispatchDate);
    }
    document.addEventListener('visibilitychange', handleVisible);

  useEffect(() => {
    if (!showDispatchMap) return;
    let cancelled = false;
    async function build() {
      setMapStatus('loading');
      try {
        await loadGoogleMapsScript();
      } catch (e) {
        if (!cancelled) setMapStatus('error');
        return;
      }
      if (cancelled || !mapDivRef.current) return;
      const map = new window.google.maps.Map(mapDivRef.current, {
        center: { lat: 35.4, lng: 139.4 },
        zoom: 11,
      });
      mapInstanceRef.current = map;
      mapMarkersRef.current.forEach((m) => m.setMap(null));
      mapMarkersRef.current = [];

      const bounds = new window.google.maps.LatLngBounds();
      const opts = buildTruckOptions(regularTruckCount, includeKei, dumpOnlyCount);
      // 以前は現場を1件ずつ順番に（サーバーへのキャッシュ確認も含めて）問い合わせていたため、
      // 件数が多い日ほど地図が表示されるまで待たされていた。
      // 先にキャッシュ済みの座標をまとめて1回のサーバー読み込みで取得しておき、
      // キャッシュにない分だけGoogleへの問い合わせを並行して行うことで大幅に短縮する。
      const geocodeCache = {};
      try {
        const raw = await storage.listWithKeys('geocode:');
        raw.forEach((it) => {
          try { geocodeCache[it.key.slice('geocode:'.length)] = JSON.parse(it.value); } catch (e) {}
        });
      } catch (e) { /* 取得に失敗しても現場ごとの問い合わせにフォールバックする */ }
      if (cancelled) return;

      let placed = 0;
      await runWithLimit(daySites.filter((s) => s.address), 5, async (s) => {
        if (cancelled) return;
        let loc = null;
        if (isCoordOnlyAddress(s.address)) {
          // 座標だけが分かっている現場は、Googleに問い合わせず座標をそのまま使う
          const [latStr, lngStr] = s.address.split(/[,、]/);
          loc = { lat: parseFloat(latStr), lng: parseFloat(lngStr) };
        } else {
          const q = geocodeQuery(s.address);
          loc = geocodeCache[q] || await geocodeAddress(q);
        }
        if (cancelled || !loc) return;
        const truckId = assignments[s.id];
        const idx = opts.findIndex((o) => o.id === truckId);
        const color = idx >= 0 ? TRUCK_COLORS[idx % TRUCK_COLORS.length] : '#9A9A94';
        const marker = new window.google.maps.Marker({
          position: loc,
          map,
          icon: markerIcon(color),
          title: `${s.name}${isCoordOnlyAddress(s.address) ? '（座標のみ・住所要確認）' : ''}${truckId ? '（' + (opts.find((o) => o.id === truckId) || {}).label + '）' : '（未割当）'}`,
        });
        mapMarkersRef.current.push(marker);
        bounds.extend(loc);
        placed++;
      });
      if (cancelled) return;
      if (placed > 0) map.fitBounds(bounds);
      setMapStatus('ready');
    }
    build();
    return () => { cancelled = true; };
  }, [showDispatchMap, dispatchDate, assignments, regularTruckCount, includeKei, dumpOnlyCount]);

  async function load() {
    setLoading(true);
    let list = kumitenList;
    try {
      try {
        const km = await storage.get('meta:kumiten', true);
        list = DEFAULT_KUMITEN;
        if (km && km.value) {
          list = JSON.parse(km.value);
          const missing = DEFAULT_KUMITEN.filter((n) => n !== 'その他' && !list.includes(n));
          if (missing.length > 0) {
            const others = list.filter((k) => k !== 'その他');
            list = list.includes('その他') ? [...others, ...missing, 'その他'] : [...list, ...missing];
          }
        }
        await storage.set('meta:kumiten', JSON.stringify(list), true);
        setKumitenList(list);
      } catch (e) { setKumitenList(DEFAULT_KUMITEN); }

      // 監督名簿：保存済みのものに、初期データ（DEFAULT_SUPERVISORS）にしかない分だけ追加でマージする
      try {
        let dir = {};
        try {
          const sv = await storage.get('meta:supervisors', true);
          if (sv && sv.value) dir = JSON.parse(sv.value);
        } catch (e) { dir = {}; }
        let changed = false;
        Object.keys(DEFAULT_SUPERVISORS).forEach((k) => {
          const existing = dir[k] || [];
          const existingNames = new Set(existing.map((s) => s.name));
          const missing = DEFAULT_SUPERVISORS[k].filter((s) => !existingNames.has(s.name));
          if (missing.length > 0) { dir[k] = [...existing, ...missing]; changed = true; }
        });
        // 一度だけの修正：望月さんに高橋さんと同じ電話番号が誤って入っていたため、
        // 正しい番号が届くまでは電話番号を空にしておく（名前は残す）
        if (dir.OHA) {
          const fixNames = ['望月', '高橋'];
          const WRONG_PHONE = '08065408853';
          let fixed = false;
          dir.OHA = dir.OHA.map((s) => {
            if (fixNames.includes(s.name) && s.phone === WRONG_PHONE) { fixed = true; return { ...s, phone: '' }; }
            return s;
          });
          if (fixed) changed = true;
        }
        if (changed || !dir || Object.keys(dir).length === 0) {
          await storage.set('meta:supervisors', JSON.stringify(dir), true);
        }
        setSupervisorDirectory(dir);
      } catch (e) { setSupervisorDirectory(DEFAULT_SUPERVISORS); }

      // 特定済み現場データ：保存済みのものに、初期データ（DEFAULT_IDENTIFIED_SITES）にしかない分だけ追加でマージする
      // （工務店＋現場名の組み合わせで重複判定。既存データは上書きしない）
      try {
        let sites = [];
        try {
          const sv = await storage.get('meta:identifiedSites', true);
          if (sv && sv.value) sites = JSON.parse(sv.value);
        } catch (e) { sites = []; }
        const existingKeys = new Set(sites.map((s) => `${s.kumiten}__${s.siteName}`));
        const missing = DEFAULT_IDENTIFIED_SITES.filter((s) => !existingKeys.has(`${s.kumiten}__${s.siteName}`));
        let changedSites = missing.length > 0;
        if (missing.length > 0) sites = [...sites, ...missing];
        if (changedSites || !sites || sites.length === 0) {
          await storage.set('meta:identifiedSites', JSON.stringify(sites), true);
        }
        setIdentifiedSites(sites);
      } catch (e) { setIdentifiedSites(DEFAULT_IDENTIFIED_SITES); }

      // 退出させたスタッフ名（洋子さん・社長がスタッフ管理画面で設定）
      try {
        const rv = await storage.get('meta:revokedStaff', true);
        setRevokedStaff(rv && rv.value ? JSON.parse(rv.value) : []);
      } catch (e) { setRevokedStaff([]); }

      // 「もうやった」で消した締め日リマインド（"工務店__締め日"の組み合わせ。次の月の締め日になったら自動でまた表示される）
      try {
        const dc = await storage.get('meta:dismissedClosings', true);
        setDismissedClosings(dc && dc.value ? JSON.parse(dc.value) : []);
      } catch (e) { setDismissedClosings([]); }

      async function fetchGroup(prefix) {
        return storage.listWithValues(`${prefix}:`);
      }
      const [sItems, mItems, tItems] = await Promise.all([
        fetchGroup('sched'),
        fetchGroup('mgmt'),
        fetchGroup('todo'),
      ]);
      sItems.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      setSchedRecords(sItems);

      mItems.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      setMgmtRecords(mItems);

      tItems.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
      setTodos(tItems);
      syncAutoTodos(sItems, tItems); // 大量の片付けが必要な場合でも画面が固まらないよう、待たずにバックグラウンドで実行

      setCachedRecords(sItems, mItems, list, tItems);
    } catch (e) { console.error(e); }
    setLoading(false);
    setSyncingFromCache(false);
  }

  const QUICK_TODO_TAGS = ['工程表画像添付', '監督連絡', '社長連絡'];

  async function addTodo(overrides) {
    const text = (overrides && overrides.text) || todoText.trim();
    if (!text) return;
    const record = {
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
      text,
      siteName: (overrides && overrides.siteName) || todoSiteName.trim() || '',
      siteId: (overrides && overrides.siteId) || '',
      date: (overrides && overrides.date) || todoDate || '',
      staff: (overrides && overrides.auto) ? '自動検出' : getDeviceStaff(),
      auto: !!(overrides && overrides.auto),
      checkType: (overrides && overrides.checkType) || '',
      featureKey: (overrides && overrides.featureKey) || '',
      todoType: (overrides && overrides.todoType) || 'task',
      target: (overrides && overrides.target) || '全員',
      important: !!(overrides && overrides.important),
      // 書いた本人は自動で「見た」扱いにしておく（表示はしないが、自分が送った伝達が
      // 自分のバッジ・未読件数に「未読」として出てきてしまわないようにするため）
      seenBy: getDeviceStaff() ? [{ name: getDeviceStaff(), at: new Date().toISOString() }] : [],
      createdAt: new Date().toISOString(),
    };
    await storage.set(`todo:${record.id}`, JSON.stringify(record), true);
    lastLocalWriteRef.current = Date.now();
    setTodos((prev) => [record, ...prev]);
    if (!overrides) { setTodoText(''); setTodoSiteName(''); setTodoDate(''); }
    return record;
  }

  // 重要マークの切り替え（タスク・伝達どちらでも、そのリストの一番上に固定表示される）
  async function toggleImportant(t) {
    const next = { ...t, important: !t.important };
    setTodos((prev) => prev.map((x) => (x.id === t.id ? next : x)));
    lastLocalWriteRef.current = Date.now();
    await storage.set(`todo:${t.id}`, JSON.stringify(next), true);
  }

  // タスク・伝達の本文を、送った後でも書き直せるようにする
  function startEditTodo(t) {
    setEditingTodoId(t.id);
    setEditingTodoText(t.text);
  }
  function cancelEditTodo() {
    setEditingTodoId(null);
    setEditingTodoText('');
  }
  async function saveEditTodo(t) {
    const text = editingTodoText.trim();
    if (!text) { showToast('内容を入力してください'); return; }
    // 自分以外の誰かがすでに「見た」を押していたら、その人はもう一度見に来てくれるとは限らないので日時はそのまま。
    // 逆に、まだ自分しか見ていない（＝相手にまだ届いていない）うちに直した場合は、書き直した今の日時に更新する。
    const me = getDeviceStaff();
    const othersSeen = (t.seenBy || []).some((s) => seenName(s) && seenName(s) !== me);
    const next = othersSeen ? { ...t, text } : { ...t, text, createdAt: new Date().toISOString() };
    setTodos((prev) => prev.map((x) => (x.id === t.id ? next : x)));
    lastLocalWriteRef.current = Date.now();
    await storage.set(`todo:${t.id}`, JSON.stringify(next), true);
    setEditingTodoId(null);
    setEditingTodoText('');

  }

  // 座標だけが入っていて、ちゃんとした住所になっていないものを検出（例：35.331,139.445 など）
  function isCoordOnlyAddress(address) {
    const a = (address || '').trim();
    if (!a) return false;
    return /^-?\d{1,3}\.\d+\s*[,、]\s*-?\d{1,3}\.\d+$/.test(a);
  }

  // 機能の動作確認タスクを追加しつつ、過去にバグで溜まった「現場ごとの不足項目」TODO（自動生成・重複含む）を一括で片付ける。
  // 不足項目チェックは、以後はTODOに保存せず、その場で計算して表示する方式に変更（詳しくはinfoGapSites参照）
  async function syncAutoTodos(sItems, tItems) {
    const legacyGapTodos = tItems.filter((t) => t.auto && t.siteId && t.checkType !== 'feature');
    await runWithLimit(legacyGapTodos, 1, async (t) => { await completeTodo(t.id); });

    // もう確認不要になった動作確認（RETIRED_FEATURE_TEXTS）が残っていれば片付ける
    const retiredTodos = tItems.filter((t) => RETIRED_FEATURE_TEXTS.includes(t.text));
    await runWithLimit(retiredTodos, 1, async (t) => { await completeTodo(t.id); });

    // 完了済み（やった済み）の動作確認は、二度と作り直さない
    let dismissedFeatures = [];
    try {
      const r = await storage.get('meta:dismissedFeatures', true);
      if (r && r.value) dismissedFeatures = JSON.parse(r.value);
    } catch (e) { dismissedFeatures = []; }
    // サーバー保存が電波不良で遅れているケースに備えて、この端末で「やった」にした分もあわせて見る
    dismissedFeatures = Array.from(new Set([...dismissedFeatures, ...getLocalDismissedFeatures()]));

    // 機能の動作確認タスクは、テキストが一致するものをまとめて「1つだけ残して重複は削除」にする
    // （過去にcheckType/featureKeyが保存されずに何度も複製されてしまった分の後片付けも兼ねる）
    const featureTexts = new Set(FEATURE_CHECKLIST.map((f) => f.text));
    const featureLikeTodos = tItems.filter((t) => featureTexts.has(t.text));
    const seenFeatureText = new Set();
    const featureDupes = [];
    featureLikeTodos
      .slice()
      .sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || '')) // 新しい順
      .forEach((t) => {
        if (seenFeatureText.has(t.text)) featureDupes.push(t);
        else seenFeatureText.add(t.text);
      });
    await runWithLimit(featureDupes, 1, async (t) => { await completeTodo(t.id); });

    // まだ一度も追加されておらず、完了済みでもない機能があれば追加する。既存の生き残りがcheckType未設定の古いデータなら補完する
    for (const f of FEATURE_CHECKLIST) {
      if (dismissedFeatures.includes(f.key)) continue;
      if (!seenFeatureText.has(f.text)) {
        await addTodo({ text: f.text, auto: true, checkType: 'feature', featureKey: f.key });
      } else {
        const survivor = featureLikeTodos.find((t) => t.text === f.text && !featureDupes.includes(t));
        if (survivor && survivor.checkType !== 'feature') {
          const updated = { ...survivor, auto: true, checkType: 'feature', featureKey: f.key };
          await storage.set(`todo:${survivor.id}`, JSON.stringify(updated), true);
          setTodos((prev) => prev.map((t) => (t.id === survivor.id ? updated : t)));
        }
      }
    }
  }

  // マニフェストに必要な項目（工務店・監督名・ハウスNo、今日以降の現場のみ）と、住所の抜け（全期間）をその場で計算する。
  // 電話番号はマニフェストに不要なため対象外。保存はしない（重複しようがない）
  // 監督名・ハウスNoは、実際に電子マニフェストを使っている工務店（MANIFEST_KUMITEN）だけ必須にする。
  // それ以外の工務店まで対象にすると件数が膨れて本当に大事な分が埋もれてしまうため
  function infoGapSites() {
    const today = todayStr();
    return schedRecords
      .map((r) => {
        const gaps = [];
        // 座標のみの住所は地図には出せるので、情報不足としては挙げない（洋子さんの指示）。
        // 完全に空欄（地図も出せない）の場合だけ引き続き対象にする
        if (!isCoordOnlyAddress(r.address) && !(r.address || '').trim()) gaps.push('住所');
        if (r.date >= today) {
          if (!(r.kumiten || '').trim()) gaps.push('工務店');
          else if (HOUSE_NUMBER_KUMITEN.includes(r.kumiten)) {
            if (!(r.supervisorName || '').trim()) gaps.push('監督名');
            if (!(r.houseNumber || '').trim()) gaps.push('ハウスNo');
          }
        }
        return { r, gaps };
      })
      .filter((x) => x.gaps.length > 0)
      // 住所が完全に空欄のものを最優先（地図に出せず一番困る）。座標のみは地図は使えるので通常優先度。次に現場の日付が近い順
      .sort((a, b) => {
        const aAddr = a.gaps.includes('住所') ? 0 : 1;
        const bAddr = b.gaps.includes('住所') ? 0 : 1;
        if (aAddr !== bAddr) return aAddr - bAddr;
        return (a.r.date || '').localeCompare(b.r.date || '');
      });
  }

  // 情報不足の現場を工務店ごとにグループ化する（工務店が空の分は「工務店未設定」としてまとめる）
  function infoGapsByKumiten() {
    const groups = {};
    const order = [];
    infoGapSites().forEach((x) => {
      const k = x.r.kumiten || '工務店未設定';
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(x);
    });
    return order.map((k) => ({ kumiten: k, items: groups[k] }));
  }

  // 工程表画像添付を最優先、その次は現場の日付が近い順（日付が無いものは後ろ）
  function sortedTasks() {
    return sortedTodosBase().filter((t) => t.todoType !== 'memo');
  }
  function sortedMemos() {
    return sortedTodosBase().filter((t) => t.todoType === 'memo' && !t.archived);
  }
  // 「📦 アーカイブ」で片付けた伝達（削除はせず、見返せるように残す）
  function archivedMemos() {
    return sortedTodosBase().filter((t) => t.todoType === 'memo' && t.archived)
      .sort((a, b) => (b.archivedAt || '').localeCompare(a.archivedAt || ''));
  }
  // 伝達をアーカイブ／元に戻す。伝達は全員共有の一覧なので、誰かがアーカイブするとみんなの画面からも片付く
  // （消えるわけではなく、「📦 アーカイブ」から後で見返せる）
  async function archiveMemo(t) {
    const me = getDeviceStaff();
    // 宛先のうち、まだ「見た」を押していない人がいたら念のため確認する（うっかり見落としを防ぐため）
    const intendedViewers = (!t.target || t.target === '全員')
      ? TODO_VIEWERS
      : t.target.split(',').map((s) => s.trim());
    const unseenNames = intendedViewers.filter((name) => name && name !== t.staff && !seenIncludes(t.seenBy, name));
    if (unseenNames.length > 0) {
      if (!window.confirm(`${unseenNames.join('・')}さんがまだ「見た」を押していません。それでもアーカイブしますか？（アーカイブすると通常の一覧からは見えなくなります。「📦 アーカイブ」からはいつでも見返せます）`)) return;
    }
    const updated = { ...t, archived: true, archivedAt: new Date().toISOString(), archivedBy: me || '' };
    setTodos((prev) => prev.map((x) => (x.id === t.id ? updated : x)));
    lastLocalWriteRef.current = Date.now();
    await storage.set(`todo:${t.id}`, JSON.stringify(updated), true);
    showToast('アーカイブしました（「📦 アーカイブ」からいつでも見返せます）');
  }
  async function unarchiveMemo(t) {
    const updated = { ...t, archived: false, archivedAt: '', archivedBy: '' };
    setTodos((prev) => prev.map((x) => (x.id === t.id ? updated : x)));
    lastLocalWriteRef.current = Date.now();
    await storage.set(`todo:${t.id}`, JSON.stringify(updated), true);
    showToast('伝達に戻しました');
  }
  // アーカイブの中身を完全に削除する（洋子さんの端末だけに出す。ゴミ箱に30日間残して復元もできるようにする）
  async function deleteArchivedMemo(t) {
    if (!window.confirm('このアーカイブ済みの伝達を削除します。よろしいですか？（ゴミ箱に30日間残ります）')) return;
    lastLocalWriteRef.current = Date.now();
    await storage.set(`trash:${t.id}`, JSON.stringify({ ...t, name: t.text, _type: 'todo', deletedAt: new Date().toISOString() }), true);
    await storage.delete(`todo:${t.id}`, true);
    setTodos((prev) => prev.filter((x) => x.id !== t.id));
    showToast('削除しました（ゴミ箱に30日間残ります）');
  }
  function sortedTodosBase() {
    return [...todos]
      .filter((t) => t.checkType !== 'feature')
      .sort((a, b) => {
        const aImp = a.important ? 0 : 1;
        const bImp = b.important ? 0 : 1;
        if (aImp !== bImp) return aImp - bImp;
        const aGantt = a.text.includes('工程表画像添付') ? 0 : 1;
        const bGantt = b.text.includes('工程表画像添付') ? 0 : 1;
        if (aGantt !== bGantt) return aGantt - bGantt;
        const aDate = a.date || '9999-99-99';
        const bDate = b.date || '9999-99-99';
        if (aDate !== bDate) return aDate.localeCompare(bDate);
        return (b.createdAt || '').localeCompare(a.createdAt || '');
      });
  }

  // 「見た」ボタンを押した人（端末の担当者名）と、見た日時を記録する
  async function markSeenBy(t) {
    const me = getDeviceStaff();
    if (!me) { showToast('先に右上で担当者名を設定してください'); return; }
    if (seenIncludes(t.seenBy, me)) return;
    const updated = { ...t, seenBy: [...(t.seenBy || []), { name: me, at: new Date().toISOString() }] };
    setTodos((prev) => prev.map((x) => (x.id === t.id ? updated : x)));
    lastLocalWriteRef.current = Date.now();
    await storage.set(`todo:${t.id}`, JSON.stringify(updated), true);
  }

  function featureCheckTodos() {
    return todos.filter((t) => t.checkType === 'feature').sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));
  }

  async function completeTodo(id) {
    const target = todos.find((t) => t.id === id);
    setTodos((prev) => prev.filter((t) => t.id !== id));
    lastLocalWriteRef.current = Date.now();
    try { await storage.delete(`todo:${id}`, true); } catch (e) { console.error(e); }
    // 動作確認タスクは、完了したことを覚えておかないと次の読み込みでまた作られてしまうので、完了済みリストに記録する
    if (target && target.checkType === 'feature' && target.featureKey) {
      await markFeatureDismissed(target.featureKey);
    }
  }

  // 「工程表画像添付」タスクの上にある専用の添付ボタンから写真を選んだ時だけ、
  // その現場（予定表）に写真を追加してタスクを自動で「やった」にする。
  // 現場写真（回収スタッフが管理表・予定表から普通に追加するもの）とは別ルートなので、
  // 通常の写真追加ではタスクは完了にならない（誤って完了扱いになる心配がない）
  async function attachGanttPhotoAndComplete(t, files) {
    if (!files || files.length === 0) return;
    const match = (t.siteId && schedRecords.find((r) => r.id === t.siteId))
      || schedRecords.find((r) => r.name === t.siteName && (!t.date || r.date === t.date))
      || schedRecords.find((r) => r.name === t.siteName);
    if (!match) { showToast('現場が見つかりませんでした。予定表から直接添付してください'); return; }
    const staffName = deviceStaff || '担当者';
    const fileArray = Array.from(files);
    showToast(`アップロード中…（${fileArray.length}枚）`);
    const uploadResults = new Array(fileArray.length).fill(null);
    await runWithLimit(fileArray, 3, async (file, idx) => {
      try {
        const dataUrl = await compressImage(file);
        const url = await storage.uploadPhoto(dataUrl, `${match.id}_${Date.now()}_${idx}.jpg`, match.id, staffName, 'sched');
        if (url) uploadResults[idx] = { staff: staffName, img: url, at: Date.now(), kind: 'gantt' };
      } catch (e) { showToast(e.message || '写真の保存に失敗しました'); }
    });
    const newPhotos = uploadResults.filter(Boolean);
    if (newPhotos.length === 0) { showToast('写真の添付に失敗しました'); return; }
    // 他のスタッフが直前・同時に同じ現場へ写真を追加しているかもしれないので、サーバーの最新状態を
    // 取り直してから合体する（同時に追加した相手の写真が消えてしまう事故を防ぐため）
    let latest = match;
    try {
      const fresh = await storage.get(`sched:${match.id}`, true);
      if (fresh && fresh.value) latest = JSON.parse(fresh.value);
    } catch (e) { /* 取得に失敗しても手元のデータで続行 */ }
    const updated = { ...latest, photos: [...(latest.photos || []), ...newPhotos] };
    await storage.set(`sched:${match.id}`, JSON.stringify(updated), true);
    applyLocalRecordUpdate('sched', updated);
    showToast('工程表の写真を添付しました');
    await completeTodo(t.id);
  }

  async function markFeatureDismissed(featureKey) {
    // まず端末側に即座に記録する。サーバー保存が電波不良で遅れたり失敗しても、
    // この端末で開き直した時に同じ動作確認がまた出てこないようにするため
    const local = getLocalDismissedFeatures();
    if (!local.includes(featureKey)) {
      local.push(featureKey);
      saveLocalDismissedFeatures(local);
    }
    try {
      let list = [];
      try {
        const r = await storage.get('meta:dismissedFeatures', true);
        if (r && r.value) list = JSON.parse(r.value);
      } catch (e) { list = []; }
      // サーバー側の最新リストと端末側の記録をマージしてから保存する（読み込みタイミングのズレで消えないように）
      const merged = Array.from(new Set([...list, ...local]));
      await storage.set('meta:dismissedFeatures', JSON.stringify(merged), true);
    } catch (e) { console.error(e); }
  }

  function toggleQuickTag(tag) {
    setTodoQuickTags((prev) => (prev.includes(tag) ? prev.filter((t) => t !== tag) : [...prev, tag]));

  async function addQuickTodos() {

  // TODOから該当の現場を開く（予定表タブに切り替えて編集画面を出す）
  function openTodoSite(t) {
    if (!t.siteName && !t.siteId) return;
    const match = (t.siteId && schedRecords.find((r) => r.id === t.siteId))
      || schedRecords.find((r) => r.name === t.siteName && (!t.date || r.date === t.date))
      || schedRecords.find((r) => r.name === t.siteName);
    setTab('sched');
    setSearch(t.siteName || '');

  async function loadDispatch(date) {
    setDispatchLoaded(false);
    const satDefault = isSaturday(date) ? 3 : 6;
    try {
      const r = await storage.get(`dispatch:${date}`, true);
      if (r && r.value) {
        const parsed = JSON.parse(r.value);
        setRegularTruckCount(parsed.regularTruckCount ?? satDefault);
        setIncludeKei(parsed.includeKei ?? true);
        setDumpOnlyCount(parsed.dumpOnlyCount ?? 0);
        setAssignments(parsed.assignments || {});
        setExtraSiteIds(parsed.extraSiteIds || []);
        setCollectNote(parsed.collectNote || '');
        setDumpNote(parsed.dumpNote || '');
      } else {
        setRegularTruckCount(satDefault);
        setIncludeKei(true);
        setDumpOnlyCount(0);
        setAssignments({});
        setExtraSiteIds([]);
        setCollectNote('');
        setDumpNote('');
      }
    } catch (e) {
      setRegularTruckCount(satDefault);
      setIncludeKei(true);
      setDumpOnlyCount(0);
      setAssignments({});
      setExtraSiteIds([]);
      setCollectNote('');
      setDumpNote('');
    }
    setDispatchLoaded(true);
  }

  const dispatchSaveChainRef = useRef(Promise.resolve());

  async function saveDispatch(nextAssignments, nextRegular, nextKei, nextDump, nextExtra, nextCollectNote, nextDumpNote) {
    const payload = {
      regularTruckCount: nextRegular,
      includeKei: nextKei,
      dumpOnlyCount: nextDump,
      assignments: nextAssignments,
      extraSiteIds: nextExtra !== undefined ? nextExtra : extraSiteIds,
      collectNote: nextCollectNote !== undefined ? nextCollectNote : collectNote,
      dumpNote: nextDumpNote !== undefined ? nextDumpNote : dumpNote,
    };
    const date = dispatchDate;
    // 保存が重なった時に古い内容が後から上書きしてしまわないよう、必ず送った順番で保存する
    const run = dispatchSaveChainRef.current.catch(() => {}).then(() => storage.set(`dispatch:${date}`, JSON.stringify(payload), true));
    dispatchSaveChainRef.current = run;
    await run;
  }

  function setAssignment(siteId, truckId) {
    const next = { ...assignments, [siteId]: truckId };
    setAssignments(next);
    saveDispatch(next, regularTruckCount, includeKei, dumpOnlyCount);
  }

  async function moveSiteToDate(record) {

  function addExtraSite(siteId) {

    const next = [...extraSiteIds, siteId];
    setExtraSiteIds(next);
    saveDispatch(assignments, regularTruckCount, includeKei, dumpOnlyCount, next);

    setExtraSiteIds(next);
    const nextAssign = { ...assignments };
    delete nextAssign[siteId];
    setAssignments(nextAssign);

  // 曜日ごとに「まとめて回りたいエリア」の考え方（洋子さんの配車ルールに準拠）
// 月・木＝川崎～横浜北部～東京方面／火・金＝相模原～県央～西湘方面／水・土＝横浜南部～横須賀～鎌倉～藤沢南方面
// 寒川・茅ヶ崎・藤沢北側・平塚近場などの境界エリアはどこにも固定せず、バランスを見て割り振る
const ZONE_RULES = [
  { days: [1, 4], name: '月木エリア（川崎・横浜北部・東京方面）', keywords: ['川崎', '青葉区', '横浜市緑区', '港北区', '神奈川区', '鶴見区', '旭区', '東京'] },
  { days: [2, 5], name: '火金エリア（相模原・県央・西湘方面）', keywords: ['相模原', '町田', '大和', '座間', '海老名', '厚木', '秦野', '足柄', '小田原', '大磯', '八王子', '平塚'] },
  { days: [3, 6], name: '水土エリア（横浜南部・横須賀・鎌倉・藤沢方面）', keywords: ['磯子区', '横浜市南区', '西区', '中区', '保土ヶ谷区', '横須賀', '葉山', '逗子', '鎌倉', '藤沢'] },
];
function zoneRuleForDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return ZONE_RULES.find((r) => r.days.includes(d.getDay())) || null;
}

async function autoAssignTrucks() {
    const opts = buildTruckOptions(regularTruckCount, includeKei, dumpOnlyCount);
    if (opts.length === 0) { showToast('トラックがありません'); return; }
    const counts = {};
    opts.forEach((o) => { counts[o.id] = 0; });
    Object.values(assignments).forEach((id) => { if (counts[id] !== undefined) counts[id]++; });

    // 地域名（○○区△△町など）はあくまでラベルであって、隣り合う地域名が実際には
    // すぐ近くにあることも多いため、地域名で区切らずその日の対象現場全体を
    // 実際の距離が近い順に1本のルートとしてつなげ、それを台数分に区切って割り振る。
    // 住所不明で場所が分からない現場（未分類）は、誤った割り振りを避けるため自動割り振りの対象外にする
    const eligible = [];
    let skippedUnknown = 0;
    daySites.forEach((s) => {
      if (assignments[s.id]) return; // すでに割り振り済みはそのまま
      const rawArea = s.area || extractArea(s.address) || '未分類';
      if (rawArea === '未分類') { skippedUnknown++; return; } // 場所が分からないので対象外
      eligible.push(s);
    });

    // まずキャッシュ済みの座標をまとめて取得し、キャッシュにない分だけGoogleへ問い合わせる。
    showToast('位置情報を確認して割り振り中…');
    const geocodeCache = {};
    try {
      const raw = await storage.listWithKeys('geocode:');
      raw.forEach((it) => { try { geocodeCache[it.key.slice('geocode:'.length)] = JSON.parse(it.value); } catch (e) {} });
    } catch (e) { /* 取得に失敗しても順番はそのまま続行する */ }
    const needGeocode = eligible.filter((s) => s.address && !isCoordOnlyAddress(s.address) && !geocodeCache[geocodeQuery(s.address)]);
    if (needGeocode.length > 0) {
      await runWithLimit(needGeocode, 5, async (s) => {
        const q = geocodeQuery(s.address);
        const loc = await geocodeAddress(q);
        if (loc) geocodeCache[q] = loc;
      });
    }
    // 地域名の区切りを気にせず、その日の対象現場全体を近い順に1本のルートにする
    const ordered = sortByProximity(eligible, geocodeCache, isCoordOnlyAddress, geocodeQuery);

    const target = Math.max(1, Math.ceil(ordered.length / opts.length)); // 1台あたりの目安件数

    const next = { ...assignments };
    let truckIdx = 0;
    ordered.forEach((s) => {
      // 今のトラックがすでに目安件数に達していて、次のトラックがまだ残っていれば進める
      // （ルート順につないでいるので、区切った先も自然と近い現場同士でまとまる）
      while (truckIdx < opts.length - 1 && counts[opts[truckIdx].id] >= target) {
        truckIdx++;
      }
      const truckId = opts[truckIdx].id;
      next[s.id] = truckId;
      counts[truckId]++;
    });

    setAssignmentsUndoSnapshot(assignments); // 実行前の状態を1回分だけ覚えておく（元に戻す用）
    setAssignments(next);
    saveDispatch(next, regularTruckCount, includeKei, dumpOnlyCount);
    showToast(skippedUnknown > 0
      ? `距離が近い順に割り振りました（住所不明の${skippedUnknown}件は未割当のままです）`
      : `距離が近い順に割り振りました（手動でも調整できます）`);
  }

  function undoAutoAssign() {
    if (!assignmentsUndoSnapshot) return;
    setAssignments(assignmentsUndoSnapshot);
    saveDispatch(assignmentsUndoSnapshot, regularTruckCount, includeKei, dumpOnlyCount);
    setAssignmentsUndoSnapshot(null);
    showToast('自動割り振り前の状態に戻しました');
  }

  function resetAllAssignments() {
    if (Object.keys(assignments).length === 0) { showToast('割り振りはまだありません'); return; }
    if (!window.confirm('この日の割り振りを全て空に戻します。よろしいですか？')) return;
    setAssignmentsUndoSnapshot(assignments); // リセットも1回分だけ元に戻せるようにしておく
    setAssignments({});
    saveDispatch({}, regularTruckCount, includeKei, dumpOnlyCount);
    showToast('割り振りを全てリセットしました');
  }

  const NEARBY_KM_THRESHOLD = 10; // これ以内なら「近い」として教える（洋子さんの指定）

  // 今日の現場と、前日・翌日の現場を距離で比較し、10km以内に近い現場があれば教える。
  // すぐるが曜日ルールで組んだスケジュールに含まれていない「気づいていないかもしれない近場」を
  // 見つけるための参考情報であって、自動で動かすものではない（最終判断は本人・洋子さんに任せる）。
  async function findNearbyAdjacentSites() {
    setNearbyHintsLoading(true);
    try {
      const yesterday = addDays(dispatchDate, -1);
      const tomorrow = addDays(dispatchDate, 1);
      const todaySet = new Set(daySites.map((s) => s.id));
      const adjacentSites = schedRecords.filter((r) => (r.date === yesterday || r.date === tomorrow) && !todaySet.has(r.id));
      if (adjacentSites.length === 0) { setNearbyHints([]); return; }

      const geocodeCache = {};
      try {
        const raw = await storage.listWithKeys('geocode:');
        raw.forEach((it) => { try { geocodeCache[it.key.slice('geocode:'.length)] = JSON.parse(it.value); } catch (e) {} });
      } catch (e) { /* 個別取得にフォールバック */ }

      const allTargets = [...daySites, ...adjacentSites];
      const needGeocode = allTargets.filter((s) => s.address && !isCoordOnlyAddress(s.address) && !geocodeCache[geocodeQuery(s.address)]);
      await runWithLimit(needGeocode, 5, async (s) => {
        const q = geocodeQuery(s.address);
        const loc = await geocodeAddress(q);
        if (loc) geocodeCache[q] = loc;
      });

      const locOf = (s) => {
        if (!s.address) return null;
        return isCoordOnlyAddress(s.address) ? coordFromAddressStr(s.address) : geocodeCache[geocodeQuery(s.address)];
      };

      const hints = [];
      daySites.forEach((today) => {
        const todayLoc = locOf(today);
        if (!todayLoc) return;
        adjacentSites.forEach((other) => {
          const otherLoc = locOf(other);
          if (!otherLoc) return;
          const km = haversineKm(todayLoc, otherLoc);
          if (km <= NEARBY_KM_THRESHOLD) {
            hints.push({ today, other, km, when: other.date === yesterday ? '前日' : '翌日' });
          }
        });
      });
      hints.sort((a, b) => a.km - b.km);
      setNearbyHints(hints);
    } catch (e) {
      showToast('近くの現場の確認に失敗しました');
      setNearbyHints([]);
    } finally {
      setNearbyHintsLoading(false);
    }
  }

  function saveCollectNote(value) {
    setCollectNote(value);
    saveDispatch(assignments, regularTruckCount, includeKei, dumpOnlyCount, extraSiteIds, value, dumpNote);
  }

  function saveDumpNoteValue(value) {
    setDumpNote(value);
    saveDispatch(assignments, regularTruckCount, includeKei, dumpOnlyCount, extraSiteIds, collectNote, value);
  }

  function changeRegularTruckCount(n) {
    const v = Math.max(0, n);
    setRegularTruckCount(v);
    saveDispatch(assignments, v, includeKei, dumpOnlyCount);
  }

  function toggleKei() {
    const v = !includeKei;
    setIncludeKei(v);
    saveDispatch(assignments, regularTruckCount, v, dumpOnlyCount);
  }

  function changeDumpOnlyCount(n) {
    const v = Math.max(0, n);
    setDumpOnlyCount(v);
    saveDispatch(assignments, regularTruckCount, includeKei, v);
  }

  function buildTruckOptions(regular, kei, dump) {
    const opts = [];
    for (let i = 1; i <= regular; i++) opts.push({ id: `R${i}`, label: `トラック${i}` });
    if (kei) opts.push({ id: 'KEI', label: '軽自動車' });
    for (let i = 1; i <= dump; i++) opts.push({ id: `D${i}`, label: `捨て専用${i}` });
    return opts;
  }

  function showToast(msg) { setToast(msg); setTimeout(() => setToast(''), 2500); }

  // 似た現場名（表記ゆれ違い）が既にあれば返す
  function findSimilarSiteName(name) {
    const trimmed = (name || '').trim();
    if (!trimmed) return null;
    const norm = normalizeSiteName(trimmed);
    const allNames = new Set([...schedRecords.map((r) => r.name), ...mgmtRecords.map((r) => r.name)]);
    for (const existing of allNames) {
      if (existing === trimmed) return null; // 完全一致は問題なし
      if (normalizeSiteName(existing) === norm) return existing;
    }
    return null;
  }

  function siteNameOptions() {
    const set = new Set([...schedRecords.map((r) => r.name), ...mgmtRecords.map((r) => r.name)]);
    return Array.from(set).filter(Boolean).sort();
  }

  function fillFromExistingSite(name) {
    if (editingId) return; // 既存の編集中は上書きしない
    const trimmed = (name || '').trim();
    if (!trimmed) return;
    const match = schedRecords.find((r) => r.name.trim() === trimmed);
    if (!match) return;
    setForm((f) => ({
      ...f,
      supervisorName: f.supervisorName || match.supervisorName || '',
      supervisorPhone: f.supervisorPhone || match.supervisorPhone || '',
      houseNumber: f.houseNumber || match.houseNumber || '',
      garaRequired: f.garaRequired || match.garaRequired || false,
      keiTruckRequired: f.keiTruckRequired || match.keiTruckRequired || false,
      expectedVisits: match.expectedVisits || f.expectedVisits || '12',
      area: f.area || match.area || '',
      address: f.address || match.address || '',
    }));
  }

  // 監督名から電話番号を自動入力（同じ組頭＝工務店内で、過去に登録がある場合のみ。
  // 「高橋さん」等の同姓が他の工務店にいても混同しないよう、組頭名も一致するものだけを対象にする）
  function fillPhoneFromSupervisorName(name) {
    const trimmed = (name || '').trim();
    if (!trimmed || form.supervisorPhone) return; // 電話番号が既に入力済みなら上書きしない
    const phone = findSupervisorPhone(form.kumiten, trimmed);
    if (!phone) return;
    setForm((f) => (f.supervisorPhone ? f : { ...f, supervisorPhone: phone }));
    showToast(`${form.kumiten}の${trimmed}さんの電話番号を自動入力しました`);
  }

  function openNew() {
    setForm(tab === 'sched' ? emptySched() : emptyMgmt());
    setEditingId(null);
    setPendingPhotos([]);
    setShowForm(true);
  }

  // 同じ現場名・同じ日付の重複登録がないかチェック（一括入力と手入力が重なった時用）
  function findDuplicateGroups() {
    const map = {};
    schedRecords.forEach((r) => {
      const key = `${r.date}__${normalizeSiteName(r.name)}`;
      if (!map[key]) map[key] = [];
      map[key].push(r);
    });
    return Object.values(map).filter((g) => g.length > 1);
  }

  // 同じ住所で日付が違う登録（TimeTreeの日程変更で古い日付の分が消えずに残った時など、
  // 現場名の表記が微妙に違っていても住所は同じなので、こちらは名前ではなく住所で突き合わせる）。
  // 予定表（sched）は基本的に1現場につき「次の予定」が1件だけのはずなので、同じ住所が
  // 違う日付で複数残っているのは重複の可能性が高い。
  function findAddressDuplicateGroups() {
    const map = {};
    schedRecords.forEach((r) => {
      const addr = (r.address || '').trim();
      if (!addr) return; // 住所未入力・座標のみでないものだけ対象
      if (!map[addr]) map[addr] = [];
      map[addr].push(r);
    });
    return Object.values(map).filter((g) => g.length > 1 && new Set(g.map((r) => r.date)).size > 1);
  }

  function openEdit(r) {
    setForm(r);
    setEditingId(r.id);
    setPendingPhotos([]);
    setShowForm(true);
  }

  function handoffToMgmt(schedRecord) {
    setForm({ ...emptyMgmt(), name: schedRecord.name, kumiten: schedRecord.kumiten, staff: schedRecord.staff || '', date: todayStr(), supervisorName: schedRecord.supervisorName || '' });
    setEditingId(null);
    setPendingPhotos([]);
    setTab('mgmt');
    setShowForm(true);
  }

  // 「移動」＝新しい日付の予定を作って保存した時点で、元の予定は自動的にゴミ箱行き（30日間は復元可能）にする。
  // form の _moveFromId に元のレコードIDを覚えておき、saveRecord() 側で保存成功後に処理する。
  function duplicateRecord(r, dayOffset = 7) {
    const { id, createdAt, photos, ...rest } = r;
    const newDate = addDays(r.date, dayOffset);
    const entry = { from: r.date, to: newDate, by: deviceStaff || r.staff || '（担当者不明）', at: new Date().toISOString() };
    const dateHistory = [...(r.dateHistory || []), entry].slice(-10);
    setForm({ ...rest, date: newDate, photos: [], dateHistory, _moveFromId: r.id });
    setEditingId(null);
    setPendingPhotos([]);
    setShowForm(true);
  }

  // duplicateRecord() で開いた「移動」のフォームを保存した後、元のレコードをゴミ箱に移してから削除する
  async function moveOriginalToTrash(prefix, id) {
    const source = prefix === 'sched' ? schedRecords : mgmtRecords;
    const record = source.find((r) => r.id === id);
    try {
      if (record) {
        await storage.set(`trash:${id}`, JSON.stringify({ ...record, _type: prefix, deletedAt: new Date().toISOString() }), true);
      }
      await storage.delete(`${prefix}:${id}`, true);
      lastLocalWriteRef.current = Date.now();
      if (prefix === 'sched') setSchedRecords((prev) => prev.filter((r) => r.id !== id));
      else setMgmtRecords((prev) => prev.filter((r) => r.id !== id));
    } catch (e) { console.error(e); }
  }

  async function saveRecord() {
    if (!form.name.trim()) { showToast('現場名を入力してください'); return; }
    setSaving(true);
    // 新規登録の直前にサーバーの最新データを取り直して重複チェックする。
    // 端末のローカルデータ（schedRecords）だけを見ると、他の端末やパソコンで少し前に
    // 登録されたばかりの現場がまだ反映されておらず、重複に気づけないことがあるため
    // （例：パソコンで一括インポートした直後、スマホ側はまだ古いデータのまま）。
    if (tab === 'sched' && !editingId) {
      try {
        const freshSched = await storage.listWithValues('sched:');
        const key = `${form.name.trim()}__${form.date || ''}`;
        const dup = freshSched.find((r) => `${(r.name || '').trim()}__${r.date || ''}` === key);
        if (dup) {
          const when = dup.createdAt ? formatDateTime(dup.createdAt) : '不明';
          const proceed = window.confirm(`「${form.name.trim()}」（${form.date}）はすでに登録されているようです（工務店：${dup.kumiten || '未設定'}／担当：${dup.staff || '不明'}／登録：${when}）。\nそれでも新規登録しますか？`);
          if (!proceed) { setSaving(false); return; }
        }
      } catch (e) { /* 確認に失敗しても登録自体は止めない */ }
    }
    const prefix = tab === 'sched' ? 'sched' : 'mgmt';
    const id = editingId || `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    const { _moveFromId, ...formRest } = form;
    let record = { ...formRest, id, createdAt: form.createdAt || Date.now() };
    if (tab === 'sched' && record.address && !record.area) {
      record = { ...record, area: extractArea(record.address) };
    }
    // 日付を動かした時だけ、誰が・いつ・何日から何日に変更したかを記録しておく（予定表のみ）。
    // 動かしてはいけない現場が動いていた時に、あとで担当者に確認できるようにするため。
    if (tab === 'sched' && editingId) {
      const before = schedRecords.find((r) => r.id === editingId);
      if (before && before.date && record.date && before.date !== record.date) {
        const entry = { from: before.date, to: record.date, by: deviceStaff || form.staff || '（担当者不明）', at: new Date().toISOString() };
        record = { ...record, dateHistory: [...(record.dateHistory || []), entry].slice(-10) };
      }
    }
    let extraPhotos = [];
    if (pendingPhotos.length > 0) {
      showToast(`写真をアップロード中…（${pendingPhotos.length}枚）`);
      // 連棟などで枚数が多い時にまとめて待たされないよう、少しずつ並行してアップロードする
      const staffName = deviceStaff || form.staff || '担当者';
      const uploadResults = new Array(pendingPhotos.length).fill(null);
      let queuedCount = 0;
      await runWithLimit(pendingPhotos, 3, async (file, idx) => {
        try {
          const dataUrl = await compressImage(file);
          const url = await storage.uploadPhoto(dataUrl, `${id}_${Date.now()}_${idx}.jpg`, id, staffName, prefix);
          if (url) {
            uploadResults[idx] = { staff: staffName, img: url, at: Date.now() };
          } else {
            queuedCount++;
          }
        } catch (e) { showToast(e.message || '写真の保存に失敗しました'); }
      });
      extraPhotos = uploadResults.filter(Boolean);
      if (queuedCount > 0) showToast(`一部の写真（${queuedCount}枚）は保留中です。あとで自動的に追加されます`);
    }
    if (editingId) {
      // 編集フォームを開いている間に他のスタッフが同じ現場へ写真を追加しているかもしれない。
      // このフォーム自体は写真を削除する手段がないので、保存直前にサーバーの最新の写真一覧を
      // 取り直してベースにし、そこにこの端末で新しく撮った分だけ追加する
      // （フォームを開いた時点の古い写真一覧で丸ごと上書きして消してしまう事故を防ぐため）
      try {
        const fresh = await storage.get(`${prefix}:${id}`, true);
        if (fresh && fresh.value) {
          const freshRecord = JSON.parse(fresh.value);
          record = { ...record, photos: freshRecord.photos || [] };
        }
      } catch (e) { /* 取得に失敗しても手元のデータで続行 */ }
    }
    if (extraPhotos.length > 0) {
      record = { ...record, photos: [...(record.photos || []), ...extraPhotos] };
    }
    try {
      const result = await storage.set(`${prefix}:${id}`, JSON.stringify(record), true);
      if (_moveFromId && _moveFromId !== id) {
        await moveOriginalToTrash(prefix, _moveFromId);
        showToast(result.queued ? '移動を保留しました。電波が戻り次第、自動的に送信されます' : '移動しました（元の予定はゴミ箱へ）');
      } else {
        showToast(result.queued ? '保存を保留しました。電波が戻り次第、自動的に送信されます' : '保存しました');
      }
      setShowForm(false);
      setEditingId(null);
      setPendingPhotos([]);
      applyLocalRecordUpdate(prefix, record);
    } catch (e) { showToast('保存に失敗しました'); }
    setSaving(false);
  }

  // 保存直後は全件を読み直さず、その場で一覧・カレンダーに反映する（サーバーへの再取得を待たない分、体感が速くなる）
  function applyLocalRecordUpdate(prefix, record) {
    lastLocalWriteRef.current = Date.now(); // しばらく自動更新でのload()を待たせ、保存直後の巻き戻りを防ぐ
    if (prefix === 'sched') {
      setSchedRecords((prev) => {
        const next = [record, ...prev.filter((r) => r.id !== record.id)];
        next.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        setCachedRecords(next, mgmtRecords, kumitenList, todos);
        syncAutoTodos(next, todos);
        return next;
      });
    } else {
      setMgmtRecords((prev) => {
        const next = [record, ...prev.filter((r) => r.id !== record.id)];
        next.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        setCachedRecords(schedRecords, next, kumitenList, todos);
        return next;
      });
    }
  }

  // 管理表の「これで何回目の収集か」を表示するための計算。
  // TimeTreeから移した現場は、それより前に何回訪問したか分からないので、回数を出すと逆に間違った数字になる。
  // 「新規」ステータスの記録がある現場だけ、そこを1回目として数えられる（新規の記録がなければ表示しない）。
  function mgmtVisitNumber(record) {
    if (!record || !record.name) return null;
    const sameName = mgmtRecords
      .filter((m) => (m.name || '').trim() === record.name.trim())
      .sort((a, b) => {
        const d = (a.date || '').localeCompare(b.date || '');
        if (d !== 0) return d;
        return (a.createdAt || 0) - (b.createdAt || 0);
      });
    const firstNewIdx = sameName.findIndex((m) => m.status === '新規');
    if (firstNewIdx === -1) return null; // 新規の記録が見つからない＝過去の回数が不明
    const idx = sameName.findIndex((m) => m.id === record.id);
    if (idx < firstNewIdx) return null; // 新規より前の記録（通常は起こらないが念のため）
    return idx - firstNewIdx + 1;
  }

  // 予定表側の「これまで何回収集したか」バッジも同じ考え方にする。
  // 以前は単純に管理表の件数をそのまま数えていたため、TimeTreeから移した現場（新規の記録がない）は
  // 実際は何度も訪問しているのに「0回」と出て、逆に少なく・誤解を招く表示になっていた。
  // 新規の記録が見つかる現場だけ数えて返し、見つからなければnull（バッジ自体を出さない）。
  function mgmtReliableVisitCount(name) {
    const sameName = mgmtRecords
      .filter((m) => (m.name || '').trim() === (name || '').trim())
      .sort((a, b) => {
        const d = (a.date || '').localeCompare(b.date || '');
        if (d !== 0) return d;
        return (a.createdAt || 0) - (b.createdAt || 0);
      });
    const firstNewIdx = sameName.findIndex((m) => m.status === '新規');
    if (firstNewIdx === -1) return null;
    return sameName.length - firstNewIdx;
  }

  async function runBulkImport() {
    const lines = bulkImportText.split('\n').map((l) => l.trim()).filter((l) => l.length > 0);
    if (lines.length === 0) { showToast('貼り付けるデータがありません'); return; }
    // 同じ現場名・同じ日付の予定がすでにある場合は重複として取り込まない（TimeTreeからの移行と、
    // すでに手入力済みの新規現場が被って二重登録になるのを防ぐため）。現場名は完全一致のみで判定し、
    // 似ているだけの別現場を誤ってスキップしないようにする。
    const existingKeys = new Set(schedRecords.map((r) => `${(r.name || '').trim()}__${r.date || ''}`));
    const records = [];
    let skipped = 0;
    lines.forEach((line) => {
      const cols = line.split('\t');
      const [name, kumiten, address, date, time, status, supervisorName, supervisorPhone, gara, keiTruck, expectedVisits, staff, note] = cols;
      if (!name || name === '現場名') return; // ヘッダー行はスキップ
      const trimmedName = name.trim();
      const normalizedDate = normalizeDateStr(date);
      if (existingKeys.has(`${trimmedName}__${normalizedDate}`)) { skipped++; return; }
      const id = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      records.push({
        id, createdAt: Date.now(),
        name: trimmedName,
        kumiten: (kumiten || 'その他').trim(),
        address: (address || '').trim(),
        area: (address ? extractArea(address) : ''),
        date: normalizedDate,
        time: (time || '').trim(),
        status: (status || '新規').trim(),
        supervisorName: (supervisorName || '').trim(),
        supervisorPhone: (supervisorPhone || '').trim(),
        garaRequired: (gara || '').trim() === '○' || (gara || '').trim().toLowerCase() === 'true',
        keiTruckRequired: (keiTruck || '').trim() === '○' || (keiTruck || '').trim().toLowerCase() === 'true',
        expectedVisits: (expectedVisits || '').trim(),
        staff: (staff || deviceStaff || '').trim(),
        note: (note || '').trim(),
        // メルディアは一括取り込みでもハウスNoが未入力になりがちなので、他と同じく「対象外」を自動で入れておく
        houseNumber: (kumiten || '').trim() === 'メルディア' ? '対象外' : '',
      });
    });
    if (records.length === 0) {
      showToast(skipped > 0 ? `全て重複のため取り込みませんでした（${skipped}件）` : '取り込めるデータがありませんでした');
      return;
    }
    // 以前は「サーバーへの保存が全部終わるまで」件数入りのトースト（＝完了の合図）を待たせていたため、
    // 件数が多いほど画面にドット（取り込み中…）が出てから実際に「◯件取り込みました」と出るまでが長く感じた。
    // 画面（予定表・工程表）へはこの時点でもう反映済みなので、サーバー保存の完了を待たずに先に完了を知らせ、
    // 保存自体は裏で並行して進める（万が一失敗した分は自動リトライされる）。
    records.forEach((record) => applyLocalRecordUpdate('sched', record));
    setShowBulkImport(false);
    setBulkImportText('');
    setBulkImportBusy(false);
    showToast(skipped > 0 ? `${records.length}件取り込みました（重複${skipped}件はスキップ）` : `${records.length}件取り込みました`);
    // サーバー（スプレッドシート）側は同時に複数件書き込むと、お互いの書き込みが競合して
    // 一部が消えてしまうことがあるため、裏での保存は同時並行ではなく1件ずつ順番に行う。
    // 画面には既に反映済みなので、待たされている感覚はない。
    runWithLimit(records, 1, async (record) => {
      await storage.set(`sched:${record.id}`, JSON.stringify(record));
    }).catch(() => {});
  }

  function copyUpdateTemplate() {
    const header = '現場名\t監督名\t監督電話\tハウスNo・事業場コード';
    navigator.clipboard.writeText(header)
      .then(() => showToast('テンプレート行をコピーしました。Excelに貼り付けてください'))
      .catch(() => showToast('コピーできませんでした。手動で選択してコピーしてください'));
  }

  // Googleカレンダーの「予定を検索」結果画面のテキストをそのまま貼り付けて、管理表（回収実績）に
  // 一括登録するためのパーサー。日付見出し（例：2026年9月1日(火)）→ タイトル行 → 内訳の行、という並びを想定。
  // 「不明」は監督名不明という意味の注記なので、現場名からは自動で取り除く（洋子さんの指示通り）。
  function parseMgmtBulkText(text) {
    const rawLines = text.split('\n').map((l) => l.trim()).filter((l) => l.length > 0);
    const entries = [];
    const unmatchedKumiten = [];
    let currentDate = null;
    let pendingTitle = null;
    rawLines.forEach((line) => {
      const dateMatch = line.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
      if (dateMatch) {
        currentDate = `${dateMatch[1]}-${String(dateMatch[2]).padStart(2, '0')}-${String(dateMatch[3]).padStart(2, '0')}`;
        pendingTitle = null;
        return;
      }
      if (/件の予定/.test(line)) return;
      if (/検索結果をカレンダーで表示する/.test(line)) return;
      if (pendingTitle === null) {
        pendingTitle = line;
        return;
      }
      // ここが内訳の行（例：「終日、木1.2 断熱材0.7 プラ0.4 段ボール0.3 混廃0.2」）
      // 「終日、」だけでなく「10:00〜11:00、」のような時間指定の予定にも対応。それ以外の内容
      // （数量以外のメモが付いていても）はそのままメモ欄に丸ごと残す
      const itemsText = line.replace(/^(終日|\d{1,2}:\d{2}\s*[~〜～]\s*\d{1,2}:\d{2}|\d{1,2}:\d{2})[、,]?\s*/, '').trim();
      const prefixEntry = MGMT_KUMITEN_PREFIXES.find(([prefix]) => pendingTitle.startsWith(prefix));
      const kumiten = prefixEntry ? prefixEntry[1] : 'その他';
      let siteName = prefixEntry ? pendingTitle.slice(prefixEntry[0].length).trim() : pendingTitle.trim();
      siteName = siteName.replace(/\s*不明\s*$/, '').trim();
      // メルディアは現場名の後ろに「◯◯さん」の形で監督名が付くことがある。
      // 「さん」付きの末尾語だけを監督名として切り出す（それ以外は現場名として一切いじらない＝推測しない）
      let supervisorName = '';
      if (kumiten === 'メルディア') {
        const supMatch = siteName.match(/^(.+?)[\s　]+([^\s　]+?)さん$/);
        if (supMatch) {
          siteName = supMatch[1].trim();
          supervisorName = supMatch[2].trim();
        }
      }
      if (!prefixEntry) unmatchedKumiten.push(pendingTitle);
      entries.push({ date: currentDate, kumiten, name: siteName, items: itemsText, rawTitle: pendingTitle, supervisorName });
      pendingTitle = null;
    });
    return { entries, unmatchedKumiten };
  }

  function previewMgmtBulkImport() {
    if (!mgmtBulkImportText.trim()) { showToast('貼り付ける内容がありません'); return; }
    const { entries, unmatchedKumiten } = parseMgmtBulkText(mgmtBulkImportText);
    if (entries.length === 0) { showToast('内容を読み取れませんでした。カレンダーの検索結果をそのまま貼り付けてください'); return; }
    setMgmtBulkImportPreview({ entries, unmatchedKumiten });
  }

    // 予定表側と同じく、先に画面へ反映し、完了の合図（トースト）もサーバー保存を待たずにすぐ出す。
    // 保存自体は裏で並行して進める（万が一失敗した分は自動リトライされる）。

    runWithLimit(records, 1, async (record) => {
      await storage.set(`mgmt:${record.id}`, JSON.stringify(record));

  async function runBulkUpdate() {
    const lines = bulkUpdateText.split('\n').map((l) => l.trim()).filter((l) => l.length > 0);
    if (lines.length === 0) { showToast('貼り付けるデータがありません'); return; }
    setBulkImportBusy(true);
    let updated = 0;
    for (const line of lines) {
      const cols = line.split('\t');
      const [name, supervisorName, supervisorPhone, houseNumber] = cols;
      if (!name || name === '現場名') continue;
      const matches = schedRecords.filter((r) => r.name.trim() === name.trim());
      for (const rec of matches) {
        const updatedRec = {
          ...rec,
          supervisorName: (supervisorName || '').trim() || rec.supervisorName,
          supervisorPhone: (supervisorPhone || '').trim() || rec.supervisorPhone,
          houseNumber: (houseNumber || '').trim() || rec.houseNumber,
        };
        try {
          await storage.set(`sched:${rec.id}`, JSON.stringify(updatedRec));
          updated++;
        } catch (e) { console.error(e); }
      }
    }
    setBulkImportBusy(false);
    showToast(`${updated}件更新しました`);
    setShowBulkUpdate(false);
    setBulkUpdateText('');
    load();
  }
